# Graphknows evaluation example configuration.

mcp:
  command: graphknows-mcp
  initialize: true
  request_timeout_s: 120

native:
  scope: both
  top_k: 5
  cleanup: true
  output_dir: evaluation/results/native

longmemeval:
  data_root: evaluation/data/longmemeval-v2
  ingest_strategy: batched_capsules
  max_questions: 1
  top_k: 5
  output_root: evaluation/results/longmemeval

memoryarena:
  domain: bundled_shopping
  offset: 0
  limit_per_domain: 2
  subtask_index: 1
  top_k: 5
  output_root: evaluation/results/memoryarena

hotpotqa:
  offset: 0
  limit: 3
  max_docs: 10
  max_chars_per_doc: 2500
  top_k: 5
  output_root: evaluation/results/hotpotqa
