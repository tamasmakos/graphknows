# docker-compose.dev.yaml — development overrides (hot-reload, source mounts)
# Usage: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
services:
  agent:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/agent:/app/agent:cached

  search:
    volumes:
      - ./services/search:/app/search:cached
      - ./data/raw:/data/raw

  frontend:
    command: uvicorn server:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./apps/web:/app:cached
