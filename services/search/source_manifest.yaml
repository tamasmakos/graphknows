# Source manifest — declarative EU data connector registry.
# Add a new connector here without touching application code.
#
# Fields:
#   id              - unique identifier; used as the key throughout the system
#   name            - human-readable display name
#   description     - what the source contains (shown to agents)
#   connector_class - dotted Python path to the SourceConnector subclass
#   jurisdictions   - list of jurisdiction codes (EU, UK, GLOBAL, …)
#   doc_types       - list of document type labels
#   temporal_coverage - human-readable date range
#   query_strengths - keywords describing when to prefer this source
#   language        - "en" | "multilingual" | ISO-639-1
#   rate_limit_rps  - max requests per second (enforced by HttpMixin)
#   requires_auth   - whether an API key is needed
#   enabled         - set false to exclude without removing the entry

sources:

  - id: eprs_briefings
    name: "European Parliament Research Service (EPRS)"
    description: >
      Policy briefings, impact assessments, and in-depth analyses published
      by the European Parliament Research Service. Covers all major EU policy
      areas. Best for high-quality, synthesised EU policy overviews.
    connector_class: services.search.connectors.sources.eprs_briefings.EPRSBriefingsConnector
    jurisdictions: [EU]
    doc_types: [policy_brief, committee_report]
    temporal_coverage: "2014–present"
    query_strengths:
      - EU policy overview
      - legislative impact
      - EU institutional analysis
      - European Parliament positions
    language: en
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: eurlex
    name: "EUR-Lex (EU Legislation Database)"
    description: >
      Official EU legislation: regulations, directives, decisions, treaties,
      and international agreements. Indexed by CELEX number. Authoritative
      primary source for any EU legal act.
    connector_class: services.search.connectors.sources.eurlex.EurLexConnector
    jurisdictions: [EU]
    doc_types: [legislation, regulation, directive, treaty]
    temporal_coverage: "1952–present"
    query_strengths:
      - EU law text
      - specific regulation lookup
      - CELEX retrieval
      - legislative history
      - directive transposition
    language: multilingual
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: ep_debates
    name: "European Parliament Plenary Debates"
    description: >
      Verbatim transcripts of European Parliament plenary debates.
      Records MEP speeches, voting explanations, and committee interventions.
      Best for understanding political positions and parliamentary dynamics.
    connector_class: services.search.connectors.sources.ep_debates.EPDebatesConnector
    jurisdictions: [EU]
    doc_types: [parliamentary_debate]
    temporal_coverage: "2004–present"
    query_strengths:
      - MEP positions
      - political debate
      - party group stance
      - parliament vote
      - EU political dynamics
    language: multilingual
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: ep_resolutions
    name: "European Parliament Resolutions"
    description: >
      Non-legislative resolutions adopted by the European Parliament.
      Expresses parliament's official position on policy, external affairs,
      and institutional matters.
    connector_class: services.search.connectors.sources.ep_resolutions.EPResolutionsConnector
    jurisdictions: [EU]
    doc_types: [parliamentary_resolution]
    temporal_coverage: "2004–present"
    query_strengths:
      - EP official position
      - human rights
      - foreign policy stance
      - non-legislative EU policy
    language: multilingual
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: council_conclusions
    name: "Council of the EU — Conclusions & Decisions"
    description: >
      Formal conclusions, press releases, and outcome documents from
      Council of the EU meetings. Reflects member state positions and
      intergovernmental agreements.
    connector_class: services.search.connectors.sources.council_conclusions.CouncilConclusionsConnector
    jurisdictions: [EU]
    doc_types: [parliamentary_resolution, press_release]
    temporal_coverage: "2010–present"
    query_strengths:
      - Council position
      - member state agreement
      - EU summit outcome
      - intergovernmental negotiations
    language: en
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: ec_press
    name: "European Commission Press Releases"
    description: >
      Official press releases, statements, and communications from the
      European Commission. Covers policy announcements, infringement
      proceedings, and institutional news.
    connector_class: services.search.connectors.sources.ec_press.ECPressConnector
    jurisdictions: [EU]
    doc_types: [press_release]
    temporal_coverage: "2010–present"
    query_strengths:
      - Commission announcement
      - policy launch
      - infringement case
      - EU executive position
      - Commissioner statement
    language: en
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: ecb_publications
    name: "European Central Bank Publications"
    description: >
      ECB economic bulletins, working papers, speeches, and policy reports.
      Authoritative source for eurozone monetary policy, financial stability,
      and macroeconomic analysis.
    connector_class: services.search.connectors.sources.ecb_publications.ECBPublicationsConnector
    jurisdictions: [EU]
    doc_types: [policy_brief, press_release]
    temporal_coverage: "1999–present"
    query_strengths:
      - monetary policy
      - eurozone economy
      - inflation
      - banking regulation
      - financial stability
      - ECB decision
    language: en
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: eca_reports
    name: "European Court of Auditors — Special Reports"
    description: >
      Performance and compliance audit reports from the EU's external auditor.
      Evaluates value-for-money of EU spending programmes and institutional
      governance. Authoritative source for EU financial accountability.
    connector_class: services.search.connectors.sources.eca_reports.ECAReportsConnector
    jurisdictions: [EU]
    doc_types: [audit_report, committee_report]
    temporal_coverage: "2010–present"
    query_strengths:
      - EU spending audit
      - EU financial accountability
      - programme evaluation
      - ECA findings
    language: en
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: cellar_sparql
    name: "EU CELLAR SPARQL (Publications Office)"
    description: >
      SPARQL access to the EU Publications Office linked-data store.
      Covers legislation, press releases, decisions, and Council conclusions
      using the CDM ontology. Returns metadata with EUR-Lex deep links.
    connector_class: services.search.connectors.sources.cellar_sparql.CellarSPARQLConnector
    jurisdictions: [EU]
    doc_types: [legislation, press_release, decision]
    temporal_coverage: "1952–present"
    query_strengths:
      - linked data retrieval
      - CELEX lookup
      - CDM ontology
      - EU legislation structured query
    language: multilingual
    rate_limit_rps: 0.5
    requires_auth: false
    enabled: true

  - id: wikipedia_eu
    name: "Wikipedia — EU & Political Topics"
    description: >
      Wikipedia articles on EU institutions, political figures, policies,
      and events. Useful for background context, entity disambiguation,
      and overview of complex topics. Secondary source only.
    connector_class: services.search.connectors.sources.wikipedia_eu.WikipediaEUConnector
    jurisdictions: [EU, GLOBAL]
    doc_types: [policy_brief]
    temporal_coverage: "2001–present"
    query_strengths:
      - background context
      - entity overview
      - historical context
      - concept explanation
    language: en
    rate_limit_rps: 2.0
    requires_auth: false
    enabled: true

  - id: ep_open_data
    name: "EP Open Data Portal"
    description: >
      European Parliament Open Data Portal (JSON-LD/DCAT-AP). Provides
      structured access to EP documents, votes, and plenary records via
      a REST API. Official machine-readable EP data.
    connector_class: services.search.connectors.sources.ep_open_data.EpOpenDataConnector
    jurisdictions: [EU]
    doc_types: [parliamentary_document, vote_record, plenary_document]
    temporal_coverage: "2014–present"
    query_strengths:
      - EP structured data
      - vote records
      - plenary documents
      - MEP activity
      - EP official API
    language: multilingual
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true

  - id: data_europa
    name: "data.europa.eu (EU Open Data Hub)"
    description: >
      EU Open Data Portal aggregator covering datasets from EU institutions,
      agencies, and member state open data portals. Returns DCAT-AP dataset
      cards with links to original distributions.
    connector_class: services.search.connectors.sources.data_europa.DataEuropaConnector
    jurisdictions: [EU, MEMBER_STATES]
    doc_types: [dataset, open_data]
    temporal_coverage: "2012–present"
    query_strengths:
      - open datasets
      - EU statistics
      - machine-readable data
      - DCAT catalogue
      - member state data
    language: multilingual
    rate_limit_rps: 2.0
    requires_auth: false
    enabled: true

  - id: uk_legislation
    name: "UK Legislation (legislation.gov.uk)"
    description: >
      Acts of Parliament, Statutory Instruments, and secondary legislation
      for England, Wales, Scotland, and Northern Ireland. Official text
      including amendments.
    connector_class: services.search.connectors.sources.uk_legislation.UKLegislationConnector
    jurisdictions: [UK]
    doc_types: [legislation, regulation]
    temporal_coverage: "1267–present"
    query_strengths:
      - UK law
      - Act of Parliament
      - statutory instrument
      - UK regulatory framework
      - post-Brexit legislation
    language: en
    rate_limit_rps: 1.0
    requires_auth: false
    enabled: true
