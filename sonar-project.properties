# SonarQube Cloud — project identity
# sonar.organization is set by the SONAR_TOKEN environment variable in CI.
# Fill in after creating the project at https://sonarcloud.io
sonar.projectKey=tamasmakos_graphknows
sonar.organization=tamasmakos

# Human-readable display name
sonar.projectName=graphknows
sonar.projectVersion=1.0

# ---------------------------------------------------------------------------
# Source scope — graphknows package only (agent/search are separate services)
# ---------------------------------------------------------------------------
sonar.sources=graphknows
sonar.exclusions=\
  **/graphgen/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/dist/**

sonar.tests=tests

# No sonar.test.inclusions: it used to enumerate 17 individual files, none of
# which still exist (tests/memory/test_adapter.py, tests/retrieval/test_neo4j_store.py,
# ...). Sonar therefore analysed ZERO tests. An explicit list of test files is a
# list that goes stale silently; the whole tests/ tree is the correct scope.

# ---------------------------------------------------------------------------
# Language
# ---------------------------------------------------------------------------
sonar.language=python
sonar.python.version=3.11, 3.13

# ---------------------------------------------------------------------------
# Coverage (generated by pytest-cov in CI, uploaded as artifact)
# ---------------------------------------------------------------------------
sonar.python.coverage.reportPaths=coverage.xml

# Coverage exclusions - deliberately minimal.
#
# **/retrieval/** used to be excluded wholesale. That is the most-churned
# package in the repo and the home of both the BM25 channel that silently never
# ran BM25 and the reranker that was a no-op: exempting it from the coverage
# gate exempted exactly the code that has actually shipped defects. Removed.
#
# What remains is process entrypoints, which run infrastructure rather than
# logic and are exercised by integration tests instead.
sonar.coverage.exclusions=**/__main__.py,**/server/web/server.py,**/server/mcp/stdio_server.py,**/migrations/**
