[project]
name = "agent"
version = "0.1.0"
description = "Graphknows Agent Service — ReAct agent over the knowledge graph"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Graph & databases
    "neo4j>=5.21.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    # LLM
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.1.0",
    # Observability
    "python-json-logger>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
