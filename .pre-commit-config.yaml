repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args:
          - --maxkb=1000
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args:
          - --config=ruff.toml
          - --fix
          - --exit-non-zero-on-fix
        types_or:
          - python
          - pyi
      - id: ruff-format
        args:
          - --config=ruff.toml
        types_or:
          - python
          - pyi
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        name: mypy (graphknows)
        files: ^graphknows/(?!utils/)
        args:
          - --strict
          - --ignore-missing-imports
          - --allow-untyped-decorators
          - --no-warn-unused-ignores
        additional_dependencies:
          - pydantic>=2.7.0
          - pydantic-settings>=2.2.0
          - python-dotenv>=1.0.0
          - types-PyYAML>=6.0.0
  - repo: https://github.com/pycqa/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (security scan)
        args:
          - -r
          - graphknows/
          - --skip
          - B101,B104,B105,B110,B112
          # Must be bandit's own -x: pre-commit's `exclude:` only filters the
          # filenames passed to a hook, and this hook uses pass_filenames: false.
          - -x
          - graphknows/utils
        pass_filenames: false
  - repo: local
    hooks:
      - id: sonar-pre-commit
        name: Sonar pre-commit scan
        entry: sonar hook git-pre-commit --
        language: system
        pass_filenames: true
        stages:
          - pre-commit
