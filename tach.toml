# tach.toml — module boundary enforcement for graphknows
# Target architecture (2026-05-31): config is the composition root,
# ingestion owns domain/ontology plugins, and memory owns reads + writes.

source_roots = ["."]

[[modules]]
path = "graphknows.ingestion.domain"
depends_on = []

[[modules]]
path = "graphknows.config"
depends_on = []

[[modules]]
path = "graphknows.config.adapters"
depends_on = [ "graphknows.graphgen", "graphknows.memory.stores"]

[[modules]]
path = "graphknows.ingestion.ontology"
depends_on = [
  "graphknows.ingestion.domain",
]

[[modules]]
path = "graphknows.ingestion"
depends_on = []

[[modules]]
path = "graphknows.graphgen"
depends_on = [
  "graphknows.config",
  "graphknows.ingestion.domain",
]

[[modules]]
path = "graphknows.memory.models"
depends_on = ["graphknows.memory"]

[[modules]]
path = "graphknows.memory.stores"
depends_on = [
  "graphknows.ingestion.domain",
  "graphknows.memory.ltm",
]

[[modules]]
path = "graphknows.memory.query"
depends_on = [
  "graphknows.memory.models",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
]

[[modules]]
path = "graphknows.memory.services"
depends_on = [
  "graphknows.config.adapters",
]

[[modules]]
path = "graphknows.memory.stm"
depends_on = [
  "graphknows.ingestion",
  "graphknows.memory.models",
  "graphknows.memory.stores", "graphknows.memory.query", "graphknows.memory",
]

[[modules]]
path = "graphknows.memory.ltm"
depends_on = [
  "graphknows.memory.models",
]

[[modules]]
path = "graphknows.memory.workflows"
depends_on = [
  "graphknows.ingestion.domain",
  "graphknows.ingestion.ontology",
  "graphknows.memory",
  "graphknows.memory.stm", "graphknows.config.builders", "graphknows.mcp",
]

[[modules]]
path = "graphknows.memory"
depends_on = [
  "graphknows.config.adapters",
  "graphknows.ingestion",
  "graphknows.ingestion.domain",
  "graphknows.memory.ltm",
  "graphknows.memory.models",
  "graphknows.memory.query",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
]

[[modules]]
path = "graphknows.config.builders"
depends_on = [
  "graphknows.config",
  "graphknows.config.adapters",
  "graphknows.ingestion.ontology",
  "graphknows.memory",
  "graphknows.memory.stores",
  "graphknows.memory.workflows",
]

[[modules]]
path = "graphknows.mcp"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.memory.stores", "graphknows.memory.stm", "graphknows.mcp.tools",
]

[[modules]]
path = "graphknows.mcp.tools"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.ingestion.domain",
  "graphknows.mcp",
  "graphknows.web",
  "graphknows.memory",
  "graphknows.memory.query",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
  "graphknows.memory.workflows",
]

[[modules]]
path = "graphknows.web"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
]
