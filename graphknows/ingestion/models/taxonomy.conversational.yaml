      her daughter", "really disappointed", "happy to be home".
    classification_tokens:
      - EMOTION
      - FEELING
      - MOOD
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Personal attributes and traits ─────────────────────────────────────────
  ATTRIBUTE:
    children:
      - ATTRIBUTE
      - TRAIT
      - CHARACTERISTIC
      - SKILL
      - PROFESSION
    aliases:
      - attribute
      - trait
      - characteristic
      - skill
      - profession
      - job
      - occupation
      - career
