<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Graphknows — Political Intelligence</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #161b22;
    --bg3: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --blue: #388bfd;
    --blue-dark: #1f4e8c;
    --purple: #7c3aed;
    --accent: #58a6ff;
    --card: #1c2333;
    --radius: 10px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    height: 100vh;
    flex: 1;
    overflow: hidden;
  }

  /* ── Left Panel ── */
  #left {
    width: 40%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--bg2);
    overflow: hidden;
  }

  #header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #58a6ff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  #session-row {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #session-id {
    font-family: monospace;
    font-size: 10px;
    color: var(--accent);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Chat area */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-track { background: transparent; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-user {
    align-self: flex-end;
    background: var(--blue-dark);
    border: 1px solid var(--blue);
    color: #cfe2ff;
    padding: 10px 14px;
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    max-width: 85%;
    line-height: 1.5;
  }

  .msg-agent {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px var(--radius) var(--radius) var(--radius);
    max-width: 92%;
    overflow: hidden;
  }
  .msg-agent .answer-body {
    padding: 12px 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-agent .answer-footer {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chip {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 11px;
    cursor: pointer;
    color: var(--accent);
    transition: border-color 0.2s;
  }
  .chip:hover { border-color: var(--accent); }
  .btn-export-msg {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-export-msg:hover { border-color: var(--accent); color: var(--accent); }

  /* Spinner */
  .spinner {
    align-self: flex-start;
    display: flex;
    gap: 5px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px var(--radius) var(--radius) var(--radius);
  }
  .spinner span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .spinner span:nth-child(2) { animation-delay: 0.2s; }
  .spinner span:nth-child(3) { animation-delay: 0.4s; }
  .spinner-time {
    font-style: normal;
    font-size: 11px;
    color: var(--text-muted);
    align-self: center;
    margin-left: 4px;
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  @keyframes nodeGlow {
    0% { filter: drop-shadow(0 0 8px #58a6ff); }
    100% { filter: drop-shadow(0 0 0px transparent); }
  }
  .node-new { animation: nodeGlow 1.5s ease-out forwards; }

  /* Input */
  #input-row {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: var(--bg2);
  }
  #msg-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    min-height: 44px;
    max-height: 120px;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text-muted); }
  #ask-btn {
    background: var(--blue);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 0 18px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  #ask-btn:hover { background: #58a6ff; }
  #ask-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* Reasoning trace */
  #trace-panel {
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
    max-height: 44%;
    display: flex;
    flex-direction: column;
  }
  #trace-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  #trace-header:hover { color: var(--text); }
  #trace-chevron { transition: transform 0.2s; font-size: 10px; }
  #trace-chevron.open { transform: rotate(180deg); }
  #trace-body {
    display: none;
    overflow-y: auto;
    padding: 10px 14px 14px;
    flex: 1;
  }
  #trace-body::-webkit-scrollbar { width: 4px; }
  #trace-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #trace-body.open { display: block; }

  /* Trace query group */
  .trace-group { margin-bottom: 14px; }
  .trace-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    padding: 4px 0;
    user-select: none;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .trace-group-header:hover { color: var(--text); }
  .trace-group-chevron { font-size: 9px; transition: transform 0.2s; }
  .trace-group-chevron.open { transform: rotate(90deg); }
  .trace-group-body { display: none; }
  .trace-group-body.open { display: block; }

  /* Trace step card */
  .trace-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .trace-card:hover { border-color: #444; }
  .trace-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    user-select: none;
  }
  .trace-badge {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
    font-family: monospace;
    flex-shrink: 0;
  }
  .trace-tool-icon { font-size: 14px; }
  .trace-tool-name {
    font-family: monospace;
    font-size: 11px;
    color: #a78bfa;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trace-card-expand { font-size: 9px; color: var(--text-muted); transition: transform 0.2s; }
  .trace-card-expand.open { transform: rotate(90deg); }

  .trace-card-body {
    display: none;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.5;
  }
  .trace-card-body.open { display: block; }

  .trace-thought {
    color: var(--text-muted);
    margin-bottom: 8px;
    font-style: italic;
    font-size: 11.5px;
  }
  .trace-action {
    background: #0d1117;
    border: 1px solid #2d333b;
    border-radius: 6px;
    padding: 6px 10px;
    font-family: monospace;
    font-size: 11px;
    color: #79c0ff;
    margin-bottom: 8px;
    overflow-x: auto;
    white-space: pre;
  }
  .trace-obs-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .trace-entity-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .trace-entity-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 600;
    padding: 2px 6px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
  }
  .trace-entity-table td {
    padding: 2px 6px;
    color: var(--text);
    border-bottom: 1px solid rgba(48,54,61,0.4);
  }
  .trace-entity-table tr:last-child td { border-bottom: none; }
  .trace-score { color: var(--text-muted); font-size: 10px; }

  .trace-chunk-list { list-style: none; }
  .trace-chunk-list li {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    padding-left: 16px;
    position: relative;
  }
  .trace-chunk-list li::before {
    content: attr(data-n);
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 600;
  }

  .trace-error-box {
    background: rgba(248,81,73,0.1);
    border: 1px solid rgba(248,81,73,0.4);
    color: #f85149;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
  }

  .trace-community-text {
    background: var(--bg3);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--text);
    font-style: italic;
  }

  .trace-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .trace-pill {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--text);
  }

  /* Final answer card */
  .trace-answer-card {
    background: var(--bg2);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 6px;
  }
  .trace-answer-card .trace-answer-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .trace-answer-card .trace-answer-text {
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .trace-answer-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .trace-cite-chip {
    background: #0d1117;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 2px 9px;
    font-size: 11px;
    cursor: pointer;
    color: var(--accent);
    transition: background 0.15s;
  }
  .trace-cite-chip:hover { background: rgba(88,166,255,0.12); }

  /* Observation sub-elements */
  .obs-empty { color: var(--text-muted); font-size: 11px; font-style: italic; }
  .obs-more { color: var(--text-muted); font-size: 10px; text-align: right; padding: 2px 6px; }
  .obs-name { color: var(--text); }
  .obs-chunk-id { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 3px; color: #7ee787; font-size: 10px; }
  .obs-excerpt { color: var(--text-muted); display: block; margin-top: 2px; font-size: 10px; }
  .obs-json { font-size: 10px; color: var(--text-muted); overflow-x: auto; max-height: 120px; margin: 0; }
  .trace-obs { margin-top: 4px; }
  .trace-card-final .trace-card-header { background: rgba(88,166,255,0.08); }
  .trace-card-final { border-color: var(--accent); }

  /* ── Right Panel ── */
  #right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  #graph-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #graph-title {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 4px;
    letter-spacing: 0.5px;
  }
  .toolbar-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.1); }
  #filter-select {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
  }
  #filter-select:focus { border-color: var(--accent); }

  /* Layout mode pills */
  #layout-group {
    display: flex;
    gap: 2px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .layout-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .layout-btn:hover { color: var(--text); }
  .layout-btn.active { background: var(--accent); color: #000; font-weight: 600; }

  #graph-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #graph-canvas svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Empty state */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    pointer-events: none;
  }
  #empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  #empty-state p { font-size: 13px; opacity: 0.6; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 1000;
    max-width: 280px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-name { font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 13px; }
  #tooltip .tt-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; font-size: 11px; }
  #tooltip .tt-key { color: var(--text-muted); min-width: 64px; flex-shrink: 0; }
  #tooltip .tt-val { color: var(--text); word-break: break-word; }
  #tooltip .tt-swatch {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 5px; vertical-align: middle;
  }
  #tooltip .tt-pill {
    display: inline-block; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 7px; margin: 1px; font-size: 10px; color: var(--accent);
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #161b22;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 13px;
    z-index: 9999;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    pointer-events: none;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 500px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
    padding: 24px;
  }
  #modal h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
  #modal p { font-size: 13px; line-height: 1.6; color: var(--text-muted); white-space: pre-wrap; }
  #modal-close {
    float: right;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    margin-top: -4px;
  }
  #modal-close:hover { color: var(--text); }

  /* Legend */
  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(22,27,34,0.95);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    pointer-events: all;
    user-select: none;
    max-width: 180px;
  }
  .legend-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .legend-section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 6px;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    cursor: pointer;
    border-radius: 4px;
    padding: 2px 4px;
    transition: background 0.15s;
    font-size: 11px;
  }
  .legend-item:hover { background: rgba(88,166,255,0.08); }
  .legend-item.filtered { background: rgba(88,166,255,0.15); }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-dot.diamond {
    border-radius: 2px;
    transform: rotate(45deg);
    width: 9px; height: 9px;
  }
  .legend-line {
    width: 18px; height: 2px;
    flex-shrink: 0;
    border-radius: 1px;
  }
  .legend-line.dashed {
    background: repeating-linear-gradient(to right, #888 0, #888 3px, transparent 3px, transparent 6px);
    height: 1px;
  }
  .legend-line.curved {
    background: #888;
    height: 1px;
    border-radius: 1px;
  }

  /* ── Sidebar ── */
  body {
    display: flex;
    overflow: hidden;
  }

  #sidebar {
    width: 200px;
    min-width: 200px;
    height: 100vh;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    z-index: 10;
  }

  #sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  #btn-new-session {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--accent);
    width: 22px;
    height: 22px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  #btn-new-session:hover { background: var(--accent); color: #000; border-color: var(--accent); }

  #session-list {
    list-style: none;
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #session-list::-webkit-scrollbar { width: 3px; }
  #session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .session-item {
    padding: 8px 10px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .session-item:hover { background: var(--bg3); }
  .session-item.active {
    border-left-color: var(--accent);
    background: rgba(88,166,255,0.08);
  }

  .session-item-name {
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .session-item-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-muted);
  }

  .session-node-badge {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 5px;
    font-size: 10px;
    color: var(--accent);
  }

  .session-rename-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    padding: 2px 5px;
    outline: none;
  }

  /* Responsive */
  @media (max-width: 700px) {
    html, body { overflow: auto; flex-direction: column; }
    #sidebar { width: 100%; height: auto; min-width: unset; flex-direction: row; border-right: none; border-bottom: 1px solid var(--border); }
    #session-list { display: flex; flex-direction: row; overflow-x: auto; padding: 0; }
    #app { flex-direction: column; height: auto; }
    #left { width: 100%; min-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    #right { height: 50vh; }
    #chat-area { overflow-y: auto; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <span>Investigations</span>
    <button id="btn-new-session" title="New investigation">+</button>
  </div>
  <ul id="session-list"></ul>
</aside>

<div id="app">
  <!-- ── Left Panel ── -->
  <div id="left">
    <div id="header">
      <h1>Graphknows</h1>
      <div class="subtitle">Political Intelligence</div>
      <div id="session-row">
        <span>Session:</span>
        <span id="session-id">—</span>
      </div>
    </div>

    <div id="chat-area"></div>

    <div id="input-row">
      <textarea id="msg-input" placeholder="Ask about politicians, organizations, laws…" rows="1"></textarea>
      <button id="ask-btn">Ask</button>
    </div>

    <div id="trace-panel">
      <div id="trace-header">
        <span>🔍 Reasoning Trace</span>
        <span id="trace-chevron">▲</span>
      </div>
      <div id="trace-body">
        <div class="trace-step" style="color:var(--text-muted);font-style:italic;font-size:12px;">No reasoning steps yet.</div>
      </div>
    </div>
  </div>

  <!-- ── Right Panel ── -->
  <div id="right">
    <div id="graph-toolbar">
      <span id="graph-title">KNOWLEDGE GRAPH</span>
      <!-- Layout mode pill group -->
      <div id="layout-group" role="group" aria-label="Graph layout mode">
        <button class="layout-btn active" data-layout="force" title="Force-directed layout">⚡ Force</button>
        <button class="layout-btn" data-layout="radial" title="Radial layout by node type">🎯 Radial</button>
        <button class="layout-btn" data-layout="hierarchical" title="Hierarchical layout">📊 Hierarchy</button>
        <button class="layout-btn" data-layout="circular" title="Circular layout">⭕ Circle</button>
      </div>
      <button class="toolbar-btn" id="btn-share" aria-label="Share link">🔗 Share Link</button>
      <button class="toolbar-btn" id="btn-export-png" aria-label="Export PNG">📤 Export PNG</button>
      <button class="toolbar-btn" id="btn-reset" aria-label="Reset graph">🔄 Reset</button>
      <select id="filter-select" aria-label="Filter by node type">
        <option value="">🔍 All Types</option>
        <option value="PERSON">PERSON</option>
        <option value="ORGANIZATION">ORGANIZATION</option>
        <option value="ORG">ORG</option>
        <option value="GEO">GEO</option>
        <option value="LAW">LAW</option>
        <option value="TOPIC">TOPIC</option>
        <option value="CONCEPT">CONCEPT</option>
        <option value="Chunk">Chunk</option>
      </select>
    </div>

    <div id="graph-canvas">
      <div id="empty-state">
        <div class="icon">🕸️</div>
        <p>Ask a question to build the knowledge graph</p>
      </div>
      <!-- svg inserted by D3 -->
      <div id="legend">
        <div class="legend-item" data-type="PERSON"><div class="legend-dot" style="background:steelblue"></div> PERSON</div>
        <div class="legend-item" data-type="ORG"><div class="legend-dot" style="background:mediumpurple"></div> ORG</div>
        <div class="legend-item" data-type="GEO"><div class="legend-dot" style="background:seagreen"></div> GEO</div>
        <div class="legend-item" data-type="LAW"><div class="legend-dot" style="background:darkorange"></div> LAW</div>
        <div class="legend-item" data-type="TOPIC"><div class="legend-dot" style="background:crimson"></div> TOPIC</div>
        <div class="legend-item" data-type="CONCEPT"><div class="legend-dot" style="background:goldenrod"></div> CONCEPT</div>
      </div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-label" id="tt-label"></div>
</div>

<!-- Toast -->
<div id="toast">Link copied!</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <h3 id="modal-title">Source</h3>
    <p id="modal-content"></p>
  </div>
</div>

<script>
// ── Utilities ──────────────────────────────────────────────────────────────
function uuid() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

function showToast(msg = 'Link copied!') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function openModal(title, content) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').textContent = content;
  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
});

// ── State ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
let sessionId = params.get('session') || null;

if (!sessionId) {
  sessionId = uuid();
}
function displaySessionId(id) {
  const el = document.getElementById('session-id');
  el.textContent = id.substring(0,8) + '…';
  el.title = id;
}
displaySessionId(sessionId);

// ── Session Persistence ─────────────────────────────────────────────────────
const SESSIONS_KEY = 'graphknows_sessions';

function getSessions() {
  try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]'); }
  catch(_) { return []; }
}

function setSessions(sessions) {
  localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
}

function saveSession(session) {
  const sessions = getSessions();
  const idx = sessions.findIndex(s => s.id === session.id);
  if (idx >= 0) sessions[idx] = session;
  else sessions.unshift(session);
  setSessions(sessions);
}

function getCurrentSessionData() {
  const sessions = getSessions();
  return sessions.find(s => s.id === sessionId) || null;
}

function autoNameSession(query) {
  const current = getCurrentSessionData();
  if (current && !current.name) {
    current.name = query.slice(0, 40);
    saveSession(current);
    renderSessionList();
  }
}

function renderSessionList() {
  const list = document.getElementById('session-list');
  const sessions = getSessions();
  list.innerHTML = '';
  sessions.forEach(sess => {
    const li = document.createElement('li');
    li.className = 'session-item' + (sess.id === sessionId ? ' active' : '');
    li.dataset.id = sess.id;

    const nameDiv = document.createElement('div');
    nameDiv.className = 'session-item-name';
    nameDiv.textContent = sess.name || 'New Investigation';
    nameDiv.title = 'Double-click to rename';

    const metaDiv = document.createElement('div');
    metaDiv.className = 'session-item-meta';

    const dateSpan = document.createElement('span');
    const d = new Date(sess.lastQuery || sess.created);
    dateSpan.textContent = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});

    const badge = document.createElement('span');
    badge.className = 'session-node-badge';
    badge.textContent = (sess.nodeCount || 0) + ' nodes';

    metaDiv.appendChild(dateSpan);
    metaDiv.appendChild(badge);
    li.appendChild(nameDiv);
    li.appendChild(metaDiv);

    li.addEventListener('click', () => switchSession(sess.id));
    nameDiv.addEventListener('dblclick', e => { e.stopPropagation(); startEditing(sess.id, nameDiv); });

    list.appendChild(li);
  });
}

function loadSessions() {
  // Ensure current session is in localStorage
  const sessions = getSessions();
  const exists = sessions.some(s => s.id === sessionId);
  if (!exists) {
    saveSession({ id: sessionId, name: '', created: new Date().toISOString(), nodeCount: 0, lastQuery: new Date().toISOString() });
  }
  renderSessionList();
}

async function switchSession(id) {
  if (id === sessionId) return;
  sessionId = id;
  displaySessionId(sessionId);
  resetAll();
  renderSessionList();
  // Restore graph from server
  try {
    const res = await fetch(`/api/session/${id}/graph`);
    if (res.ok) {
      const data = await res.json();
      if (data.nodes && data.edges) mergeGraph(data.nodes, data.edges);
    }
  } catch(_) {}
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('session', id);
  window.history.replaceState({}, '', url);
}

function newSession() {
  sessionId = uuid();
  displaySessionId(sessionId);
  resetAll();
  saveSession({ id: sessionId, name: '', created: new Date().toISOString(), nodeCount: 0, lastQuery: new Date().toISOString() });
  renderSessionList();
  const url = new URL(window.location);
  url.searchParams.set('session', sessionId);
  window.history.replaceState({}, '', url);
  msgInput.focus();
}

function startEditing(sessId, nameDiv) {
  const current = nameDiv.textContent;
  const input = document.createElement('input');
  input.className = 'session-rename-input';
  input.value = current === 'New Investigation' ? '' : current;
  nameDiv.replaceWith(input);
  input.focus();
  input.select();

  function commit() {
    const newName = input.value.trim() || current;
    const sessions = getSessions();
    const sess = sessions.find(s => s.id === sessId);
    if (sess) { sess.name = newName; setSessions(sessions); }
    renderSessionList();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
  });
}

// Initialize
loadSessions();

// ── Trace panel toggle ─────────────────────────────────────────────────────
const traceHeader = document.getElementById('trace-header');
const traceBody = document.getElementById('trace-body');
const traceChevron = document.getElementById('trace-chevron');
traceHeader.addEventListener('click', () => {
  const open = traceBody.classList.toggle('open');
  traceChevron.classList.toggle('open', open);
});

// ── Trace helpers ─────────────────────────────────────────────────────────

function toolIcon(toolName) {
  const icons = {
    search_entities: '🔍',
    search_chunks: '📄',
    get_neighbours: '🕸️',
    get_community: '🏘️',
    fuse_and_rank: '⚖️',
    get_chunks_for_entity: '🔗',
  };
  return icons[toolName] || '🔧';
}

function humanLabel(s) {
  if (!s) return '';
  return String(s).replace(/_/g, ' ');
}

function renderObservation(obsType, obs) {
  if (!obs || (Array.isArray(obs) && obs.length === 0)) {
    return '<span class="obs-empty">No results</span>';
  }
  if (obsType === 'entities' || obsType === 'neighbours') {
    const items = Array.isArray(obs) ? obs : [obs];
    const rows = items.slice(0, 8).map(e => {
      const label = (e.label || '').toLowerCase();
      return `<tr>
        <td><span class="trace-pill" style="font-size:9px">${escHtml(e.label || '?')}</span></td>
        <td class="obs-name">${escHtml(humanLabel(e.name || e))}</td>
        ${e.score != null ? `<td class="trace-score">${(+e.score).toFixed(3)}</td>` : '<td></td>'}
      </tr>`;
    }).join('');
    const more = items.length > 8 ? `<tr><td colspan="3" class="obs-more">+${items.length - 8} more</td></tr>` : '';
    return `<table class="trace-entity-table"><thead><tr><th>Type</th><th>Name</th><th>Score</th></tr></thead><tbody>${rows}${more}</tbody></table>`;
  }
  if (obsType === 'chunks' || obsType === 'ranked') {
    const items = Array.isArray(obs) ? obs : [obs];
    const lis = items.slice(0, 4).map((c, i) => {
      const id = escHtml(c.chunk_id || c.id || '?');
      const text = c.text ? escHtml(c.text.slice(0, 120)) + '…' : '';
      const score = c.rrf_score != null
        ? `<span class="trace-score">RRF ${c.rrf_score.toFixed(4)}</span>`
        : c.score != null ? `<span class="trace-score">${(+c.score).toFixed(3)}</span>` : '';
      return `<li data-n="${i + 1}"><code class="obs-chunk-id">${id}</code> ${score}${text ? `<span class="obs-excerpt">${text}</span>` : ''}</li>`;
    }).join('');
    return `<ul class="trace-chunk-list">${lis}</ul>`;
  }
  if (obsType === 'community') {
    const item = Array.isArray(obs) ? obs[0] : obs;
    if (!item) return '<span class="obs-empty">No community data</span>';
    return `<div class="trace-community-text">
      <strong>Community ${escHtml(String(item.community_id ?? item.id ?? '?'))}</strong>
      ${item.summary ? `<div>${escHtml(item.summary)}</div>` : ''}
      ${item.label ? `<div><em>${escHtml(item.label)}</em></div>` : ''}
    </div>`;
  }
  if (obsType === 'error' || (obs && obs.error)) {
    return `<div class="trace-error-box">⚠️ ${escHtml((obs.error || JSON.stringify(obs)).slice(0, 200))}</div>`;
  }
  // Fallback: pretty JSON
  return `<pre class="obs-json">${escHtml(JSON.stringify(obs, null, 2).slice(0, 400))}</pre>`;
}

function buildTraceCard(s) {
  const isFinal = s.final;
  const icon = isFinal ? '✅' : toolIcon(s.tool_name);
  const toolLabel = escHtml(s.tool_name || 'Final Answer');
  const thoughtSnippet = s.thought ? escHtml(s.thought.slice(0, 80)) + (s.thought.length > 80 ? '…' : '') : '';
  const obsHtml = (!isFinal && s.observation != null) ? renderObservation(s.observation_type, s.observation) : '';

  const card = document.createElement('div');
  card.className = 'trace-card' + (isFinal ? ' trace-card-final' : '');

  const header = document.createElement('div');
  header.className = 'trace-card-header';
  header.innerHTML = `
    <span class="trace-badge">${s.step}</span>
    <span class="trace-tool-icon">${icon}</span>
    <span class="trace-tool-name">${toolLabel}</span>
    <span class="trace-card-expand">▶</span>
  `;

  const body = document.createElement('div');
  body.className = 'trace-card-body' + (isFinal ? ' open' : '');
  body.innerHTML = `
    ${s.thought ? `<div class="trace-thought">${escHtml(s.thought)}</div>` : ''}
    ${s.action ? `<div class="trace-action">${escHtml(s.action)}</div>` : ''}
    ${obsHtml ? `<div class="trace-obs-label">${escHtml(s.observation_type || 'observation')}</div><div class="trace-obs">${obsHtml}</div>` : ''}
  `;

  header.addEventListener('click', () => {
    const open = body.classList.toggle('open');
    header.querySelector('.trace-card-expand').classList.toggle('open', open);
  });

  card.appendChild(header);
  card.appendChild(body);
  return card;
}

function renderTrace(question, steps, sources) {
  traceBody.innerHTML = '';

  // Auto-open trace panel
  traceBody.classList.add('open');
  traceChevron.classList.add('open');

  const group = document.createElement('div');
  group.className = 'trace-group';

  const groupHeader = document.createElement('div');
  groupHeader.className = 'trace-group-header';
  const chevron = document.createElement('span');
  chevron.className = 'trace-group-chevron open';
  chevron.textContent = '▶';
  groupHeader.appendChild(chevron);
  groupHeader.appendChild(document.createTextNode(' ❓ ' + question));

  const groupBody = document.createElement('div');
  groupBody.className = 'trace-group-body open';

  groupHeader.addEventListener('click', () => {
    const open = groupBody.classList.toggle('open');
    chevron.classList.toggle('open', open);
  });

  (steps || []).forEach(s => {
    groupBody.appendChild(buildTraceCard(s));
  });

  // Citation chips
  if (sources && sources.length > 0) {
    const citDiv = document.createElement('div');
    citDiv.className = 'trace-answer-chips';
    const label = document.createElement('span');
    label.style.cssText = 'font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-right:4px;';
    label.textContent = '📎 Sources:';
    citDiv.appendChild(label);
    sources.forEach(c => {
      const chip = document.createElement('a');
      chip.className = 'trace-cite-chip';
      chip.href = c.url || '#';
      chip.target = '_blank';
      chip.rel = 'noopener';
      chip.title = c.excerpt || c.text || '';
      chip.textContent = c.doc_id || c.chunk_id || 'source';
      citDiv.appendChild(chip);
    });
    groupBody.appendChild(citDiv);
  }

  group.appendChild(groupHeader);
  group.appendChild(groupBody);
  traceBody.appendChild(group);
}

function setTraceSteps(steps, question, sources) {
  if (!steps || steps.length === 0) return;
  renderTrace(question || 'Query', steps, sources || []);
}

// ── Chat ───────────────────────────────────────────────────────────────────
const chatArea = document.getElementById('chat-area');
const msgInput = document.getElementById('msg-input');
const askBtn = document.getElementById('ask-btn');

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function appendUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function appendSpinner() {
  const div = document.createElement('div');
  div.className = 'spinner';
  div.innerHTML = '<span></span><span></span><span></span><em class="spinner-time">0s…</em>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  const start = Date.now();
  div._timerInterval = setInterval(() => {
    const el = div.querySelector('.spinner-time');
    if (el) el.textContent = Math.floor((Date.now() - start) / 1000) + 's…';
  }, 1000);
  const origRemove = div.remove.bind(div);
  div.remove = () => { clearInterval(div._timerInterval); origRemove(); };
  return div;
}

function appendAgentMsg(answer, sources) {
  const card = document.createElement('div');
  card.className = 'msg-agent';

  const body = document.createElement('div');
  body.className = 'answer-body';
  body.textContent = answer;
  card.appendChild(body);

  const footer = document.createElement('div');
  footer.className = 'answer-footer';

  if (sources && sources.length > 0) {
    sources.forEach((src, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = `[${i+1}]`;
      chip.title = 'Click to view source';
      chip.addEventListener('click', () => openModal(`Source ${i+1}`, src.text || src));
      footer.appendChild(chip);
    });
  }

  const expBtn = document.createElement('button');
  expBtn.className = 'btn-export-msg';
  expBtn.textContent = '⬇ Export';
  expBtn.addEventListener('click', () => {
    const blob = new Blob([answer], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'graphknows-answer.txt';
    a.click();
  });
  footer.appendChild(expBtn);
  card.appendChild(footer);

  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
  return card;
}

function appendOfflineMsg() {
  const card = document.createElement('div');
  card.className = 'msg-agent';
  const body = document.createElement('div');
  body.className = 'answer-body';
  body.innerHTML = `⚠️ <strong>Agent offline</strong> — start <code>services/agent/</code> to continue.`;
  card.appendChild(body);
  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendErrorMsg(msg) {
  const card = document.createElement('div');
  card.className = 'msg-agent';
  card.style.borderColor = '#f85149';
  const body = document.createElement('div');
  body.className = 'answer-body';
  body.style.color = '#f85149';
  body.innerHTML = `🔴 <strong>Error</strong> — ${escHtml(msg)}`;
  card.appendChild(body);
  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function sendMessage(text) {
  appendUserMsg(text);
  const spinner = appendSpinner();
  askBtn.disabled = true;
  msgInput.disabled = true;

  // Try WebSocket first, fall back to HTTP
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsProto}//${location.host}/ws/chat/${sessionId}`;

  try {
    await sendMessageViaWebSocket(wsUrl, text, spinner);
  } catch(e) {
    console.warn('WS failed, falling back to HTTP', e);
    try { spinner.remove(); } catch(_) {}
    const spinner2 = appendSpinner();
    await sendMessageViaHTTP(text, spinner2);
  } finally {
    askBtn.disabled = false;
    msgInput.disabled = false;
    msgInput.focus();
  }
}

async function sendMessageViaWebSocket(wsUrl, text, spinner) {
  return new Promise((resolve, reject) => {
    let ws;
    try {
      ws = new WebSocket(wsUrl);
    } catch(e) {
      return reject(e);
    }

    ws.onopen = () => {
      ws.send(JSON.stringify({ message: text, session_id: sessionId }));
    };

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch(_) { return; }

      if (data.type === 'status') {
        // thinking — spinner already shown
      } else if (data.type === 'step') {
        // Live reasoning step — append a rich card to trace
        if (!traceBody.querySelector('.trace-group')) {
          renderTrace(text, [], []);
        }
        const groupBody = traceBody.querySelector('.trace-group-body');
        if (groupBody) {
          const stepObj = {
            step: data.step_num,
            thought: data.thought || '',
            action: data.action || '',
            tool_name: data.tool_name || '',
            observation_type: data.observation_type || 'unknown',
            observation: data.observation || null,
            final: false,
          };
          groupBody.appendChild(buildTraceCard(stepObj));
        }
        traceBody.scrollTop = traceBody.scrollHeight;
      } else if (data.type === 'answer') {
        spinner.remove();
        if (data.session_id) {
          sessionId = data.session_id;
          displaySessionId(sessionId);
        }
        appendAgentMsg(data.answer || '(no answer)', data.sources || []);
        if (data.graph) {
          mergeGraph(data.graph.nodes || [], data.graph.edges || []);
        }
        autoNameSession(text);
        saveSession({ ...getCurrentSessionData(), id: sessionId, nodeCount: allNodes.length, lastQuery: new Date().toISOString() });
        renderSessionList();
        ws.close();
        resolve();
      } else if (data.type === 'error') {
        spinner.remove();
        ws.close();
        reject(new Error(data.error));
      }
    };

    ws.onerror = (e) => {
      reject(new Error('WebSocket error'));
    };

    ws.onclose = () => {
      // resolve in case answer was already handled
    };
  });
}

async function sendMessageViaHTTP(text, spinner) {
  try {
    const payload = { message: text, session_id: sessionId };
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });

    spinner.remove();

    if (!res.ok) {
      if (res.status === 503) {
        appendOfflineMsg();
      } else {
        const err = await res.text();
        appendErrorMsg(`Error ${res.status}: ${err}`);
      }
      return;
    }

    const data = await res.json();

    if (data.error === 'agent_offline') {
      appendOfflineMsg();
      return;
    }

    if (data.session_id) {
      sessionId = data.session_id;
      displaySessionId(sessionId);
    }

    appendAgentMsg(data.answer || '(no answer)', data.sources || []);

    if (data.reasoning_steps || data.steps) {
      setTraceSteps(data.reasoning_steps || data.steps, text, data.sources || []);
    }

    if (data.graph) {
      // Also extract chunk nodes as sources if no server-side sources
      let sources = data.sources || [];
      if (sources.length === 0 && data.graph.nodes) {
        sources = data.graph.nodes
          .filter(n => (n.label === 'Chunk' || n.type === 'Chunk') && n.properties && n.properties.text)
          .map(n => ({ id: n.properties.id || n.id, text: n.properties.text }));
      }
      if (sources.length > 0) {
        // Retroactively update the last agent message's footer with chips
        const lastMsg = chatArea.querySelector('.msg-agent:last-child');
        const footer = lastMsg && lastMsg.querySelector('.answer-footer');
        if (footer) {
          // Remove existing chips (regenerate)
          footer.querySelectorAll('.chip').forEach(c => c.remove());
          sources.forEach((src, i) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = `[${i+1}]`;
            chip.title = 'Click to view source';
            chip.addEventListener('click', () => openModal(`Source ${i+1}`, src.text || src));
            footer.insertBefore(chip, footer.firstChild);
          });
        }
      }
      mergeGraph(data.graph.nodes || [], data.graph.edges || []);
    }

    autoNameSession(text);
    saveSession({ ...getCurrentSessionData(), id: sessionId, nodeCount: allNodes.length, lastQuery: new Date().toISOString() });
    renderSessionList();

  } catch(e) {
    try { spinner.remove(); } catch(_) {}
    appendOfflineMsg();
  }
}

// ── D3 Graph ───────────────────────────────────────────────────────────────
/**
 * Convert UNDERSCORE_CAPS entity names to Title Case for display.
 * @param {string} s - Raw entity name from the graph API.
 * @returns {string} Human-readable label.
 */
function humanLabel(s) {
  if (!s) return '';
  return s.replace(/_/g, ' ')
          .toLowerCase()
          .replace(/\b\w/g, c => c.toUpperCase());
}

/**
 * Return the fill colour for a node based on its type/label.
 * @param {object} d - D3 node datum.
 * @returns {string} CSS colour value.
 */
function nodeColor(d) {
  return COLORS[(d.properties && d.properties.label) || d.label] || COLORS[d.type] || '#666';
}

// ── D3 Graph ── (COLORS, canvas, svg setup)
const COLORS = {
  PERSON: 'steelblue',
  ORG: 'mediumpurple',
  GEO: 'seagreen',
  LAW: 'darkorange',
  TOPIC: 'crimson',
  CONCEPT: 'goldenrod',
  // Extended labels from actual API
  SOCIETY: 'mediumpurple',
  SITE: 'seagreen',
  REASON: 'darkorange',
  EVENT: 'crimson',
  ORGANIZATION: 'mediumpurple',
  ENTITY: '#888',
  Chunk: '#3a3a5c',
};

const graphCanvas = document.getElementById('graph-canvas');
const WIDTH = () => graphCanvas.clientWidth;
const HEIGHT = () => graphCanvas.clientHeight;

const svg = d3.select('#graph-canvas').append('svg')
  .attr('width', '100%')
  .attr('height', '100%');

// Zoom
const zoomG = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.1, 5]).on('zoom', e => {
  zoomG.attr('transform', e.transform);
}));

// Defs arrow
svg.append('defs').append('marker')
  .attr('id','arrowhead')
  .attr('viewBox','-0 -5 10 10')
  .attr('refX',28).attr('refY',0)
  .attr('orient','auto').attr('markerWidth',6).attr('markerHeight',6)
  .append('path').attr('d','M 0,-5 L 10,0 L 0,5').attr('fill','#555');

const linkG = zoomG.append('g').attr('class','links');
const nodeG = zoomG.append('g').attr('class','nodes');

let allNodes = [];
let allEdges = [];
let activeFilter = '';

const simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(160))
  .force('charge', d3.forceManyBody().strength(-500))
  .force('center', d3.forceCenter())
  .force('collision', d3.forceCollide(45));

function updateCenter() {
  simulation.force('center', d3.forceCenter(WIDTH()/2, HEIGHT()/2));
}

window.addEventListener('resize', () => { updateCenter(); simulation.alpha(0.3).restart(); });
updateCenter();

// ── Layout mode switcher ────────────────────────────────────────────
let currentLayout = 'force';

/**
 * A reference to the current graph data for layout functions.
 * Points to the allNodes/allEdges arrays.
 */
const graphData = { get nodes() { return allNodes; }, get edges() { return allEdges; } };

/**
 * Apply a graph layout mode by reconfiguring D3 forces or fixing node positions.
 * @param {'force'|'radial'|'hierarchical'|'circular'} mode
 */
function applyLayout(mode) {
  currentLayout = mode;
  document.querySelectorAll('.layout-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.layout === mode)
  );

  const W = graphCanvas.clientWidth || 900;
  const H = graphCanvas.clientHeight || 600;
  const cx = W / 2, cy = H / 2;

  // Remove all positional forces first
  simulation.force('radial', null).force('x', null).force('y', null);

  if (mode === 'force') {
    graphData.nodes.forEach(d => { d.fx = null; d.fy = null; });
    simulation
      .force('charge', d3.forceManyBody().strength(-500))
      .force('center', d3.forceCenter(cx, cy));
  } else if (mode === 'radial') {
    graphData.nodes.forEach(d => { d.fx = null; d.fy = null; });
    const radius = d => d.type === 'Topic' ? 0 : d.type === 'Chunk' ? 280 : 150;
    simulation
      .force('radial', d3.forceRadial(radius, cx, cy).strength(0.8))
      .force('center', null)
      .force('charge', d3.forceManyBody().strength(-80));
  } else if (mode === 'hierarchical') {
    const yPos = d => d.type === 'Topic' ? cy - 200 : d.type === 'Chunk' ? cy + 200 : cy;
    graphData.nodes.forEach(d => { d.fx = null; d.fy = yPos(d); });
    simulation
      .force('x', d3.forceX(cx).strength(0.05))
      .force('charge', d3.forceManyBody().strength(-150))
      .force('center', null);
  } else if (mode === 'circular') {
    const n = graphData.nodes.length;
    graphData.nodes.forEach((d, i) => {
      const angle = (2 * Math.PI * i) / n;
      d.fx = cx + 250 * Math.cos(angle);
      d.fy = cy + 250 * Math.sin(angle);
    });
    simulation.force('charge', null).force('center', null);
  }

  simulation.alpha(0.4).restart();
}

document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLayout(btn.dataset.layout));
});
const ttName = document.getElementById('tt-name');
const ttLabel = document.getElementById('tt-label');

function getVisibleNodes() {
  if (!activeFilter) return allNodes;
  return allNodes.filter(n => {
    const lbl = ((n.properties && n.properties.label) || n.label || '').toUpperCase();
    return lbl === activeFilter.toUpperCase();
  });
}

function getVisibleEdges(visNodes) {
  const ids = new Set(visNodes.map(n => n.id));
  return allEdges.filter(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    return ids.has(sid) && ids.has(tid);
  });
}

let selectedNode = null;

function renderGraph() {
  const visNodes = getVisibleNodes();
  const visEdges = getVisibleEdges(visNodes);

  // Links
  const link = linkG.selectAll('.link-g')
    .data(visEdges, d => `${typeof d.source==='object'?d.source.id:d.source}-${typeof d.target==='object'?d.target.id:d.target}-${d.type}`)
    .join(
      enter => {
        const g = enter.append('g').attr('class','link-g');
        g.append('line')
          .attr('class','edge-line')
          .attr('stroke','#444')
          .attr('stroke-width',1.5)
          .attr('marker-end','url(#arrowhead)');
        // Background rect for edge label readability
        g.append('rect')
          .attr('class','edge-label-bg')
          .attr('fill','rgba(15,17,23,0.8)')
          .attr('rx',3).attr('ry',3);
        g.append('text')
          .attr('class','edge-label')
          .attr('fill','#999')
          .attr('font-size','11px')
          .attr('text-anchor','middle')
          .attr('dominant-baseline','middle')
          .text(d => d.type || '');
        return g;
      }
    );

  // Nodes
  const node = nodeG.selectAll('.node-g')
    .data(visNodes, d => d.id)
    .join(
      enter => {
        const g = enter.append('g').attr('class','node-g').style('cursor','pointer');

        g.append('circle')
          .attr('r', 20)
          .attr('fill', d => nodeColor(d))
          .attr('stroke','#1c2333')
          .attr('stroke-width', 2)
          .style('opacity', 0)
          .transition().duration(400)
          .style('opacity', 1);

        g.append('text')
          .attr('y', 34)
          .attr('text-anchor','middle')
          .attr('font-size','10px')
          .attr('fill','#aaa')
          .style('opacity', 0)
          .text(d => humanLabel(((d.properties && d.properties.name) || d.name || d.id || '').substring(0, 20)))
          .transition().duration(400)
          .style('opacity', 1);

        g.call(d3.drag()
          .on('start', (event, d) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
          })
          .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
          .on('end', (event, d) => {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
          })
        );

        g.on('mouseover', (event, d) => {
          // Build sources list from graph edges
          const sources = allEdges
            .filter(e => (typeof e.target === 'object' ? e.target.id : e.target) === d.id && e.type === 'MENTIONS')
            .map(e => { const src = typeof e.source === 'object' ? e.source.id : e.source; return src.replace(/^chunk-/, '').replace(/-[^-]+$/, ''); })
            .slice(0, 3);
          const connections = allEdges.filter(e =>
            (typeof e.source === 'object' ? e.source.id : e.source) === d.id ||
            (typeof e.target === 'object' ? e.target.id : e.target) === d.id
          ).length;
          const tip = document.getElementById('tooltip');
          tip.innerHTML = `
            <div class="tt-name">${humanLabel((d.properties && d.properties.name) || d.name || d.id)}</div>
            <div class="tt-row"><span class="tt-key">Type</span><span class="tt-val"><span class="tt-swatch" style="background:${nodeColor(d)};display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle"></span>${(d.properties && d.properties.label) || d.type || d.label || 'Unknown'}</span></div>
            ${d.properties && d.properties.date ? `<div class="tt-row"><span class="tt-key">Date</span><span class="tt-val">${d.properties.date}</span></div>` : ''}
            ${d.properties && d.properties.institution ? `<div class="tt-row"><span class="tt-key">Source</span><span class="tt-val">${d.properties.institution}</span></div>` : ''}
            ${sources.length ? `<div class="tt-row"><span class="tt-key">Docs</span><span class="tt-val">${sources.join(', ')}</span></div>` : ''}
            <div class="tt-row"><span class="tt-key">Links</span><span class="tt-val">${connections}</span></div>
            ${d.properties && d.properties.summary ? `<div class="tt-row"><span class="tt-key">Summary</span><span class="tt-val">${d.properties.summary.slice(0, 120)}…</span></div>` : ''}
          `;
          tip.classList.add('visible');
          tip.style.left = (event.pageX + 14) + 'px';
          tip.style.top  = (event.pageY - 10) + 'px';
        });
        g.on('mousemove', event => {
          const tip = document.getElementById('tooltip');
          tip.style.left = (event.pageX + 14) + 'px';
          tip.style.top  = (event.pageY - 10) + 'px';
        });
        g.on('mouseleave', () => {
          setTimeout(() => document.getElementById('tooltip').classList.remove('visible'), 200);
        });

        g.on('click', (event, d) => {
          event.stopPropagation();
          selectedNode = selectedNode === d.id ? null : d.id;
          highlightConnected();
        });

        return g;
      }
    );

  svg.on('click', () => { selectedNode = null; highlightConnected(); });

  simulation
    .nodes(visNodes)
    .on('tick', () => {
      linkG.selectAll('.link-g').each(function(d) {
        const g = d3.select(this);
        const sx = d.source.x || 0, sy = d.source.y || 0;
        const tx = d.target.x || 0, ty = d.target.y || 0;
        const mx = (sx+tx)/2, my = (sy+ty)/2;
        g.select('.edge-line').attr('x1',sx).attr('y1',sy).attr('x2',tx).attr('y2',ty);
        const lbl = g.select('.edge-label').attr('x', mx).attr('y', my);
        const bbox = lbl.node() ? lbl.node().getBBox() : {x:mx, y:my, width:0, height:0};
        g.select('.edge-label-bg')
          .attr('x', bbox.x - 3).attr('y', bbox.y - 2)
          .attr('width', bbox.width + 6).attr('height', bbox.height + 4);
      });
      nodeG.selectAll('.node-g').attr('transform', d => `translate(${d.x||0},${d.y||0})`);
    });

  simulation.force('link').links(visEdges);
  simulation.alpha(0.5).restart();

  // Toggle empty state
  document.getElementById('empty-state').style.display = allNodes.length === 0 ? 'flex' : 'none';
}

function highlightConnected() {
  if (!selectedNode) {
    linkG.selectAll('.edge-line').attr('stroke','#444').attr('stroke-width',1.5).attr('opacity',1);
    nodeG.selectAll('circle').attr('opacity',1);
    return;
  }
  const connected = new Set([selectedNode]);
  allEdges.forEach(e => {
    const sid = typeof e.source==='object'?e.source.id:e.source;
    const tid = typeof e.target==='object'?e.target.id:e.target;
    if (sid === selectedNode) connected.add(tid);
    if (tid === selectedNode) connected.add(sid);
  });

  linkG.selectAll('.edge-line').each(function(d) {
    const sid = typeof d.source==='object'?d.source.id:d.source;
    const tid = typeof d.target==='object'?d.target.id:d.target;
    const active = sid === selectedNode || tid === selectedNode;
    d3.select(this)
      .attr('stroke', active ? '#58a6ff' : '#2a2a2a')
      .attr('stroke-width', active ? 2.5 : 1)
      .attr('opacity', active ? 1 : 0.2);
  });

  nodeG.selectAll('circle').attr('opacity', d => connected.has(d.id) ? 1 : 0.25);
}

function mergeGraph(newNodes, newEdges) {
  const existingIds = new Set(allNodes.map(n => n.id));
  const freshIds = new Set();
  newNodes.forEach(n => {
    if (!existingIds.has(n.id)) {
      allNodes.push(n);
      existingIds.add(n.id);
      freshIds.add(n.id);
    }
  });

  const edgeKey = e => {
    const s = typeof e.source==='object'?e.source.id:e.source;
    const t = typeof e.target==='object'?e.target.id:e.target;
    return `${s}-${t}-${e.type}`;
  };
  const existingEdgeKeys = new Set(allEdges.map(edgeKey));
  newEdges.forEach(e => {
    if (!existingEdgeKeys.has(edgeKey(e))) {
      allEdges.push({...e});
      existingEdgeKeys.add(edgeKey(e));
    }
  });

  renderGraph();

  // Glow newly added nodes
  if (freshIds.size > 0) {
    setTimeout(() => {
      nodeG.selectAll('.node-g').each(function(d) {
        if (freshIds.has(d.id)) {
          const el = d3.select(this);
          el.classed('node-new', true);
          setTimeout(() => el.classed('node-new', false), 1600);
        }
      });
    }, 50);
  }
}

function resetAll() {
  // Clear chat history
  chatArea.innerHTML = '';
  // Reset trace
  traceBody.innerHTML = '<div class="trace-step" style="color:var(--text-muted);font-style:italic;font-size:12px;">No reasoning steps yet.</div>';
  // Clear graph
  allNodes = [];
  allEdges = [];
  selectedNode = null;
  nodeG.selectAll('*').remove();
  linkG.selectAll('*').remove();
  document.getElementById('empty-state').style.display = 'flex';
}

function resetGraph() {
  allNodes = [];
  allEdges = [];
  selectedNode = null;
  nodeG.selectAll('*').remove();
  linkG.selectAll('*').remove();
  document.getElementById('empty-state').style.display = 'flex';
}

document.getElementById('filter-select').addEventListener('change', e => {

// ── Session restore ────────────────────────────────────────────────────────
async function restoreSession(id) {
  try {
    const res = await fetch(`/api/session/${id}/graph`);
    if (res.ok) {
      const data = await res.json();
      if (data.nodes && data.edges) {
        mergeGraph(data.nodes, data.edges);
      }
    }
  } catch(e) { /* ignore */ }
}

if (params.get('session')) {
  restoreSession(sessionId);
}
