# docker-compose.yaml — production service definitions
# Override with docker-compose.dev.yaml for local development
# Usage: docker compose up -d
#        docker compose --profile observability up -d   (adds Langfuse)
version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/changeme}"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${PGVECTOR_DB:-vectordb}"
      POSTGRES_USER: "${PGVECTOR_USER:-postgres}"
      POSTGRES_PASSWORD: "${PGVECTOR_PASSWORD:-changeme}"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-postgres} -d ${PGVECTOR_DB:-vectordb}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Session Graph (ephemeral per-session overlay) ────────────────────────────
  # Memgraph on port 7688 (host) to avoid collision with Neo4j on 7687
  # Uses memgraph/memgraph-mage for bundled MAGE graph algorithms (Leiden, PageRank)
  # Bolt-compatible: use neo4j Python driver with URI=bolt://memgraph:7687 (in Docker)
  #                                               URI=bolt://172.18.0.1:7688 (from host)
  memgraph:
    image: memgraph/memgraph-mage:latest
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7688}:7687"
      - "${MEMGRAPH_HTTP_PORT:-7444}:7444"
    environment:
      MEMGRAPH_STORAGE_MODE: IN_MEMORY_ANALYTICAL
    volumes:
      - memgraph_data:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1' | mgconsole --host localhost --port 7687 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Application Services ────────────────────────────────────────────────────

  graphknows:
    build:
      context: .
      dockerfile: services/graphknows/Dockerfile
    command: python -m graphknows.run
    environment:
      # Neo4j
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      # pgvector
      PGVECTOR_DSN: "${PGVECTOR_DSN:-postgresql://postgres:changeme@pgvector:5432/vectordb}"
      # Memgraph
      MEMGRAPH_URI: "${MEMGRAPH_URI:-bolt://memgraph:7687}"
      # LLM
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      LLM_GROQ_API_KEY: "${LLM_GROQ_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      # Embedding
      EMBED_MODEL: "${EMBED_MODEL:-BAAI/bge-small-en-v1.5}"
      # Filesystem (graphgen pipeline artefacts)
      INPUT_DIR: "${GRAPHGEN_INPUT_DIR:-/data/input}"
      OUTPUT_DIR: "${GRAPHGEN_OUTPUT_DIR:-/data/output}"
      GRAPHKNOWS_ENV: "${GRAPHKNOWS_ENV:-development}"
    ports:
      - "${GRAPHKNOWS_PORT:-8025}:8025"
    volumes:
      - graphknows_input:/data/input
      - graphknows_output:/data/output
    depends_on:
      neo4j:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8025/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      PGVECTOR_HOST: "${PGVECTOR_HOST:-pgvector}"
      PGVECTOR_PORT: "${PGVECTOR_PORT:-5432}"
      PGVECTOR_DB: "${PGVECTOR_DB:-vectordb}"
      PGVECTOR_USER: "${PGVECTOR_USER:-postgres}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-changeme}"
      MEMGRAPH_URI: "${MEMGRAPH_URI:-bolt://memgraph:7687}"
      HYBRIDRAG_URL: "${HYBRIDRAG_URL:-http://graphknows:8025}"
      GRAPHGEN_URL: "${GRAPHGEN_URL:-http://graphknows:8025}"
      GRAPHKNOWS_URL: "${GRAPHKNOWS_URL:-http://graphknows:8025}"
      SEARCH_URL: "${SEARCH_URL:-http://search:8000}"
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GRAPHKNOWS_ENV: "${GRAPHKNOWS_ENV:-development}"
    ports:
      - "8030:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      graphknows:
        condition: service_started
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    environment:
      GRAPHGEN_URL: "${GRAPHGEN_URL:-http://graphknows:8025}"
      GRAPHKNOWS_ENV: "${GRAPHKNOWS_ENV:-development}"
      # Canonical raw-document store — bind-mounted from host so scrapers and
      # the search service always read/write the same files.
      RAW_DATA_DIR: "/data/raw"
    ports:
      - "${SEARCH_PORT:-8040}:8000"
    volumes:
      - ./data/raw:/data/raw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      AGENT_URL: "${AGENT_URL:-http://agent:8000}"
      PORT: "8080"
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      agent:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Observability (optional profile) ────────────────────────────────────────

  langfuse:
    image: langfuse/langfuse:2.95.0
    profiles: [ "observability" ]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${LANGFUSE_DATABASE_URL:-postgresql://langfuse:langfuse@langfuse-db:5432/langfuse}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}"
      SALT: "${LANGFUSE_SALT:-change-me-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16.6-alpine
    profiles: [ "observability" ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U langfuse -d langfuse" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langfuse_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  pgvector_data:
  memgraph_data:
  graphknows_input:
  graphknows_output:
  langfuse_data:

#  7474 neo4j HTTP   7687 neo4j Bolt   7688 memgraph Bolt   5432 pgvector
#  8025 graphknows   8030 agent        8040 search
#  8080 frontend     3000 langfuse (observability profile)
