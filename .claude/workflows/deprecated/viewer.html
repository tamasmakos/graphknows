<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflows</title>
<style>
:root{color-scheme:light dark;
  --bg:#f7f7f9;--panel:#fff;--ink:#1a1a20;--mute:#6b7280;--line:#e2e4e9;
  --side:#16161d;--side-ink:#d8d9e0;--accent:#7c6cf0;
  --deep:#b45309;--deep-bg:#fef3c7;--run:#047857;--run-bg:#d1fae5;--mech:#475569;--mech-bg:#e2e8f0}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f14;--panel:#17171f;--ink:#e6e6ec;--mute:#8b8fa0;--line:#26262f;
  --side:#0b0b10;--side-ink:#c9cad4;
  --deep:#fbbf24;--deep-bg:#3b2f0b;--run:#34d399;--run-bg:#0b3226;--mech:#94a3b8;--mech-bg:#1e293b}}
*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
#side{width:280px;flex:none;background:var(--side);color:var(--side-ink);padding:20px 16px;overflow:auto}
#side h2{margin:0 0 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.wf{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;
  margin-bottom:2px;color:inherit;font:inherit;cursor:pointer}
.wf:hover{background:#ffffff14}
.wf.on{background:var(--accent);color:#fff}
.wf b{display:block;font-weight:600}
.wf span{font-size:12px;opacity:.65}
.totals{margin:18px 0;padding-top:14px;border-top:1px solid #ffffff1a;font-size:12px;color:var(--mute)}
#q{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ffffff1f;background:#ffffff0d;
  color:inherit;font:inherit}
#hits{font-size:12px;color:var(--mute);margin-top:6px}
#main{flex:1;overflow:auto;padding:32px 36px 90px;max-width:1000px}
h1{margin:0 0 6px;font-size:26px}
.desc{margin:0 0 12px;font-size:16px;color:var(--ink)}
.when,.args{margin:0 0 10px;font-size:13px;color:var(--mute);max-width:72ch}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.phase header{display:flex;align-items:center;gap:8px}
.phase h3{margin:0;font-size:15px}
.phase .count{margin-left:auto;font-size:12px;color:var(--mute)}
.det{margin:6px 0 12px;font-size:13px;color:var(--mute)}
.link{height:18px;margin-left:28px;border-left:2px solid var(--line)}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:6px;
  padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  color:inherit;font:inherit;cursor:pointer}
.node:hover{border-color:var(--accent)}
.node.dim{opacity:.22}
.node.child{border-style:dashed}
.node .n{font-size:11px;color:var(--mute);min-width:18px}
.node .lbl{font-weight:600;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.grow{flex:1}
.chars{font-size:11px;color:var(--mute);min-width:38px;text-align:right}
.chip{font-size:10.5px;padding:2px 7px;border-radius:99px;white-space:nowrap}
.chip.deep{background:var(--deep-bg);color:var(--deep)}
.chip.run{background:var(--run-bg);color:var(--run)}
.chip.mech,.chip.text,.chip.inst{background:var(--mech-bg);color:var(--mech)}
.chip.schema{background:var(--run-bg);color:var(--run)}
.jump{font-size:11px;color:var(--accent);font-weight:600}
.fan{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
.fan-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fan-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.fan-row .node{margin-top:4px}
.tail{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
.tail h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.tail ul{margin:0;padding-left:18px;font-size:13px}
.muted{color:var(--mute)}
.stale{color:#f87171}
pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
  overflow:auto;max-height:60vh;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#drawer{display:none;position:fixed;top:0;right:0;width:min(660px,52vw);height:100%;
  background:var(--panel);border-left:1px solid var(--line);padding:20px 24px;overflow:auto}
#drawer.open{display:block}
#drawer h2{margin:0 0 4px;font-size:17px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
#drawer .meta{margin:0 0 14px;font-size:12px;color:var(--mute)}
#drawer pre{max-height:none}
#close{position:sticky;top:0;float:right;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;color:inherit;font:inherit;font-size:12px;cursor:pointer}
</style></head><body>
<script>const BUILT="2026-08-31 15:18";const DATA=[{"name":"process-issues","description":"Open GitHub issues -> baseline -> plan -> red test -> implement -> dogfood -> review -> verify -> docs -> wheel gate -> file follow-ups -> draft PR -> CI green -> merge","whenToUse":"Pick up open issues end to end in a distributed Python package. One git worktree, one branch and one draft PR per issue. Checks and the wheel gate run in an ephemeral container mounted on the worktree, because the host virtualenv cannot collect the suite and the shared container is bound to the main repo. Anything any stage discovers along the way -- bug or enhancement -- is filed as a new issue behind a human triage gate, so the loop feeds itself without running away.","phases":[{"title":"Baseline","detail":"record failing checks + the distribution facts from pyproject.toml","model":"sonnet"},{"title":"Triage","detail":"gh issue list, pick candidates, create a worktree per issue","model":"sonnet"},{"title":"Plan","detail":"root cause + ordered tasks (failing test first) + test strategy","model":"opus"},{"title":"Implement","detail":"one subagent per task; task 1 must prove the bug red","model":"sonnet"},{"title":"Dogfood","detail":"run the change for real and read the data it produced; refine once if it is ugly","model":"sonnet"},{"title":"Review","detail":"adversarial review of the worktree diff + packaging impact","model":"opus"},{"title":"Verify","detail":"apply review fixes, run lint/typecheck/tests until green (bounded)","model":"sonnet"},{"title":"Docs","detail":"tech writing: bring docs/ back in step with the change, site-ready","model":"sonnet"},{"title":"Package","detail":"build sdist+wheel, install in a clean venv, prove the fix ships","model":"sonnet"},{"title":"Followups","detail":"file every stage discovery as a deduped, human-gated issue","model":"sonnet"},{"title":"Ship","detail":"commit, push, open or update a draft PR with the release impact","model":"sonnet"},{"title":"CI","detail":"watch the PR run, fix what it finds, iterate until green, then merge","model":"sonnet"},{"title":"Report","detail":"write the run report to docs/agents/runs/ so it outlives this session","model":"sonnet"}],"args":null,"edited":"2026-08-31 14:35","calls":[{"n":1,"label":"baseline","phase":"Baseline","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":2559,"prompt":"You are recording the pre-change state of this repository so later agents can tell a regression from a pre-existing failure, and know what this distribution actually is.\n`git fetch origin`, then from the repo root:\n  `git worktree add ../gk-baseline --detach origin/main`  (reuse it if it already exists, but `git checkout origin/main` inside it first)\ncd there and do two things. Change nothing: no fixes, no edits, no commits.\n\nA. Run the checks ONCE.\nRun this repo's checks INSIDE a container mounted on your worktree. Never on the host (its virtualenv cannot\neven collect the suite) and never via `scripts/gate.sh` from a worktree (that script execs into the shared\ncontainer, whose /app is the MAIN repo, not yours -- it would test the wrong code and report it as yours).\nOne command, from anywhere:\n```\nMSYS_NO_PATHCONV=1 docker run --rm -e GRAPHKNOWS_SKIP_PREFLIGHT=1 -v \"<ABSOLUTE PATH OF YOUR WORKTREE, drive-letter form, e.g. C:/Users/User/Documents/dev/gk-baseline>:/app\" -w /app graphknows-workspace \\\n  sh -c 'ruff check --no-fix graphknows evaluation tests \\\n   && ruff format --check graphknows evaluation tests \\\n   && mypy graphknows --strict --ignore-missing-imports --allow-untyped-decorators --no-warn-unused-ignores \\\n   && lint-imports \\\n   && python -m pytest -q -m \"not integration\"'\n```\nBoth env vars are load-bearing: MSYS_NO_PATHCONV stops Git Bash mangling the mount path, GRAPHKNOWS_SKIP_PREFLIGHT\nstops the image entrypoint aborting the run. While iterating, run one stage at a time (drop the `&&` tail, swap in\na single test path); run the whole chain before you claim green.\nIntegration tests need a live ArcadeDB -- `-m \"not integration\"` deselects them, leave it that way.\nIf docker is unavailable, STOP and report it (ran=false / green=false). Never fall back to host pytest, and never\nreport a check you did not actually run.\nRecord every failure as a stable identifier: a pytest node id (path::test_name), or rule + file for lint/typecheck. If a check cannot run at all (missing tool, collection error), set ran=false and say exactly why -- do not guess.\n\nB. Read pyproject.toml and fill in \"distribution\": the [project] name and version (note if version is dynamic, and where it comes from), the [build-system] build-backend, whether the code is under src/ or flat, requires-python, the declared [project.dependencies], the names of any [project.optional-dependencies] extras, and whether any non-.py data files (or py.typed) are declared to the build backend.\nReport what the file says, not what you think it should say."},{"n":2,"label":"triage","phase":"Triage","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":3195,"prompt":"You are triaging open GitHub issues for this repository. Use `gh`. If it is not on PATH, fall back to \"/c/Program Files/GitHub CLI/gh.exe\" (quote it).\nList open issues with `gh issue list --search \"is:open is:issue -label:\\\"needs-triage\\\"\" --limit 50`. The -label filter is REQUIRED: issues still carrying \"needs-triage\" were filed by an agent and have not been reviewed by a human yet.\nPick at most 1 that are concretely fixable in code.\nSkip anything that is a question, a discussion, a duplicate, blocked on a decision, or too vague to implement.\nA ticket may declare its dependencies in a \"## Blocked by\" section listing other issue numbers. For every candidate that has one, check each blocker with `gh issue view <n> --json state,title`. If ANY blocker is still open, skip the candidate and give \"blocked by #<n>\" as the reason -- its blockers must land first or you would be implementing against code that does not exist yet.\nAlso skip anything that is a release request or asks for a version bump -- this workflow does not release.\nAlso skip any issue that already has work in flight: check `gh pr list --state open --json number,headRefName,title` and `git ls-remote --heads origin \"fix/issue-*\"`.\nReport every skip under \"skipped\" with the reason.\nRead each candidate's full body and comments (`gh issue view <n> --comments`) before judging it.\nWhile you have the body open, record its \"## Verify\" command under verify: the ONE runnable command that section names, verbatim and on one line. A later stage RUNS it, so copy it rather than describing it, and leave it empty rather than assembling one out of prose -- an invented command that happens to pass would close a ticket that still has work in it.\nThen, for EACH picked issue, sequentially (never in parallel):\n  1. `git fetch origin`\n  2. from the repo root: `git worktree add ../gk-issue-<n> -b fix/issue-<n> origin/main`\n  3. record the ABSOLUTE path of that worktree in DRIVE-LETTER form -- `C:/Users/User/Documents/dev/gk-issue-<n>`, not the Git Bash `/c/Users/...` form. Later stages mount that path into docker, which needs the drive letter.\nIf a worktree or branch for an issue already exists locally, reuse the DIRECTORY rather than failing --\nbut never trust its commits as they stand, because a leftover branch was cut from an older base.\nBefore any work starts on a reused branch, put it on the current tip:\n  a. `git -C <worktree> fetch origin` then `git -C <worktree> rebase origin/main`\n  b. If the rebase reports conflicts, STOP for that issue: `git -C <worktree> rebase --abort`, skip the\n     issue, and give the conflict as the skip reason. A leftover branch that disagrees with the tip is a\n     human's call, not something to resolve on the way past.\n  c. If it rebases clean, confirm it: `git -C <worktree> log --oneline origin/main..HEAD` is now only\n     this issue's own commits. Anything you do not recognise means the branch is not what its name claims.\n  d. Set resumed_from to the commits it carried over (or \"\" when the branch was created fresh this run),\n     so the run report says the car resumed rather than started clean.\nDo not read source files or plan any fix -- that is the next phase's job."},{"n":3,"label":"probe#157","phase":"Plan","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":1198,"prompt":"Run one command and report what it did. Implement NOTHING, fix NOTHING, commit NOTHING -- you are measuring, not building.\nThe command, verbatim: python -m pytest -q tests/test_typing.py::test_instance_of_score_is_per_entity\nRun it in C:/Users/User/Documents/dev/gk-issue-157. If it names the test suite, run it in a container mounted on that tree:\n```\nMSYS_NO_PATHCONV=1 docker run --rm -e GRAPHKNOWS_SKIP_PREFLIGHT=1 -v \"C:/Users/User/Documents/dev/gk-issue-157:/app\" -w /app graphknows-workspace \\\n  sh -c 'python -m pytest -q tests/test_typing.py::test_instance_of_score_is_per_entity'\n```\nBoth env vars are load-bearing. Never run the suite on the host, and never report a result you did not observe.\nBe exact about the difference between these two, because they mean opposite things:\n  - It RAN and FAILED -- an assertion failed, a symbol does not exist, an import errors because the module is not written. That is ran=true, passes=false.\n  - It could not be run AT ALL -- malformed, prose rather than a command, docker unavailable. That is ran=false.\nOnly a command that ran to a successful conclusion is passes=true. Do not adjust the command to make it run, and do not fix what it reveals."},{"n":4,"label":"plan#157","phase":"Plan","schema":true,"model":"opus","effort":"medium","group":null,"chars":9277,"prompt":"Issue #157: INSTANCE_OF.score is per-class, not per-entity\nWhat it asks for: the score is computed once per class so it cannot rank entities\nWork in the worktree at C:/Users/User/Documents/dev/gk-issue-157 -- cd there first; it is a full checkout of this repo on branch fix/issue-157.\nIf the issue references a parent spec issue, READ IT FIRST (`gh issue view <n>`). Tickets filed by prepare-tickets carry the design decision in the parent, not in themselves: planning from the ticket alone re-decides a question that was already settled, and settled differently. The parent may open with a quoted banner recording that an adversarial reviewer called the design unsound, or that a fact it rests on was refuted -- that is not decoration, it is the thing to resolve before you plan around it.\nThe issue text is the contract, and the parent spec is its context. Where the decision was architecturally significant the spec cites an ADR under docs/adr/ -- that IS in your worktree, so read it when the spec names one. Do not go looking for any other design document; there is none.\nCheck the comments as well (`gh issue view 157 --comments`). If one of them is an \"## Agent Brief\", THAT is the contract and the body is background: a person wrote it during triage precisely because the body was a raw report. It carries the same sections a pipeline ticket does -- acceptance criteria, Verify, Out of scope -- and where the two disagree, the brief is the later decision.\nA \"[NEEDS CLARIFICATION: ...]\" marker anywhere in the body or the brief means the work is NOT settled. Do not resolve it yourself and do not plan around it: stop, and report it as the reason. Somebody left that marker rather than guessing, and guessing here throws that away.\nRead the code before planning. Find the ROOT CAUSE, not the symptom: grep every caller of what you are about to change, so the fix lands where all callers route through instead of patching the one path the issue names.\nRead C:/Users/User/Documents/dev/graphknows/.claude/skills/diagnosing-bugs/SKILL.md and follow it: the root-cause discipline this repo uses -- build the feedback loop before theorising. You may not modify the tree, so follow its \"Diagnosis for planning\" branch: spec the loop, do not run it.\nRead CLAUDE.md and the surrounding modules; match their idiom.\nRead C:/Users/User/Documents/dev/graphknows/.claude/skills/ponytail/SKILL.md and follow it: the ladder: does this need to exist at all, is it already in this codebase, does the stdlib do it, can it be one line. Climb it for every task before you write the task down, and stop at the first rung that holds. It shortens the SOLUTION, never the reading -- trace the whole flow first.\nA plan is a budget. The smallest number of tasks that closes the issue is the correct number; a task you added because it seemed thorough is a file somebody has to review.\nOrientation: this repo has a knowledge graph. Before grepping blind, run these from C:/Users/User/Documents/dev/graphknows (NOT your worktree -- graphify-out is gitignored):\n  `graphify query \"<your question>\"`   -- broad context, BFS over the graph\n  `graphify path \"A\" \"B\"`              -- how two concepts connect\n  `graphify explain \"<symbol>\"`        -- plain-language explanation of a node\n  `python C:/Users/User/Documents/dev/graphknows/.claude/skills/deep-code-review/metrics.py C:/Users/User/Documents/dev/graphknows/graphify-out/graph.json`  -- risk scoreboard: hotspots (churn x fan-in), hidden coupling (files that co-change with your target but share no import edge -- callers grep cannot find), cycles, god nodes.\nUse hidden-coupling rows to widen a root-cause search past the file the issue names, and blast-radius rows when assigning disjoint files to tasks.\nIt was built 2026-08-09 and the package has moved since: use it to find where a thing lives and what touches it, then confirm against the actual file before acting on it. If the CLI or graph is missing, skip it and read the code.\nProduce the smallest plan that actually fixes it -- at most 4 tasks. Each task must be self-contained: the agent executing it starts with a blank context and sees only your instruction. Give tasks disjoint files where you can.\nAT MOST ONE task has kind=\"test\": the reproduction that fails on the current code and passes once the fix lands. It touches only test files. Every other task is kind=\"code\".\nInclude it when there is BEHAVIOUR to reproduce -- something the code does wrong now and will do right after. Omit it when there is not: a deletion, a dependency or build-config change, a rename, a docs edit. For those the acceptance is the existing suite still passing, and the later stages know a plan can arrive with no test task.\nA test that asserts a file, a flag or a section is ABSENT is not a reproduction, it is the acceptance criteria copied into Python. Never write one. If the only test you can think of restates the ticket, that is the signal to omit the test task, not to write it anyway.\nThe test must assert the CORRECT behaviour as the issue describes it -- never the behaviour the buggy code currently produces.\nDistribution facts, read from pyproject.toml at the start of this run:\n  name: graphknows\n  version: 0.4.1 (dynamic, from graphknows/_version.py) -- DO NOT CHANGE IT\n  build backend: hatchling.build | layout: flat | requires-python: >=3.11\n  declared dependencies: pydantic>=2.7.0, numpy>=1.26.0\n  extras: assisted, srl\n  non-.py files declared to the backend: yes\nTHIS REPO IS A DISTRIBUTED PYTHON PACKAGE. These rules are binding:\n  - NEVER change the version: not `[project] version` in pyproject.toml, not a single-sourced `__version__`, not a tag it is derived from. Versions are bumped once, at release. A version already published to PyPI can never be re-uploaded or replaced, so a stray bump in a fix branch burns a real version number.\n  - Every third-party module imported by package code must be declared in `[project.dependencies]` -- or in the right `[project.optional-dependencies]` extra if the feature is optional -- with a lower bound. An undeclared import installs fine for you and ImportErrors for every user.\n  - Test-only and dev-only imports go in the dev dependency group / extra, NEVER in `[project.dependencies]`.\n  - Do not use a stdlib API newer than `requires-python` permits, and do not change `requires-python` to make one legal.\n  - A new import package directory needs an `__init__.py`; without one it is a namespace package and may silently not ship.\n  - Non-.py files (data, ontologies, `py.typed`) do NOT ship automatically. They must be declared to the build backend or the wheel is missing them.\n  - This repo is FLAT layout: tests import the in-tree copy, so a wheel missing a file still tests green -- only the package gate catches it. Code that only works because of the current working directory works in the suite and breaks for installed users.\n  - Never add `dist/`, `build/` or `*.egg-info/` to the repository.\nFill in api_surface with the public importable names this fix changes (empty if purely internal), and new_dependencies with any third-party package the fix will need that is not already declared -- name the pyproject table it belongs in. Prefer a fix that needs no new dependency at all: every dependency you add is one every user must install.\nList under out_of_scope anything real you noticed while reading that this fix will NOT address -- a defect, a broken assumption, or a concrete enhancement the code is missing. Each one is deduped and filed as a GitHub issue at the end of this run, so be strict:\nEvidence bar -- two lanes, both strict:\n  BUG: report it only if you can state a concrete failure scenario -- real inputs producing a wrong result, a crash, a regression, or a broken contract.\n  ENHANCEMENT: report it only if you can name something a user cannot do today, or must do by hand, and why that matters now.\nNeither lane accepts style nits, speculative hardening, \"could be more general\", \"add more tests\", or a refactor wish. Those are not findings.\nChange nothing yourself.\nRepo rules (CLAUDE.md) are binding: pythonic OOP ews it properly. Set ejected=true with the reason. Carrying on regardless is the failure: this lane reviews the whole batch once, so an oversized change here gets a fraction of the scrutiny it would get on its own.\n\nIf it IS small, implement it fully, then:\n  1. Run the ticket's \"## Verify\" command. Run the repo's checks INSIDE a container mounted on the worktree, from anywhere:\n```\nMSYS_NO_PATHCONV=1 docker run --rm -e GRAPHKNOWS_SKIP_PREFLIGHT=1 -v \"C:\\Users\\User\\Documents\\dev\\gk-express-201:/app\" -w /app graphknows-workspace \\\n  sh -c 'ruff check --no-fix graphknows evaluation tests \\\n   && ruff format --check graphknows evaluation tests \\\n   && mypy graphknows --strict --ignore-missing-imports --allow-untyped-decorators --no-warn-unused-ignores \\\n   && lint-imports \\\n   && python -m pytest -q -m \"not integration\"'\n```\nBoth env vars are load-bearing. If docker is unavailable, STOP and report it -- never fall back to host pytest,\nand never report a check you did not run.\n     Run the full check chain, not just the ticket's own command -- your commit shares a branch with the others, and a lint failure you introduce blocks all of them.\n  2. `git add -A` and commit JUST your change. Check `git status --short` first for `dist/`, `build/` or `*.egg-info/` and delete any that appear.\n  3. Commit message: a concise lower-case imperative subject, then a blank line, then exactly `Closes #205`. That trailer is what closes the ticket when the branch lands, and it is per-commit because this branch rebase-merges -- each ticket keeps its own commit on main. NEVER add Co-Authored-By or any author trailer.\n     Let the pre-commit hooks run. If one fails, fix the cause and recommit; never --no-verify.\nDo not push. Do not open a PR. Do not touch another ticket in this batch, even if you can see it is wrong -- say so in notes instead.\nRepo rules (CLAUDE.md) are binding: pythonic OOP, type hints, one thing per function, small diffs, no speculative abstraction. NEVER weaken, delete or retarget an existing test to make the suite pass. The standing rules every ticket inherits are in C:/Users/User/Documents/dev/graphknows/docs/agents/definition-of-done.md -- read it once, follow it, and do not restate it anywhere."},{"n":4,"label":"express:commit#206","phase":"Commit","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":3495,"prompt":"cd C:/Users/User/Documents/dev/gk-express-201 and work only there. This is a SHARED worktree: 2 small tickets are landing on one branch, one commit each. Earlier commits from this batch may already be present -- leave them alone.\nYOUR TICKET -- #206: fix a stale path in the deprecation table\n\n## Parent\n#200\n## What to build\nCorrect the module path in the deprecation table.\n## Acceptance criteria\n- [ ] WHEN a reader follows the named path THE SYSTEM SHALL resolve to a module that exists\n## Verify\n`pytest tests/test_docs_links.py -q` passes\n## Out of scope\nThe rest of the page.\n\n\nThis ticket was rostered as a few lines of work. Read its \"## Verify\" section: that command, passing, is the acceptance. Read C:/Users/User/Documents/dev/graphknows/docs/agents/definition-of-done.md once for the standing rules.\nSTOP AND EJECT if any of these turns out to be true, and commit NOTHING when it does: the change needs more than about 50 changed lines; it needs a file the ticket does not name; it needs a new dependency; it touches `.github/workflows/`, `scripts/gate.sh` or `.pre-commit-config.yaml`; or the ticket turns out to be ambiguous about what to build.\nEjecting is a normal outcome and costs nothing -- the ticket goes back to the full pipeline, which reviews it properly. Set ejected=true with the reason. Carrying on regardless is the failure: this lane reviews the whole batch once, so an oversized change here gets a fraction of the scrutiny it would get on its own.\n\nIf it IS small, implement it fully, then:\n  1. Run the ticket's \"## Verify\" command. Run ip","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":1993,"prompt":"cd C:/Users/User/Documents/dev/gk-express-201. 2 small ticket(s) are committed on express/201-204, one commit each. Push them and open ONE pull request. Use `gh`. If it is not on PATH, fall back to \"/c/Program Files/GitHub CLI/gh.exe\" (quote it).\n1. `git push -u origin express/201-204`. Run it in the FOREGROUND, in ONE Bash call, with an explicit timeout of 900000 ms (15 minutes). The pre-push hook runs the full container gate -- ~5 minutes measured 2026-08-28, longer on a cold cache -- so the DEFAULT 2-minute timeout kills it mid-gate every time. A slow push is NOT an auth failure and NOT a hang: do not retry with a different remote, do not re-authenticate, and NEVER add --no-verify. Run it once -- killing and retrying leaves an orphaned container-side pytest behind, and they starve each other of CPU.\n   Then confirm with `git ls-remote origin express/201-204`.\n2. Check for an existing PR first: `gh pr list --head express/201-204 --state open --json number,url`. If one is open, `gh pr edit <n> --body \"<body>\"` -- never open a second PR for the same branch.\n   Otherwise: `gh pr create --base main --head express/201-204 --title \"<concise, naming the batch not one ticket>\" --body \"<body>\"`\nPR body, exactly this shape:\n   - One opening line: batched by an express-lane run because each change is a few lines; they share one CI run.\n   - Then one bullet per ticket, in commit order:\n       - Closes #205 — add 3.13 to the classifiers (~2 lines, pyproject.toml)\n       - Closes #206 — fix a stale path in the deprecation table (~2 lines, pyproject.toml)\n   - A \"How this was checked\" line: the full check chain ran in a container per commit, and CI runs once over the batch.\n   Every \"Closes #N\" must appear in the PR BODY as well as in its commit. GitHub links a PR to an issue from the body; a keyword only in a commit message closes the issue but leaves the PR unlinked.\nDo not merge. Do not mark it ready or draft either way beyond the default. Report the PR number and URL."},{"n":6,"label":"express:land","phase":"Land","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":2156,"prompt":"PR #950 carries 2 small ticket(s) as 2 commit(s). Land it. Use `gh`. If it is not on PATH, fall back to \"/c/Program Files/GitHub CLI/gh.exe\" (quote it).\n1. Watch CI to a conclusion: `gh pr checks 950 --watch`. If it goes red, STOP: set ci=\"red\", merged=false and name the failing check. Do NOT try to fix it -- guessing which of 2 commits broke it is exactly the cost this lane was trading away.\n   Then close the PR so the batch stops claiming these tickets: `gh pr close 950 --comment \"batch CI went red; these tickets go back through the full pipeline one at a time\"`. Do NOT pass --delete-branch: the caller re-queues each ticket as a full car, and leaving express/201-204 on the remote is what lets a human bisect the batch afterwards.\n2. Green: `gh pr ready 950` if it is a draft, then `gh pr merge 950 --rebase --delete-branch`.\n   REBASE, not squash. Each ticket must land as its own commit on main so its \"Closes #N\" trailer closes it and `git log` stays readable per ticket. If the repository refuses rebase merges, set merged=false and say so -- do NOT fall back to squash, which would close every ticket from one commit and destroy the per-ticket history.\n3. Confirm each issue closed itself: `gh issue view 205 --json state`, `gh issue view 206 --json state`. Report any still open; do not close one by hand, that hides a broken link.\n4. Do NOT wait for main's CI. Leave post_merge_green unset: nothing in this run acts on it, and the PR CI already went green on this exact tree.\n5. Only if the merge SUCCEEDED: Then tear down what this car started, in this order: `cd C:/Users/User/Documents/dev/gk-express-201 && docker compose down --remove-orphans` (its ArcadeDB stack is named after that directory and nothing else ever stops it -- leaked stacks OOM-kill the pre-push gate for every branch, not just this one), then `git worktree remove C:/Users/User/Documents/dev/gk-express-201` from the repo root. If either refuses, say so in notes and leave it -- do not force past a refusal you have not read. If CI went red, leave both in place -- the branch and its tree are what a human bisects.\nDo not tag, do not release, do not bump a version."},{"n":7,"label":"express:report","phase":"Land","schema":false,"model":"sonnet","effort":"medium","group":null,"chars":1147,"prompt":"Write a file. That is the whole task: no analysis, no summarising, no edits to the text.\nPath: C:/Users/User/Documents/dev/graphknows/docs/agents/runs/express-lane-201.md -- create the directory if it is missing, overwrite the file if it exists.\nContent: everything between the two marker lines below, byte for byte. The markers are NOT part of the file.\n<<<REPORT-BEGINS>>>\n# express-lane -- 2 ticket(s) on one branch\n\nan express-lane run. Branch `express/201-204`, PR https://github.com/tamasmakos/graphknows/pull/950. Merged as ccc3333.\n\nOne gate run, one CI run and one merge were shared across this batch. Through the normal lane each ticket\nwould have paid its own -- roughly thirty-one minutes each, or about 62 minutes for these 2.\n\n## Landed\n\n| # | Ticket | ~lines | Files |\n| --- | --- | --- | --- |\n| #205 | add 3.13 to the classifiers | 2 | pyproject.toml |\n| #206 | fix a stale path in the deprecation table | 2 | pyproject.toml |\n\n## Refused at the door\n\n- #207 gated one — carries \"needs-triage\" -- a person owes it a decision, and this lane reviews less, not more\n<<<REPORT-ENDS>>>\nThen confirm the file exists and report its path."}],"workflowCalls":[],"topPhases":["Cut","Probe","Commit","Ship","Land"],"result":{"lane":"express","branch":"express/201-204","worktree":"C:/Users/User/Documents/dev/gk-express-201","pr":950,"pr_url":"https://github.com/tamasmakos/graphknows/pull/950","ci":"green","merged":true,"merge_commit":"ccc3333","post_merge_green":true,"landed":[205,206],"red_batch":[],"ejected":[],"satisfied":[],"refused":[{"number":207,"reason":"carries \"needs-triage\" -- a person owes it a decision, and this lane reviews less, not more"}],"probes":"shadow","probe_verdicts":[{"number":205,"ran":true,"passes":false},{"number":206,"ran":true,"passes":false}],"report":"docs/agents/runs/express-lane-201.md","next_step":"All 2 landed as separate commits on main."},"logs":["#207 refused from the express lane: carries \"needs-triage\" -- a person owes it a decision, and this lane reviews less, not more","#205 committed: add 3.13 classifier (~2 lines)","#206 committed: add 3.13 classifier (~2 lines)","pushed express/201-204, PR #950","express batch: CI green, merged -- rebase-merged","run report: docs/agents/runs/express-lane-201.md"]},{"name":"run-merge-train","description":"Drain one spec issue: roster its sub-issue tickets, topo-order them, land each serially on the fresh tip via process-issues","whenToUse":"The drain half of the merge-train skill. Given a spec issue filed by prepare-tickets, it reads the spec's sub-issues, admits only tickets a human has approved (ready-for-agent present, needs-triage absent), orders them by their \"## Blocked by\" edges, and lands them one at a time -- each car cut from main as it stands after the previous merge, so sibling conflicts cannot happen. A failed car is parked with its dependents and the train continues; a red main after a merge halts everything. Departure, parked cars and halts are commented on the spec issue as they happen and the wrap-up posts the full ledger, so a killed run resumes by relaunching -- position rebuilds from GitHub state alone.","phases":[{"title":"Roster","detail":"read the spec's sub-issues, admit only human-approved tickets, order them","model":"sonnet"},{"title":"Express","detail":"the tiny tickets first, batched onto one branch with one CI run","model":"sonnet"},{"title":"Drain","detail":"per car: run its own \"## Verify\" against the tip, dispatch process-issues with merge, classify the outcome","model":"sonnet"},{"title":"Recover","detail":"one rebase-and-resolve attempt when a green PR failed to merge","model":"sonnet"},{"title":"Ledger","detail":"departure, parked and halt comments post immediately; landed cars batch into the wrap-up","model":"sonnet"},{"title":"Report","detail":"one wrap-up agent: single main flake-check, the ledger comment, the train report","model":"sonnet"}],"args":{"spec":201,"merge":true},"edited":"2026-08-31 15:15","calls":[{"n":1,"label":"roster","phase":"Roster","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":3347,"prompt":"You are building the roster of a merge train for the GraphKnows repository. The train is spec issue #201. Use `gh`. If it is not on PATH, fall back to \"/c/Program Files/GitHub CLI/gh.exe\" (quote it).\n1. Read the spec: `gh issue view 201 --json number,title,state,labels`. If it is not open, report it and list no children.\n2. List its sub-issues: `gh issue view 201 --json subIssues`. These ARE the roster candidates -- do not search for children any other way; search is eventually consistent and this read is not.\n3. For EACH sub-issue, read `gh issue view <n> --json number,title,state,labels,body` and extract:\n   - its labels and state, verbatim\n   - the issue numbers in its \"## Blocked by\" section (empty if it says it can start immediately)\n   - for each blocker that is NOT itself a sub-issue of the spec: whether that blocker is currently open (`gh issue view <b> --json state`)\n   - every repository file path its body names, verbatim, under files_named. Miss none: the script refuses to board a car that rewrites the CI or the gate, and it can only see the paths you report. Over-report here rather than under-report.\n   - under files_to_edit, the SUBSET of those the change actually MODIFIES. A well-written ticket cites more files than it touches: the module it reads for context, the file whose comment is the source of truth, the place the symptom was observed. Those belong in files_named and NOT here. Getting this wrong in the cautious direction is expensive, not safe -- an over-long files_to_edit sends a two-line fix down a lane that costs about two hours of gate, CI and main-watch it did not need.\n   - its size, under expected_lines + sizing, by ONE of these two routes:\n     * The body has an \"Estimated diff: ~N lines\" line -> expected_lines = N, sizing = \"stated\". The author committed to a number; take it.\n     * It does not -> SIZE IT YOURSELF FROM THE CODE, sizing = \"measured\". Open every path under files_named, find the functions the ticket actually changes, and count the lines that have to move. Put what you read in sizing_evidence: the symbols you found and why the change is that size. A number you did not get from reading the files is not measured -- report sizing = \"unknown\" instead, and say so.\n   Sizing is worth the legwork: a ticket wrongly sent down the long road costs about two hours of gate, CI and main-watch that a batched one shares. Guessing is not, so guessing has its own value that fails closed. Wrong-but-measured is cheap -- the express lane ejects anything over 50 real lines, commits nothing, and it goes back through the full pipeline.\n4. Check work in flight: `gh pr list --state open --json number,headRefName,title,url` and `git ls-remote --heads origin \"fix/issue-*\"`. A candidate whose fix/issue-<n> branch has an open PR gets that PR URL under open_pr.\n5. From that same PR list, report every open PR that is NOT one of these candidates under other_prs, with its number, title and URL. A train lands N commits on main; a PR opened before it departed is the thing most likely to be made moot or unmergeable by them, and nobody finds out until the conflict.\nSizing is the one place you measure rather than transcribe; everything else is facts as written. Do not decide who boards or which lane they take -- the script does that from what you report, and it will show its reasons."},{"n":2,"label":"ledger","phase":"Ledger","schema":false,"model":"haiku","effort":"low","group":null,"chars":571,"prompt":"Post ONE comment on GitHub issue #201 and do nothing else. Use `gh`. If it is not on PATH, fall back to \"/c/Program Files/GitHub CLI/gh.exe\" (quote it).\nThe text is final -- do not rephrase it, extend it, or add a signature.\n`gh issue comment 201 --body \"<the text below, verbatim>\"`\n<<<COMMENT>>>\na merge-train run: train departing for this spec. Express batch first — #205, #206 share one branch, one CI run and one merge because each is a few lines. Order: #202 -> #203. Not boarding: #204 (still carries \"needs-triage\" -- no human has agreed to it).\n<<<END COMMENT>>>"},{"n":3,"label":"workflow:express-lane","phase":"Express","schema":false,"group":null,"chars":162,"prompt":"child workflow express-lane with args {\"issues\":[205,206],\"merge\":true,\"watchMain\":true,\"probes\":\"shadow\",\"runLabel\":\"a merge-train run (express batch for #201)\"}"},{"n":4,"label":"probe#202","phase":"Drain","schema":true,"model":"sonnet","effort":"medium","group":null,"chars":1925,"prompt":"Run ONE issue's own acceptance check against the current tip of main. Change no code, fix nothing, implement nothing. Use `gh`. If it is not on PATH, fall back to \"/c/Program Files/GitHub CLI/gh.exe\" (quote it).\n1. `gh issue view 202 --json body` and find its \"## Verify\" section. It holds one runnable command. If there is no such section, or it holds prose rather than a command, set ran=false and say which -- do not invent a command.\n2. Get a clean tree at the tip, WITHOUT touching C:/Users/User/Documents/dev/graphknows's own checkout -- a person may be working in it:\n   from C:/Users/User/Documents/dev/graphknows: `git fetch origin`, then `git worktree add C:/Users/User/Documents/dev/gk-probe --detach origin/main` (if C:/Users/User/Documents/dev/gk-probe already exists, cd there and `git che
