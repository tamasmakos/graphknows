name: CD — Build & Publish

# Triggered on semver tags (e.g. v1.2.3) pushed to main.
# Builds all four application images, pushes them to GitHub Container
# Registry (GHCR), and produces a docker-compose.prod.yml with pinned
# image references suitable for deployment anywhere Docker Compose runs.
#
# OPTIONAL: The `deploy-vps` job SSHes into a VPS and does a
# `docker compose pull && up -d`. Set the required secrets in
# GitHub → Settings → Secrets & Variables → Actions to activate it:
#
#   SSH_USER          VPS Linux username
#   VPS_HOST          VPS IP or hostname (or Tailscale IP)
#   SSH_PRIVATE_KEY   Private key whose public half is in VPS ~/.ssh/authorized_keys
#
# If any of those secrets are absent the deploy job is skipped cleanly.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-releases: v1.2.3-rc1
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (default: sha-<short>)"
        required: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/graphknows

jobs:
  # ── 1. Build & push all application images to GHCR ──────────────────────
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write    # required to push to GHCR

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha_short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-${SHA_SHORT}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${TAG}"

      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Restore layer cache from CI runs to speed up the CD build.
      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-layer-cache
          key: docker-layers-${{ hashFiles('**/Dockerfile', '**/Dockerfile.*', 'uv.lock', '**/requirements*.txt') }}
          restore-keys: |
            docker-layers-

      # Build all four app images in parallel via bake, tag with version + latest,
      # and push to GHCR. Infrastructure images (neo4j, pgvector, memgraph) are
      # upstream official images — we do not rebuild them.
      - name: Build and push application images
        uses: docker/bake-action@v5
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        with:
          files: docker-bake.hcl
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          set: |
            *.cache-from=type=local,src=/tmp/.docker-layer-cache
            *.cache-to=type=local,dest=/tmp/.docker-layer-cache,mode=max
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # ── Produce deployment artifact ──────────────────────────────────────
      # A docker-compose.prod.yml that pulls pinned images from GHCR.
      # Anyone with Docker Compose and the right .env can deploy from this file.
      - name: Generate docker-compose.prod.yml
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat > docker-compose.prod.yml <<EOF
          # Generated by CD workflow — do not edit manually.
          # Deploy with:
          #   TAG=${TAG} docker compose -f docker-compose.prod.yml up -d
          version: "3.9"

          services:
            neo4j:
              image: neo4j:5.26-community
              ports:
                - "\${NEO4J_HTTP_PORT:-7474}:7474"
                - "\${NEO4J_BOLT_PORT:-7687}:7687"
              environment:
                NEO4J_AUTH: "\${NEO4J_AUTH:-neo4j/changeme}"
              volumes:
                - neo4j_data:/data
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
                interval: 10s
                timeout: 5s
                retries: 10
                start_period: 30s

            pgvector:
              image: pgvector/pgvector:pg17
              ports:
                - "\${PGVECTOR_PORT:-5432}:5432"
              environment:
                POSTGRES_DB: "\${PGVECTOR_DB:-vectordb}"
                POSTGRES_USER: "\${PGVECTOR_USER:-postgres}"
                POSTGRES_PASSWORD: "\${PGVECTOR_PASSWORD:-changeme}"
              volumes:
                - pgvector_data:/var/lib/postgresql/data
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \${PGVECTOR_USER:-postgres} -d \${PGVECTOR_DB:-vectordb}"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 15s

            memgraph:
              image: memgraph/memgraph-mage:latest
              ports:
                - "\${MEMGRAPH_BOLT_PORT:-7688}:7687"
                - "\${MEMGRAPH_HTTP_PORT:-7444}:7444"
              environment:
                MEMGRAPH_STORAGE_MODE: IN_MEMORY_ANALYTICAL
              volumes:
                - memgraph_data:/var/lib/memgraph
              restart: unless-stopped

            graphknows:
              image: ${IMAGE_PREFIX}-graphknows:${TAG}
              ports:
                - "\${GRAPHKNOWS_PORT:-8025}:8025"
              environment:
                NEO4J_URI: "\${NEO4J_URI:-bolt://neo4j:7687}"
                NEO4J_USER: "\${NEO4J_USER:-neo4j}"
                NEO4J_PASSWORD: "\${NEO4J_PASSWORD:-changeme}"
                PGVECTOR_DSN: "\${PGVECTOR_DSN}"
                MEMGRAPH_URI: "\${MEMGRAPH_URI:-bolt://memgraph:7687}"
                LLM_PROVIDER: "\${LLM_PROVIDER:-groq}"
                LLM_MODEL: "\${LLM_MODEL}"
                GROQ_API_KEY: "\${GROQ_API_KEY}"
              depends_on:
                neo4j: { condition: service_healthy }
                pgvector: { condition: service_healthy }
              restart: unless-stopped

            agent:
              image: ${IMAGE_PREFIX}-agent:${TAG}
              ports:
                - "8030:8000"
              environment:
                NEO4J_URI: "\${NEO4J_URI:-bolt://neo4j:7687}"
                NEO4J_USER: "\${NEO4J_USER:-neo4j}"
                NEO4J_PASSWORD: "\${NEO4J_PASSWORD:-changeme}"
                PGVECTOR_DSN: "\${PGVECTOR_DSN}"
                MEMGRAPH_URI: "\${MEMGRAPH_URI:-bolt://memgraph:7687}"
                HYBRIDRAG_URL: "\${HYBRIDRAG_URL:-http://graphknows:8025}"
                SEARCH_URL: "\${SEARCH_URL:-http://search:8000}"
                LLM_PROVIDER: "\${LLM_PROVIDER:-groq}"
                LLM_MODEL: "\${LLM_MODEL}"
                GROQ_API_KEY: "\${GROQ_API_KEY}"
              depends_on:
                neo4j: { condition: service_healthy }
                pgvector: { condition: service_healthy }
              restart: unless-stopped

            search:
              image: ${IMAGE_PREFIX}-search:${TAG}
              ports:
                - "\${SEARCH_PORT:-8040}:8000"
              environment:
                GRAPHKNOWS_URL: "\${GRAPHKNOWS_URL:-http://graphknows:8025}"
              restart: unless-stopped

            frontend:
              image: ${IMAGE_PREFIX}-frontend:${TAG}
              ports:
                - "\${FRONTEND_PORT:-8080}:8080"
              environment:
                AGENT_URL: "\${AGENT_URL:-http://agent:8000}"
              depends_on:
                - agent
              restart: unless-stopped

          volumes:
            neo4j_data:
            pgvector_data:
            memgraph_data:
          EOF
          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' docker-compose.prod.yml

      - name: Upload docker-compose.prod.yml as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-prod-${{ steps.meta.outputs.tag }}
          path: docker-compose.prod.yml
          retention-days: 90

      - name: Print published image references
        run: |
          echo "Published images:"
          echo "  ${{ env.IMAGE_PREFIX }}-graphknows:${{ steps.meta.outputs.tag }}"
          echo "  ${{ env.IMAGE_PREFIX }}-agent:${{ steps.meta.outputs.tag }}"
          echo "  ${{ env.IMAGE_PREFIX }}-search:${{ steps.meta.outputs.tag }}"
          echo "  ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}"

  # ── 2. Deploy to VPS — disabled, reserved for future use ────────────────
  # Uncomment and configure SSH_USER, VPS_HOST, SSH_PRIVATE_KEY secrets
  # plus set vars.VPS_DEPLOY_ENABLED=true to activate.
  #
  # deploy-vps:
  #   name: Deploy to VPS
  #   needs: build-and-push
  #   ...
