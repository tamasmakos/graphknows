[project]
name = "hybridrag"
version = "1.0.0"
description = "Entity-first hybrid RAG: graph traversal + pgvector semantic search + RRF fusion"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    # Databases
    "neo4j>=5.21.0",
    "asyncpg>=0.29.0",
    # ML / embeddings
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    # MCP
    "mcp[fastmcp]>=1.0.0",
    # Shared config
    "graphknows-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hybridrag"]
