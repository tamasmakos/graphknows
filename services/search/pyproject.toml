[project]
name = "graphknows-search"
version = "1.0.0"
description = "FastAPI search service wrapping EP Debates, EUR-Lex, and UK Legislation scrapers"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
