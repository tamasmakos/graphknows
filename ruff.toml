line-length = 100
target-version = "py311"

[lint]
select = ["F", "E"]
ignore = [
    "E501",
    "E402",
    "F401",
    "F841",
    "E701",
    "E741",
]

[lint.per-file-ignores]
"services/graphgen/api.py" = ["F821"]
"services/graphgen/analytics/analyzer.py" = ["E722"]
"tests/*" = ["F401", "F811"]
