# docker-compose.yaml — GraphKnows stack (ArcadeDB + MCP server + web Memory Mirror)
#
#   docker compose up -d                 # arcadedb + mcp + web
#   docker compose --profile dev up -d   # + workspace dev container
#   docker compose --profile observability up -d   # + Langfuse
#
# Configure via a .env file (see .env.example). All app config is GRAPHKNOWS_*.

x-graphknows-env: &graphknows-env
  GRAPHKNOWS_ARCADEDB_URL: "${GRAPHKNOWS_ARCADEDB_URL:-http://arcadedb:2480}"
  GRAPHKNOWS_ARCADEDB_USER: "${GRAPHKNOWS_ARCADEDB_USER:-root}"
  GRAPHKNOWS_ARCADEDB_PASSWORD: "${GRAPHKNOWS_ARCADEDB_PASSWORD:-changeme}"
  GRAPHKNOWS_MODE: "${GRAPHKNOWS_MODE:-llm_free}"
  GRAPHKNOWS_LLM_MODEL: "${GRAPHKNOWS_LLM_MODEL:-openrouter/deepseek/deepseek-v4-flash}"
  GRAPHKNOWS_LLM_API_KEY: "${GRAPHKNOWS_LLM_API_KEY:-}"
  GRAPHKNOWS_EMBED_MODEL: "${GRAPHKNOWS_EMBED_MODEL:-BAAI/bge-small-en-v1.5}"

services:
  arcadedb:
    image: arcadedata/arcadedb:latest
    ports:
      - "${GRAPHKNOWS_ARCADEDB_PORT:-2480}:2480"
    environment:
      # Give the JVM real heap: vector indexes (esp. 1536-dim remote embeddings)
      # are memory-hungry, and the default heap OOMs ("Java heap space") and
      # GC-thrashes under concurrent ingest. Tune GRAPHKNOWS_ARCADEDB_XMX to host RAM.
      JAVA_OPTS: "-Xms4G -Xmx${GRAPHKNOWS_ARCADEDB_XMX:-16G} -Darcadedb.server.rootPassword=${GRAPHKNOWS_ARCADEDB_PASSWORD:-changeme}"
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    restart: unless-stopped
    healthcheck:
      # The arcadedb image ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcp:
    container_name: graphknows-mcp
    build:
      context: .
      dockerfile: Dockerfile
    command: graphknows-mcp
    environment: *graphknows-env
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${GRAPHKNOWS_WEB_PORT:-8800}:8800"
    environment:
      <<: *graphknows-env
      GRAPHKNOWS_WEB_HOST: "0.0.0.0"
      GRAPHKNOWS_WEB_PORT: "8800"
      GRAPHKNOWS_FRONTEND_DIR: "/app/frontend"
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Dev container (mounts the repo, interactive shell). `--profile dev`.
  workspace:
    container_name: graphknows-workspace
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      <<: *graphknows-env
      PYTHONPATH: /app
    tty: true
    stdin_open: true
    command: /bin/bash
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: unless-stopped
    # GPU for GLiNER2 NER (torch). Requires the NVIDIA Container Toolkit on the
    # host; degrades gracefully to CPU if no GPU is present (the loader checks
    # torch.cuda.is_available()). Remove this block on GPU-less hosts.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional tracing. `--profile observability`.
  langfuse:
    image: langfuse/langfuse:2.95.0
    profiles: ["observability"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${LANGFUSE_DATABASE_URL:-postgresql://langfuse:langfuse@langfuse-db:5432/langfuse}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}"
      SALT: "${LANGFUSE_SALT:-change-me-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16.6-alpine
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langfuse_data:/var/lib/postgresql/data

volumes:
  arcadedb_data:
  langfuse_data:
