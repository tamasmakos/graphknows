services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme}"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${PGVECTOR_DB:-graphknows}"
      POSTGRES_USER: "${PGVECTOR_USER:-postgres}"
      POSTGRES_PASSWORD: "${PGVECTOR_PASSWORD:-changeme}"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-postgres} -d ${PGVECTOR_DB:-graphknows}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  memgraph:
    image: memgraph/memgraph-mage:latest
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7688}:7687"
      - "${MEMGRAPH_HTTP_PORT:-7444}:7444"
    environment:
      MEMGRAPH_STORAGE_MODE: IN_MEMORY_ANALYTICAL
    volumes:
      - memgraph_data:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1' | mgconsole --host localhost --port 7687 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      PGVECTOR_HOST: "pgvector"
      PGVECTOR_PORT: "${PGVECTOR_PORT:-5432}"
      PGVECTOR_DB: "${PGVECTOR_DB:-graphknows}"
      PGVECTOR_USER: "${PGVECTOR_USER:-postgres}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-changeme}"
      PGVECTOR_DSN: "postgresql://${PGVECTOR_USER:-postgres}:${PGVECTOR_PASSWORD:-changeme}@pgvector:5432/${PGVECTOR_DB:-graphknows}"
      MEMGRAPH_URI: "bolt://memgraph:7687"
    depends_on:
      neo4j:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    stdin_open: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      GRAPHKNOWS_WEB_HOST: "0.0.0.0"
      GRAPHKNOWS_WEB_PORT: "8800"
      GRAPHKNOWS_WEB_PUBLIC_HOST: "${GRAPHKNOWS_WEB_PUBLIC_HOST:-}"
      GRAPHKNOWS_WEB_PUBLIC_PORT: "${WEB_PORT:-80}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      PGVECTOR_HOST: "pgvector"
      PGVECTOR_PORT: "${PGVECTOR_PORT:-5432}"
      PGVECTOR_DB: "${PGVECTOR_DB:-graphknows}"
      PGVECTOR_USER: "${PGVECTOR_USER:-postgres}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-changeme}"
      PGVECTOR_DSN: "postgresql://${PGVECTOR_USER:-postgres}:${PGVECTOR_PASSWORD:-changeme}@pgvector:5432/${PGVECTOR_DB:-graphknows}"
      MEMGRAPH_URI: "bolt://memgraph:7687"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPEN_ROUTER_API: "${OPEN_ROUTER_API:-${OPENROUTER_API_KEY:-}}"
    depends_on:
      neo4j:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      GRAPHKNOWS_AUTH_USER: "${GRAPHKNOWS_AUTH_USER:-admin}"
      GRAPHKNOWS_AUTH_HASH: "${GRAPHKNOWS_AUTH_HASH:-}"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  neo4j_data:
  pgvector_data:
  memgraph_data:
  caddy_data:
