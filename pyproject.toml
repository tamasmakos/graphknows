[project]
name = "graphknows"
description = "Agentic memory: knowledge-graph ingestion + hybrid retrieval, llm-free or ontology-guided"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tamás Mákos", email = "tamasmakos@gmail.com" }]
keywords = [
    "memory",
    "knowledge-graph",
    "agents",
    "retrieval",
    "rag",
    "ontology",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    # Batteries-included: `pip install graphknows` gives a fully working llm_free
    # memory service (GLiNER2 extraction, local embeddings, analytics, parsers) that
    # also serves MCP out of the box. Only the llm_assisted stack (dspy/rdflib) is
    # gated behind the single [assisted] extra.
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    # Hierarchical clustering for the topic stage. Already present transitively
    # via sentence-transformers; declared because graphknows.topics imports it
    # directly (a naive Python agglomerative is O(N^3) and unusable at ~1e3
    # entities).
    "scipy>=1.11.0",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "langchain-text-splitters>=0.3.0",
    "dateparser>=1.2.0",
    # extraction (llm_free) + embeddings
    # `gliner` (not just gliner2) is required: entities/gliner_model.py loads
    # knowledgator/gliner-relex-large-v1.0 through `from gliner import GLiNER`.
    # It is NOT a transitive dependency of gliner2 — omitting it breaks the
    # default llm_free extraction path with ModuleNotFoundError on first ingest.
    "gliner>=0.2.26",
    "gliner2>=0.1.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    # Imported DIRECTLY by embedder.py, rerank.py, gliner_model.py and
    # _gliner2_verifier.py — not merely pulled in by sentence-transformers.
    # Relying on the transitive edge means a sentence-transformers release that
    # drops or re-pins any of them silently breaks us. The Dockerfile also
    # installs torch from an explicit index (CPU by default), which needs the
    # constraint declared here to resolve consistently.
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "huggingface-hub>=0.24.0",
    # BM25 sparse channel in retrieval/retriever.py. Was undeclared and
    # therefore absent, so `except ImportError` silently degraded the channel to
    # a tf-style scorer — a fused retrieval source that looked live and was not.
    "rank-bm25>=0.2.2",
    # WordNet/FrameNet lookups in the default (llm_free) relation path:
    # ingestion/extraction/relations/svo.py and channels/_framenet.py. Core, not
    # eval-only — those call sites guard LookupError (missing *corpus*), which
    # does not catch the ModuleNotFoundError raised by a missing *package*.
    "nltk>=3.8",
    # community detection during flush
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    # document parsers
    "python-docx>=1.1.0",
    # plug-and-play MCP server
    "mcp>=1.0.0",
    # Memory Mirror web UI
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
# llm_assisted mode: LLM-driven relation extraction + injectable RDF/OWL ontology.
# The one extra: `pip install 'graphknows[assisted]'`. Lazily imported and guarded
# by MissingExtraError, so the base install never pulls dspy/rdflib.
assisted = ["dspy>=2.5.0", "rdflib>=7.0.0"]
# Framework adapters. Genuinely optional — nothing in the core paths imports
# them, and both are lazily imported behind a MissingExtraError guard.
langgraph = ["langgraph>=0.2.0"]
langchain = ["langchain-core>=0.3.0"]

# Every extra named by a MissingExtraError call site MUST appear above;
# `MissingExtraError.KNOWN_EXTRAS` and tests/test_extras.py enforce it. For a
# missing *core* dependency raise BrokenInstallError instead — there is no
# extra to install, and suggesting one is a dead end.

[project.urls]
Homepage = "https://github.com/tamasmakos/graphknows"
Repository = "https://github.com/tamasmakos/graphknows"
Issues = "https://github.com/tamasmakos/graphknows/issues"
Changelog = "https://github.com/tamasmakos/graphknows/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "graphknows/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["graphknows"]

[tool.hatch.build.targets.sdist]
exclude = ["evaluation", "examples", "tests", "research", ".scratch"]

[project.scripts]
graphknows-mcp = "graphknows.server.mcp.stdio_server:main"
graphknows-web = "graphknows.server.web.server:main"

# ── Dev tooling ────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "tach>=0.35.0",
    "import-linter>=2.11",
]
eval = [
    "datasets>=2.19.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "tabulate>=0.9.0",
    # nltk (PorterStemmer for the locomo_f1 lexical diagnostic) is now a core
    # dependency — see [project.dependencies]. Declaring it here too was what
    # let the Docker image satisfy a production import from a dev-only group.
]

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "graphknows.settings",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = [
    "graphknows.retrieval.*",
    "graphknows.storage.*",
    "graphknows.server.mcp.*",
    "graphknows.ingestion.*",
    "graphknows.channels.*",
]
disable_error_code = ["no-any-return", "type-arg", "arg-type", "union-attr", "attr-defined", "return-value"]
