[project]
name = "graphknows"
description = "Agentic memory: knowledge-graph ingestion + hybrid retrieval, llm-free or ontology-guided"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tamás Mákos", email = "tamasmakos@gmail.com" }]
keywords = [
    "memory",
    "knowledge-graph",
    "agents",
    "retrieval",
    "rag",
    "ontology",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    "httpx>=0.27.0",
    # ML / embeddings (llm_free path — local by default)
    "numpy>=1.26.0",
    "networkx>=3.3",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    # NLP / graph extraction (llm_free path)
    "gliner2>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "spacy>=3.7.0",
    "dateparser>=1.2.0",
    # Document parsing
    "python-docx>=1.1.0",
    # Transports (MCP stdio + web Memory Mirror — both first-class, both light)
    "mcp>=1.0.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
# llm_assisted mode: LLM-driven extraction + injectable RDF/OWL ontology.
assisted = [
    "dspy>=2.5.0",
    "rdflib>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/tamasmakos/graphknows"
Repository = "https://github.com/tamasmakos/graphknows"
Issues = "https://github.com/tamasmakos/graphknows/issues"
Changelog = "https://github.com/tamasmakos/graphknows/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "graphknows/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["graphknows"]

[tool.hatch.build.targets.sdist]
exclude = ["evaluation", "examples", "tests", "research", ".scratch"]

[project.scripts]
graphknows-mcp = "graphknows.mcp.stdio_server:main"
graphknows-web = "graphknows.web.server:main"

# ── Dev tooling ────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "tach>=0.35.0",
    "import-linter>=2.11",
]
eval = [
    "datasets>=2.19.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "tabulate>=0.9.0",
]

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "graphknows.config",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = [
    "graphknows.memory.query.*",
    "graphknows.memory.stores.*",
    "graphknows.mcp.*",
    "graphknows.ingestion.*",
]
disable_error_code = ["no-any-return", "type-arg", "arg-type", "union-attr", "attr-defined", "return-value"]
