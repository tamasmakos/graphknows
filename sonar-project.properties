# SonarQube Cloud — project identity
# sonar.organization is set by the SONAR_TOKEN environment variable in CI.
# Fill in after creating the project at https://sonarcloud.io
sonar.projectKey=tamasmakos_graphknows
sonar.organization=tamasmakos

# Human-readable display name
sonar.projectName=graphknows
sonar.projectVersion=1.0

# ---------------------------------------------------------------------------
# Source scope — graphknows package only (agent/search are separate services)
# ---------------------------------------------------------------------------
sonar.sources=graphknows
sonar.exclusions=\
  **/graphgen/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/dist/**

sonar.tests=tests
sonar.test.inclusions=\
  tests/memory/test_adapter.py,\
  tests/memory/test_adapter_types.py,\
  tests/memory/test_dialog.py,\
  tests/memory/test_extractor.py,\
  tests/memory/test_flush.py,\
  tests/memory/test_ingestor.py,\
  tests/memory/test_tool_summarizer.py,\
  tests/retrieval/test_memgraph_store.py,\
  tests/retrieval/test_neo4j_store.py,\
  tests/retrieval/test_pgvector_store.py,\
  tests/retrieval/test_recall.py,\
  tests/retrieval/test_schema.py,\
  tests/mcp_server/test_stdio_server.py,\
  tests/cli/test_memory.py,\
  tests/ontology/test_ontology.py,\
  tests/package/test_config.py,\
  tests/ingestion/test_parsers.py

# ---------------------------------------------------------------------------
# Language
# ---------------------------------------------------------------------------
sonar.language=python
sonar.python.version=3.11, 3.13

# ---------------------------------------------------------------------------
# Coverage (generated by pytest-cov in CI, uploaded as artifact)
# ---------------------------------------------------------------------------
sonar.python.coverage.reportPaths=coverage.xml

# Exclude service implementation files that require live infrastructure
# (FastAPI endpoints, DB connectors, run entrypoints) — tested in integration
# tests only, not in CI unit tests that run without services.
sonar.coverage.exclusions=\
  **/api.py,\
  **/run.py,\
  **/main.py,\
  **/retrieval/**,\
  **/graphgen/**,\
  **/container.py,\
  **/migrations/**,\
  **/cli/**
