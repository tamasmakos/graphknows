name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python: lint + test ────────────────────────────────────────────────────
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system \
            ruff pytest pytest-asyncio \
            httpx fastapi pydantic \
            numpy sentence-transformers \
            langchain-core langgraph langchain-groq \
            psycopg2-binary pgvector \
            neo4j pymgclient || true
          # Install service packages in editable mode for import resolution
          uv pip install --system -e services/graphgen 2>/dev/null || true
          uv pip install --system -e services/graphrag 2>/dev/null || true
          uv pip install --system -e libs/python/graphknows-shared 2>/dev/null || true

      - name: Lint (ruff)
        run: |
          ruff check services/ libs/ --output-format github

      - name: Test
        env:
          PYTHONPATH: ".:services:services/agent"
          GROQ_API_KEY: "ci-placeholder"
          SEARCH_SERVICE_URL: "http://localhost:8040"
          AGENT_SERVICE_URL: "http://localhost:8002"
        run: |
          python -m pytest tests/ -q --tb=short --ignore=tests/test_graphgen_pipeline.py
