[project]
name = "graphknows"
version = "1.0.0"
description = "Unified agentic memory: graph ingestion + hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    "httpx>=0.27.0",
    # Databases
    "neo4j>=5.21.0",
    "asyncpg>=0.29.0",
    # ML / embeddings (graphknows + vendored graphgen pipeline)
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0",
    # NLP / graph extraction (vendored graphgen)
    "gliner>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-experimental>=0.3.0",
    # MCP
    "mcp>=1.0.0",
    # Shared config
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
graphknows-memory = "graphknows.cli.memory:cli"

[tool.hatch.build.targets.wheel]
packages = ["graphknows"]
