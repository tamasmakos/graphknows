name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows manual runs from the GitHub Actions UI or gh CLI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Format + Lint — runs first, gates the test matrix ──────────────────
  lint:
    name: Format & Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install ruff (isolated tool — no workspace deps needed)
        run: uv tool install ruff

      - name: Check formatting
        run: ruff format --check --config ruff.toml services/graphknows/

      - name: Check lint
        run: ruff check --no-fix --config ruff.toml --output-format github services/graphknows/

      - name: Ban sentence-transformers imports in production code
        run: |
          # Grep for actual import statements only (not comments/docstrings)
          if grep -rn 'from sentence_transformers\|import sentence_transformers' \
            --include='*.py' \
            --exclude-dir='.venv' --exclude-dir='research' --exclude-dir='tests' \
            services/ ; then
            echo "::error::sentence-transformers import found in production code — remove it"
            exit 1
          fi
          if grep -q 'sentence-transformers' services/graphknows/pyproject.toml \
            services/search/pyproject.toml services/agent/pyproject.toml 2>/dev/null; then
            echo "::error::sentence-transformers dep found in a pyproject.toml — remove it"
            exit 1
          fi
          if grep -c 'sentence.transform' uv.lock 2>/dev/null | grep -qv '^0$'; then
            echo "::error::sentence-transformers found in root uv.lock — regenerate with: uv lock"
            exit 1
          fi
          echo "sentence-transformers: clean"

  # ── 2. Type checking — blocked by lint, non-blocking during ramp-up ────────
  type-check:
    name: Type check (mypy)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # flip to false once the type baseline is clean

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev group
        run: uv sync --group dev

      - name: mypy (graphknows core — excludes graphgen)
        run: |
          uv run mypy \
            services/graphknows/graphknows/ \
            --exclude 'graphgen' \
            --exclude 'cli/memory' \
            --exclude 'feature_engineering' \
            --exclude 'forget' \
            --exclude 'mcp_ltm' \
            --exclude 'recall' \
            --exclude 'topic_summarizer' \
            --strict \
            --ignore-missing-imports \
            --allow-untyped-decorators \
            --no-warn-unused-ignores
          # TODO(tech-debt): remove excludes above as type annotations are added

  # ── 3. Security scan — always runs independently ──────────────────────────
  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install bandit (isolated tool)
        run: uv tool install bandit

      - name: bandit (OWASP — graphknows core, excludes graphgen)
        run: |
          bandit \
            -r services/graphknows/graphknows/ \
            --exclude services/graphknows/graphknows/graphgen \
            --skip B101,B104,B105,B110 \
            -f screen
          # B101: assert — acceptable in non-prod code
          # B104: bind 0.0.0.0 — intentional in containerised service
          # B105: hardcoded password — sentinel default comparison, not real credential
          # B110: try/except/pass — intentional in shutdown cleanup paths

  # ── 4. Build wheel + test against installed package ───────────────────────
  # Matrix across min-supported (3.11) and runtime (3.13) versions.
  # Blocked by lint so the matrix doesn't spin up on broken code.
  test:
    name: "Tests — Python ${{ matrix.python-version }}"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # show failures for all versions, not just the first
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workspace + dev group
        run: uv sync --all-packages --group dev --python ${{ matrix.python-version }}

      - name: Build wheel (catches packaging bugs early)
        run: uv build --package graphknows --out-dir dist/

      - name: Run tests
        env:
          PYTHONPATH: ".:services:services/agent"
          OPENROUTER_API_KEY: "ci-placeholder"
          SEARCH_SERVICE_URL: "http://localhost:8040"
          AGENT_SERVICE_URL: "http://localhost:8002"
        run: |
          uv run pytest \
            tests/test_graphknows_package.py \
            tests/test_langgraph_agent_search_web.py \
            -v --tb=short \
            --cov=services/graphknows/graphknows \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
          # Other test files are excluded: they test pre-refactor module paths
          # (services.agent.*, services.graphgen.*, graphknows.shared.*) that
          # require a full multi-service environment not available in CI.
          # Track in: https://github.com/tamasmakos/graphknows/issues (TODO)

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ── 5. SonarQube Cloud — quality gate (non-blocking until baseline is clean) ─
  sonar:
    name: SonarQube analysis
    needs: [lint, test]        # only analyse code that already passes lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true    # non-blocking: SonarCloud project needs SONAR_TOKEN + sonar-project.properties
    if: ${{ !cancelled() && needs.lint.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history required for blame / new-code detection

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
