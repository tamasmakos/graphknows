      - next year
      - ago
      - soon
      - recently
      - always
      - never
      - sometimes
    description: >
      Any temporal reference: a specific date, time, duration, or period.
      Covers absolute dates and relative time expressions as they appear
      in everyday conversation. Examples: "last Tuesday", "three years ago",
      "every Friday evening", "in the summer of 2019".
    classification_tokens:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
      - JANUARY
      - FEBRUARY
      - MARCH
      - APRIL
      - JUNE
      - JULY
      - AUGUST
      - SEPTEMBER
      - OCTOBER
