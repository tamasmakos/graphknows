[project]
name = "graphknows"
version = "1.0.0"
description = "Unified agentic memory: graph ingestion + hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    "httpx>=0.27.0",
    # Databases
    "neo4j>=5.21.0",
    "asyncpg>=0.29.0",
    # ML / embeddings (graphknows + vendored graphgen pipeline)
    "numpy>=1.26.0",
    "networkx>=3.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "pyyaml>=6.0",
    # NLP / graph extraction (vendored graphgen)
    "gliner>=0.2.0",
    "gliner2>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-experimental>=0.3.0",
    "dspy>=2.5.0",
    "rdflib>=7.0.0",
    "click>=8.1.0",
    # Document parsing
    "pymupdf>=1.24.0",
    "pdfminer.six>=20221105",
    "spacy>=3.7.0",
    "tiktoken>=0.7.0",
    "python-docx>=1.1.0",
    # MCP
    "psycopg2-binary>=2.9.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphknows"]

[project.scripts]
graphknows-memory = "graphknows.cli.memory:cli"
graphknows-mcp = "graphknows.mcp.stdio_server:main"

# ── Dev tooling ────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]

[[tool.mypy.overrides]]
module = ["graphknows.api"]
disable_error_code = ["misc", "no-any-return", "arg-type", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "graphknows.models.*",
    "graphknows.config",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = [
    "graphknows.container",
    "graphknows.retrieval.*",
    "graphknows.mcp.*",
    "graphknows.ingestion.*",
    "graphknows.ontology.*",
]
disable_error_code = ["no-any-return", "type-arg", "arg-type", "union-attr", "attr-defined", "return-value"]
