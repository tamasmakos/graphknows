# docker-compose.yaml — ArcadeDB-only stack
# Services: arcadedb, mcp, workspace, web
# Usage: docker compose up -d

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  arcadedb:
    image: arcadedata/arcadedb:latest
    ports:
      - "${ARCADEDB_HTTP_PORT:-2480}:2480"
    environment:
      JAVA_OPTS: "-Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-changeme}"
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    restart: unless-stopped
    healthcheck:
      # The arcadedb image ships wget, not curl — curl exec-fails every probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Application Services ────────────────────────────────────────────────────

  mcp:
    container_name: graphknows-mcp
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    command: graphknows-mcp
    environment:
      ARCADEDB_URL: "${ARCADEDB_URL:-http://arcadedb:2480}"
      ARCADEDB_USER: "${ARCADEDB_USER:-root}"
      ARCADEDB_PASSWORD: "${ARCADEDB_PASSWORD:-changeme}"
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      LLM_GROQ_API_KEY: "${LLM_GROQ_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      LLM_OPENAI_API_KEY: "${LLM_OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-8800}:8800"
    environment:
      ARCADEDB_URL: "${ARCADEDB_URL:-http://arcadedb:2480}"
      ARCADEDB_USER: "${ARCADEDB_USER:-root}"
      ARCADEDB_PASSWORD: "${ARCADEDB_PASSWORD:-changeme}"
      GRAPHKNOWS_WEB_HOST: "0.0.0.0"
      GRAPHKNOWS_WEB_PORT: "8800"
      GRAPHKNOWS_FRONTEND_DIR: "/app/frontend"
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: unless-stopped

  workspace:
    container_name: graphknows-workspace
    image: graphknows-workspace:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    working_dir: /app
    volumes:
      - .:/app
    environment:
      ARCADEDB_URL: "${ARCADEDB_URL:-http://arcadedb:2480}"
      ARCADEDB_USER: "${ARCADEDB_USER:-root}"
      ARCADEDB_PASSWORD: "${ARCADEDB_PASSWORD:-changeme}"
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      LLM_GROQ_API_KEY: "${LLM_GROQ_API_KEY:-}"
      LLM_OPENAI_API_KEY: "${LLM_OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      PYTHONPATH: /app
    tty: true
    stdin_open: true
    command: /bin/bash
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: unless-stopped

  # ── Observability (optional profile) ────────────────────────────────────────

  langfuse:
    image: langfuse/langfuse:2.95.0
    profiles: ["observability"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${LANGFUSE_DATABASE_URL:-postgresql://langfuse:langfuse@langfuse-db:5432/langfuse}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}"
      SALT: "${LANGFUSE_SALT:-change-me-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16.6-alpine
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langfuse_data:/var/lib/postgresql/data

volumes:
  arcadedb_data:
  langfuse_data:
