# EU Politics domain taxonomy
# ---------------------------------------------------------------------------
# All entity type names, aliases, classification rules, confidence thresholds,
# and relation types for the EU politics knowledge graph pipeline.
#
# Schema: graphgen/config/taxonomy.py → TaxonomyConfig
# ---------------------------------------------------------------------------

name: eu-politics
version: "1.0"

# ---------------------------------------------------------------------------
# Entity groups
# Each top-level key is a canonical entity class.
# children   — sub-labels recognised by GLiNER2 and grouped under this class
# aliases    — text hints used by select_candidate_labels() for schema ranking
# description — free-text description passed to GLiNER2 schema-guided NER
# classification_tokens — UPPER_SNAKE tokens matched by rule-based classifier
# classification_patterns — regex patterns (applied to UPPER_SNAKE form)
# min_ner_confidence — minimum GLiNER2 score for relation-eligibility gate
# ---------------------------------------------------------------------------

entity_groups:

  PERSON:
    children:
      - PERSON
      - POLITICIAN
      - COMMISSIONER
      - PRESIDENT
      - CHAIRPERSON
    aliases:
      - person
      - president
      - commissioner
      - leader
      - prime minister
      - speaker
    description: >
      A named person, political leader, office-holder, or individual speaker.
    classification_tokens:
      - MR
      - MS
      - MRS
      - DR
      - PRESIDENT
      - MINISTER
      - COMMISSIONER
      - CHANCELLOR
      - PRIME_MINISTER
    classification_patterns: []
    min_ner_confidence: 0.0

  ORGANIZATION:
    children:
      - ORGANIZATION
      - POLITICAL_PARTY
      - INSTITUTION
      - AGENCY
      - COMMISSION
      - PARLIAMENT
      - COUNCIL
      - BANK
    aliases:
      - organization
      - commission
      - parliament
      - council
      - party
      - agency
      - bank
      - kremlin
      - army
      - military
      - union
    description: >
      An institution, parliament, commission, party, bank, or agency.
    classification_tokens:
      - NATO
      - UNICEF
    classification_patterns:
      - "_COMMISSION$"
      - "_PARLIAMENT$"
      - "_UNION$"
      - "_COUNCIL$"
      - "_AGENCY$"
      - "_COURT$"
      - "_ORGANIZATION$"
      - "_PARTY$"
      - "\\bPARTY\\b"
      - "\\bNATO\\b"
      - "\\bUNICEF\\b"
    min_ner_confidence: 0.6

  LOCATION:
    children:
      - LOCATION
      - COUNTRY
      - CITY
      - REGION
      - PLACE
      - CAPITAL
    aliases:
      - location
      - country
      - city
      - region
      - brussels
      - france
      - germany
      - ukraine
      - mediterranean
      - europe
    description: >
      A named place, city, region, country, or geopolitical location.
    classification_tokens:
      - AUSTRIA
      - BELGIUM
      - BULGARIA
      - CROATIA
      - CYPRUS
      - CZECHIA
      - DENMARK
      - ESTONIA
      - FINLAND
      - FRANCE
      - GERMANY
      - GREECE
      - HUNGARY
      - IRELAND
      - ITALY
      - LATVIA
      - LITHUANIA
      - LUXEMBOURG
      - MALTA
      - NETHERLANDS
      - POLAND
      - PORTUGAL
      - ROMANIA
      - SLOVAKIA
      - SLOVENIA
      - SPAIN
      - SWEDEN
      - EUROPE
      - REGION
      - COUNTRY
      - CITY
      - CAPITAL
      - BRUSSELS
      - PARIS
      - BERLIN
      - ROME
      - MADRID
      - WARSAW
      - LISBON
      - VIENNA
      - ATHENS
      - DUBLIN
      - AMSTERDAM
      - HELSINKI
      - STOCKHOLM
      - PRAGUE
      - BUDAPEST
      - SOFIA
      - BUCHAREST
      - RIGA
      - VILNIUS
      - TALLINN
      - LJUBLJANA
      - BRATISLAVA
      - ZAGREB
      - NICOSIA
      - VALLETTA
      - LUXEMBOURG_CITY
    classification_patterns: []
    min_ner_confidence: 0.6

  POLICY:
    children:
      - POLICY
      - REGULATION
      - LAW
      - DIRECTIVE
      - TREATY
      - FRAMEWORK
    aliases:
      - policy
      - regulation
      - law
      - directive
      - framework
      - migration
      - climate
      - sanctions
      - aid
      - health
      - security
      - energy
      - defence
      - defense
    description: >
      A named policy, directive, regulation, treaty, or governance framework.
    classification_tokens:
      - POLICY
      - REGULATION
      - DIRECTIVE
      - TREATY
    classification_patterns: []
    min_ner_confidence: 0.0

  EVENT:
    children:
      - EVENT
      - SUMMIT
      - MEETING
      - ELECTION
      - CRISIS
      - WAR
      - DEBATE
    aliases:
      - event
      - summit
      - meeting
      - election
      - crisis
      - war
      - debate
      - conference
    description: >
      A summit, election, crisis, war, debate, or named political event.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.5

# ---------------------------------------------------------------------------
# Hard overrides — bypass scoring; map normalised entity name → canonical label
# ---------------------------------------------------------------------------

overrides:
  KREMLIN: ORGANIZATION
  RUSSIAN_ARMY: ORGANIZATION
  SANCTIONS: POLICY_INSTRUMENT
  AID: POLICY_INSTRUMENT
  ENERGY_DEPENDENCE: POLICY_INSTRUMENT
  SECURITY_AND_DEFENCE_UNION: POLICY_INSTRUMENT
  MIGRATION: POLICY_INSTRUMENT
  CLIMATE: POLICY_INSTRUMENT
  HEALTH: POLICY_INSTRUMENT
  SECURITY: POLICY_INSTRUMENT
  POLICY_CHANGES: POLICY_INSTRUMENT

# ---------------------------------------------------------------------------
# Relation types — used by DSPy relation extractor as allowed relation labels
# ---------------------------------------------------------------------------

relation_types:
  - OPPOSES
  - SUPPORTS
  - NEGOTIATES_WITH
  - SANCTIONS
  - ALLIES_WITH
  - LEADS
  - PARTICIPATES_IN
  - RESPONDS_TO
  - IMPLEMENTS
  - CRITICIZES
  - ENDORSES

# ---------------------------------------------------------------------------
# Graph hierarchy — informational; consumed by schema.py and segment builder
# Top-level nodes listed in order from container → leaf
# ---------------------------------------------------------------------------

hierarchy:
  SEGMENT:
    edges:
      - CONTAINS_DOC
    properties:
      - segment_id
      - ingested_at
      - run_id
      - git_revision
      - config_hash
      - pipeline_version
      - source_count
      - input_dir
      - taxonomy_name
  DOC:
    edges:
      - HAS_PASSAGE
    properties:
      - id
      - name
      - node_type
      - ontology_class
  PASSAGE:
    edges:
      - HAS_CHUNK
    properties:
      - id
      - doc_id
      - passage_idx
      - content
  CHUNK:
    edges:
      - MENTIONS
    properties:
      - id
      - doc_id
      - text
      - length
  ENTITY:
    edges:
      - IN_COMMUNITY
      - RELATION
      - CO_OCCURS
    properties:
      - id
      - name
      - label
      - ontology_class
      - ingested_at
      - contributing_session_id
      - merged_session_count
  TOPIC:
    edges: []
    properties:
      - id
      - label
      - summary
      - community_id
