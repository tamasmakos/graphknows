# Conversational Taxonomy for Personal Multi-Session Dialogue
# ---------------------------------------------------------------------------
# Tuned for the LoCoMo benchmark and similar personal conversation corpora:
# people, relationships, preferences, events, possessions, places, dates.
#
# Design goal: deterministic entity/relation extraction without a language model.
# Every label is grounded in surface features of everyday dialogue.
#
# Schema: graphknows/ingestion/domain/taxonomy.py → TaxonomyConfig
# ---------------------------------------------------------------------------

name: conversational
version: "1.0"

# ---------------------------------------------------------------------------
# Entity groups — 12 groups covering personal dialogue content
# ---------------------------------------------------------------------------

entity_groups:

  # ── People ─────────────────────────────────────────────────────────────────
  PERSON:
    children:
      - PERSON
      - INDIVIDUAL
      - NAMED_PERSON
    aliases:
      - person
      - man
      - woman
      - guy
      - girl
      - boy
      - someone
      - friend
      - colleague
      - neighbour
      - neighbor
    description: >
      A named or referred-to individual person in a personal conversation.
      Includes the speaker, the listener, and any third parties mentioned
      by name or by pronoun when clearly identified. Examples: "Alice",
      "my boss Tom", "the doctor".
    classification_tokens:
      - MR
      - MRS
      - MS
      - DR
      - PROF
    classification_patterns:
      - "^[A-Z][A-Z_]*$"
    min_ner_confidence: 0.0

  # ── Interpersonal relationships ────────────────────────────────────────────
  RELATIONSHIP:
    children:
      - RELATIONSHIP
      - FAMILY_ROLE
      - SOCIAL_ROLE
    aliases:
      - mother
      - father
      - parent
      - sister
      - brother
      - sibling
      - daughter
      - son
      - child
      - grandparent
      - grandmother
      - grandfather
      - aunt
      - uncle
      - cousin
      - husband
      - wife
      - spouse
      - partner
      - boyfriend
      - girlfriend
      - friend
      - best friend
      - coworker
      - colleague
      - boss
      - manager
      - neighbour
      - neighbor
      - roommate
      - flatmate
    description: >
      A named interpersonal relationship role between two people, typically
      expressed using kinship or social-role terms. Examples: "my sister Lisa",
      "her boyfriend", "his boss Mark", "my best friend".
    classification_tokens:
      - SISTER
      - BROTHER
      - MOTHER
      - FATHER
      - FRIEND
      - HUSBAND
      - WIFE
      - PARTNER
      - COUSIN
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Life events ────────────────────────────────────────────────────────────
  EVENT:
    children:
      - EVENT
      - OCCASION
      - MILESTONE
      - APPOINTMENT
      - SOCIAL_EVENT
    aliases:
      - event
      - occasion
      - birthday
      - wedding
      - graduation
      - anniversary
      - party
      - trip
      - holiday
      - vacation
      - meeting
      - appointment
      - concert
      - festival
      - ceremony
      - funeral
      - interview
      - exam
      - game
      - match
    description: >
      A bounded personal or social occurrence: a life milestone, social
      gathering, appointment, trip, or other notable happening. Examples:
      "her birthday party", "our wedding anniversary", "the job interview",
      "last summer's trip to Greece".
    classification_tokens:
      - BIRTHDAY
      - WEDDING
      - GRADUATION
      - ANNIVERSARY
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Activities and hobbies ─────────────────────────────────────────────────
  ACTIVITY:
    children:
      - ACTIVITY
      - HOBBY
      - SPORT
      - PASTIME
      - ROUTINE
    aliases:
      - activity
      - hobby
      - sport
      - exercise
      - cooking
      - reading
      - gaming
      - hiking
      - running
      - swimming
      - painting
      - gardening
      - yoga
      - cycling
      - singing
      - dancing
      - photography
      - travelling
      - traveling
      - shopping
      - volunteering
    description: >
      A recurring activity, hobby, sport, or pastime that a person engages
      in. Distinct from one-off events; emphasises the ongoing nature.
      Examples: "playing chess every Sunday", "her yoga practice", "his
      love of hiking".
    classification_tokens:
      - HOBBY
      - SPORT
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Preferences, opinions, likes and dislikes ──────────────────────────────
  PREFERENCE:
    children:
      - PREFERENCE
      - LIKE
      - DISLIKE
      - OPINION
      - TASTE
    aliases:
      - preference
      - favourite
      - favorite
      - like
      - dislike
      - love
      - hate
      - enjoy
      - prefer
      - opinion
      - taste
      - interest
      - passion
      - aversion
    description: >
      An expressed personal preference, taste, opinion, like, or dislike.
      Covers food, music, films, books, activities, and any other domain
      of personal taste. Examples: "loves Italian food", "hates loud
      music", "prefers tea over coffee", "thinks Python is great".
    classification_tokens:
      - FAVOURITE
      - FAVORITE
      - PREFERENCE
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Possessions and owned objects ──────────────────────────────────────────
  POSSESSION:
    children:
      - POSSESSION
      - OBJECT
      - VEHICLE
      - DEVICE
      - PET
    aliases:
      - car
      - bike
      - bicycle
      - motorbike
      - motorcycle
      - phone
      - laptop
      - computer
      - camera
      - guitar
      - piano
      - instrument
      - dog
      - cat
      - pet
      - house
      - apartment
      - flat
      - boat
      - watch
      - book
      - item
      - possession
      - belonging
    description: >
      A physical object, vehicle, device, or pet that is owned or closely
      associated with a person. Examples: "his old Volkswagen", "her rescue
      cat Milo", "my first guitar", "the laptop I bought last year".
    classification_tokens:
      - DOG
      - CAT
      - CAR
      - BIKE
      - PHONE
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Places and locations ───────────────────────────────────────────────────
  LOCATION:
    children:
      - LOCATION
      - CITY
      - COUNTRY
      - PLACE
      - NEIGHBOURHOOD
      - BUILDING
      - VENUE
    aliases:
      - location
      - place
      - city
      - town
      - village
      - country
      - neighbourhood
      - neighborhood
      - street
      - district
      - region
      - area
      - park
      - restaurant
      - cafe
      - school
      - university
      - college
      - hospital
      - office
      - gym
      - home
    description: >
      Any named or described physical place: a city, country, neighbourhood,
      building, venue, or geographic area. Includes places of residence,
      work, and recreation. Examples: "downtown Toronto", "the coffee shop
      on Main Street", "our old apartment", "Rome".
    classification_tokens:
      - CITY
      - TOWN
      - COUNTRY
      - STREET
      - AVENUE
      - BOULEVARD
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Organizations and institutions ─────────────────────────────────────────
  ORGANIZATION:
    children:
      - ORGANIZATION
      - COMPANY
      - SCHOOL
      - CLUB
      - TEAM
    aliases:
      - organization
      - company
      - firm
      - employer
      - workplace
      - school
      - university
      - college
      - club
      - team
      - group
      - band
      - association
      - society
    description: >
      A named institution, company, club, team, or other organized group
      relevant to a person's life. Examples: "Google", "the local chess
      club", "Manchester United", "Harvard", "her book group".
    classification_tokens:
      - UNIVERSITY
      - COLLEGE
      - SCHOOL
      - COMPANY
      - CLUB
      - TEAM
    classification_patterns: []
    min_ner_confidence: 0.0

  # ── Temporal references ────────────────────────────────────────────────────
  TEMPORAL:
    children:
