[pytest]
testpaths = tests
addopts = --import-mode=importlib
# pytest.ini takes precedence over pyproject.toml, so the `asyncio_mode = auto`
# declared under [tool.pytest.ini_options] there was never applied — async tests
# only ran because each carried an explicit @pytest.mark.asyncio. Declared here
# it is actually in force.
asyncio_mode = auto
pythonpath =
    .
markers =
    integration: marks tests that require live infrastructure (ArcadeDB) — excluded from CI unit test run
    unit: marks pure unit tests with no infrastructure dependencies
