# Intentionality Taxonomy v3 — single unified domain-agnostic taxonomy
# ---------------------------------------------------------------------------
# Changes from v2.1:
#   - EPISTEMIC_STATE/CONATIVE_STATE/AFFECTIVE_STATE descriptions anchored on
#     the ATTITUDE NOUN PHRASE, not the cognitive verb + clause.
#     Structural (verb + complement) relations are now handled by SpaCy dep
#     patterns in graphknows/graphgen/extraction/spacy_relations.py.
#   - CONCEPT description: balanced between philosophy specificity (Sinn) and
#     legal/scientific generality.
#   - ARTIFACT: tightened to named documents/systems (not German loanwords).
#   - All per-label thresholds preserved from v2.
#   - Descriptions ≤40 tokens each.
# ---------------------------------------------------------------------------

name: intentionality
version: "3.1"

entity_groups:

  # ── Stratum I: Intentional subject ────────────────────────────────────────
  AGENT:
    children: [AGENT, PERSON, ORGANIZATION, INSTITUTION, COLLECTIVE, THINKER, SPEAKER, AUTHOR]
    aliases: [agent, person, thinker, philosopher, author, researcher, speaker, organization, institution, mind, subject]
    description: >
      A person, thinker, philosopher, researcher, speaker, organization, or collective
      that thinks or speaks intentionally. Examples: Brentano, the European Commission,
      a narrator, a research team, Data Protection Authorities.
    classification_tokens: [MR, MS, DR, PROFESSOR, PHILOSOPHER, RESEARCHER, AUTHOR]
    classification_patterns: []
    min_ner_confidence: 0.45

  # ── Stratum II: Propositional content ─────────────────────────────────────
  CONCEPT:
    children: [CONCEPT, PRINCIPLE, CATEGORY, PROPERTY, NOTION, TERM, PHENOMENON]
    aliases: [concept, notion, idea, principle, property, phenomenon, category, term, abstraction, construct]
    description: >
      An abstract idea, principle, or category that is the object of thought:
      intentionality, consciousness, Sinn, Bedeutung, opacity, propositional attitude,
      purpose limitation, entropy, justice. Not a physical object or named agent.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.35

  PROPOSITION:
    children: [PROPOSITION, THESIS, CLAIM, BELIEF_CONTENT, HYPOTHESIS, CONJECTURE]
    aliases: [proposition, thesis, claim, assertion, hypothesis, conjecture, statement, view, position]
    description: >
      A named thesis, claim, or view expressed as 'the view that', 'the claim that',
      'the thesis that', 'the position that'. Examples: 'intentionality is the mark
      of the mental', 'consciousness is substrate-independent', 'data cannot be repurposed'.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.25

  ARGUMENT:
    children: [ARGUMENT, PROOF, PUZZLE, PARADOX, OBJECTION, COUNTEREXAMPLE]
    aliases: [argument, proof, puzzle, paradox, objection, counterexample, reasoning, demonstration]
    description: >
      A named argument, proof, puzzle, paradox, or objection:
      Frege's puzzle, the knowledge argument, the Gettier counterexample,
      the argument from opacity, Moore's open question argument.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.30

  THEORY:
    children: [THEORY, FRAMEWORK, DOCTRINE, SEMANTICS, ACCOUNT, MODEL, SYSTEM]
    aliases: [theory, framework, semantics, doctrine, account, model, approach, system, analysis]
    description: >
      A named theory, framework, or doctrine: speech act theory, possible-worlds semantics,
      Fregean sense theory, GDPR framework, Bayesian epistemology, relevance theory.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.30

  # ── Stratum III: Attitudinal state nouns ──────────────────────────────────
  #   NOTE: verb+clause patterns (believes THAT X) are extracted by
  #   SpaCyRelationExtractor. These labels target the ATTITUDE NOUN itself.
  EPISTEMIC_STATE:
    children: [EPISTEMIC_STATE, BELIEF, KNOWLEDGE, DOUBT, CERTAINTY, ASSUMPTION, OPINION]
    aliases: [belief, knowledge, doubt, certainty, assumption, opinion, conviction, epistemic]
    description: >
      An epistemic state noun or phrase — the state itself, not its propositional content:
      belief, knowledge, certainty, doubt, assumption, opinion, conviction.
      Examples: 'her belief', 'epistemic certainty', 'his doubt', 'the knowledge that'.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.30

  CONATIVE_STATE:
    children: [CONATIVE_STATE, DESIRE, INTENTION, GOAL, PREFERENCE, MOTIVATION, WILL]
    aliases: [desire, intention, goal, preference, motivation, will, aim, want, volition]
    description: >
      A conative or volitional state noun — the state itself: intention, desire, goal,
      preference, motivation, will, aim, volition.
      Examples: 'his intention', 'a desire for', 'the goal of', 'her motivation'.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.28

  AFFECTIVE_STATE:
    children: [AFFECTIVE_STATE, EMOTION, FEELING, MOOD, SENTIMENT, VALUATION]
    aliases: [emotion, feeling, mood, sentiment, fear, hope, joy, anger, love, anxiety]
    description: >
      An emotion or feeling noun — the emotion itself, not what is feared or hoped for:
      fear, hope, love, joy, anger, sorrow, anxiety, admiration, distress.
      Examples: 'a feeling of fear', 'the emotion', 'her hope', 'deep anxiety'.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.28

  # ── Stratum IV: Illocutionary acts ────────────────────────────────────────
  SPEECH_ACT:
    children: [SPEECH_ACT, ASSERTION, DIRECTIVE, COMMISSIVE, EXPRESSIVE, DECLARATION, QUESTION, COMMAND, PROMISE]
    aliases: [speech act, assertion, directive, commissive, declaration, question, command, promise, illocutionary, utterance]
    description: >
      A named illocutionary act or performative: an assertion, declaration, promise,
      command, or question. 'Hereby declares', 'I promise', 'I assert', Article 5 asserts,
      performative utterances with named illocutionary force.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.30

  # ── Stratum V: Reasoning steps ────────────────────────────────────────────
  INFERENCE:
    children: [INFERENCE, DEDUCTION, INDUCTION, ABDUCTION, IMPLICATION, CONCLUSION]
    aliases: [inference, deduction, induction, abduction, conclusion, therefore, follows, entails]
    description: >
      A logical conclusion or inferential step: 'therefore', 'it follows that',
      'we can conclude', 'the best explanation is', 'necessarily', 'thus', 'hence'.
      A deductive, inductive, or abductive move from premises to conclusion.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.25

  # ── Cross-cutting anchors ──────────────────────────────────────────────────
  ARTIFACT:
    children: [ARTIFACT, DOCUMENT, WORK, TEXT, TOOL, SYSTEM, LANGUAGE, SYMBOL]
    aliases: [artifact, document, work, text, book, paper, tool, system, language, symbol, regulation, directive]
    description: >
      A named document, regulation, system, or language: Principia Mathematica,
      the GDPR, Article 5, the Treaty of Lisbon, Python, a formal proof system.
      Named human-created objects, not abstract concepts.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.40

  EVENT:
    children: [EVENT, OCCURRENCE, EPISODE, DISCOVERY, PUBLICATION]
    aliases: [event, occurrence, episode, discovery, publication, meeting, development]
    description: >
      A specific bounded occurrence: a discovery, publication, conference, court ruling,
      or historical event at a particular time.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.42

  PROCESS:
    children: [PROCESS, ACTIVITY, PRACTICE, METHOD, PROCEDURE]
    aliases: [process, activity, practice, method, procedure, approach, technique, operation]
    description: >
      An ongoing activity or procedure: the scientific method, deliberation, argumentation,
      data processing, peer review, language learning, conceptual analysis.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.38

  LOCATION:
    children: [LOCATION, PLACE, REGION, DOMAIN, FIELD]
    aliases: [location, place, region, domain, field, area, discipline, context]
    description: >
      A place, region, field of inquiry, or discipline: Vienna, the philosophy of language,
      cognitive science, the analytic tradition, the legal domain.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.48

  TIME:
    children: [TIME, DATE, PERIOD, ERA, EPOCH]
    aliases: [time, date, period, era, century, year, epoch, age]
    description: >
      A date, period, era, or epoch: the late nineteenth century, 1892, Q3,
      the analytic turn, the Enlightenment, the twentieth century.
    classification_tokens: []
    classification_patterns: []
    min_ner_confidence: 0.45

overrides:
  INTENTIONALITY: CONCEPT
  CONSCIOUSNESS: CONCEPT
  ABOUTNESS: CONCEPT
  DIRECTEDNESS: CONCEPT
  NOEMA: CONCEPT
  NOESIS: CONCEPT
  SINN: CONCEPT
  BEDEUTUNG: CONCEPT
  FREGE: AGENT
  BRENTANO: AGENT
  HUSSERL: AGENT
  SEARLE: AGENT
  AUSTIN: AGENT
  GRICE: AGENT
  RUSSELL: AGENT
  PEIRCE: AGENT

