# tach.toml — module boundary enforcement for graphknows 2.0
# Capability-first architecture: core primitives at the bottom; ingestion and
# retrieval are sibling pipelines that meet only through channels + storage;
# the memory facade composes them; server/integrations sit on top.

source_roots = ["."]

# --- bottom layer: settings, models, exceptions, version, llm helper ---
[[modules]]
path = "graphknows.settings"
depends_on = []

[[modules]]
path = "graphknows.models"
depends_on = []

[[modules]]
path = "graphknows.llm"
depends_on = []

# Transport-neutral leaf utilities.
[[modules]]
path = "graphknows._async_bridge"
depends_on = []

[[modules]]
path = "graphknows.links"
depends_on = []

# --- storage: persistence + store protocols ---
[[modules]]
path = "graphknows.storage"
depends_on = ["graphknows.settings"]

# --- ranking: pure scoring primitives (RRF, rerank). A top-level shared leaf so
#     both channels and retrieval reuse it without a channels<->retrieval edge. ---
[[modules]]
path = "graphknows.ranking"
depends_on = ["graphknows.settings"]

# --- ontology: RDF/OWL term loading + the description-embedding catalog. A
#     top-level shared leaf like ranking: ingestion steers extraction with it and
#     channels retrieve against it, so it cannot live under either. ---
[[modules]]
path = "graphknows.ontology"
depends_on = ["graphknows.settings", "graphknows.storage"]

# --- topics: re-runnable clustering stage over an ingested graph. Depends on
#     storage (reads the entity graph) and settings only; the memory facade
#     composes it, so it never reaches back into ingestion or retrieval. ---
[[modules]]
path = "graphknows.topics"
depends_on = ["graphknows.settings", "graphknows.storage"]

# --- channels: symmetric write/read signals ---
[[modules]]
path = "graphknows.channels"
depends_on = [
  "graphknows.settings",
  "graphknows.storage",
  "graphknows.ranking",
  "graphknows.ontology",
]

# --- ingestion (write path) ---
[[modules]]
path = "graphknows.ingestion"
depends_on = [
  "graphknows._async_bridge",
  "graphknows.settings",
  "graphknows.models",
  "graphknows.storage",
  "graphknows.channels",
  "graphknows.ontology",
  "graphknows.llm",
]

# --- retrieval (read path) ---
[[modules]]
path = "graphknows.retrieval"
depends_on = [
  "graphknows._async_bridge",
  "graphknows.settings",
  "graphknows.models",
  "graphknows.storage",
  "graphknows.channels",
  "graphknows.ranking",
  "graphknows.llm",
]

# --- memory facade: the composition root ---
[[modules]]
path = "graphknows.memory"
depends_on = [
  "graphknows._async_bridge",
  "graphknows.links",
  "graphknows.settings",
  "graphknows.models",
  "graphknows.storage",
  "graphknows.channels",
  "graphknows.ingestion",
  "graphknows.retrieval",
  "graphknows.topics",
]

# --- integrations + server (endpoints) ---
[[modules]]
path = "graphknows.integrations"
depends_on = [
  "graphknows._async_bridge","graphknows.memory", "graphknows.models", "graphknows.ingestion"]

[[modules]]
path = "graphknows.server"
depends_on = [
  "graphknows.links",
  "graphknows.settings",
  "graphknows.models",
  "graphknows.storage",
  "graphknows.memory",
  "graphknows.retrieval",
  "graphknows.ingestion",
  "graphknows.topics",
]
