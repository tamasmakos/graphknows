  - INTENDS
  - FEELS
  - PERCEIVES
  - DOUBTS
  - ASSERTS
  - QUESTIONS
  - COMMANDS
  - DIRECTS
  - PROMISES
  - COMMITS_TO
  - DECLARES
  - REFERS_TO
  - EXPRESSES
  - PRESUPPOSES
  - IMPLICATES
  - DENOTES
  - ENTAILS
  - SUPPORTS
  - EXPLAINS
  - CONTRADICTS
  - GROUNDS
  - DEFINED_AS
  - EXEMPLIFIES
  - CRITIQUES
  - DEFENDS
  - DISTINGUISHES
  - CAUSED_BY
  - PART_OF
  - AUTHORED

hierarchy:
  SEGMENT:
    edges: [CONTAINS_DOC]
    properties: [segment_id, ingested_at, run_id, taxonomy_name]
  DOC:
    edges: [HAS_PASSAGE]
    properties: [id, name, node_type, ontology_class]
  PASSAGE:
    edges: [HAS_CHUNK]
    properties: [id, doc_id, passage_idx, content]
  CHUNK:
    edges: [MENTIONS]
    properties: [id, doc_id, text, length]
  ENTITY:
    edges: [IN_COMMUNITY, RELATION, CO_OCCURS]
    properties: [id, name, label, ontology_class, ingested_at, contributing_session_id, merged_session_count]
  TOPIC:
    edges: []
    properties: [id, label, summary, community_id]
