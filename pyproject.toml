[project]
name = "graphknows-dev"
version = "0.1.0"
description = "Political intelligence platform built on a knowledge graph"
readme = "README.md"
requires-python = ">=3.11"

# UV workspace: each service manages its own dependencies
[tool.uv.workspace]
members = [
    "services/graphknows",
    "services/agent",
    "services/search",
]

# Dev-only tools (linting, testing) — installed in the devcontainer workspace
[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]

[[tool.mypy.overrides]]
# Cannot subclass pydantic/neomodel bases typed as Any; api also has
# third-party Any-propagation throughout endpoint handlers.
module = ["services.graphknows.graphknows.api"]
disable_error_code = ["misc", "no-any-return", "arg-type", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
# Cannot subclass neomodel/pydantic bases that are typed as Any.
module = [
    "services.graphknows.graphknows.models.*",
    "services.graphknows.graphknows.config",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# Third-party Neo4j/pgvector/sentence-transformers return untyped values;
# suppress downstream Any-propagation errors in the service layer.
module = [
    "services.graphknows.graphknows.container",
    "services.graphknows.graphknows.retrieval.*",
    "services.graphknows.graphknows.mcp.*",
    "services.graphknows.graphknows.ingestion.*",
    "services.graphknows.graphknows.ontology.*",
]
disable_error_code = ["no-any-return", "type-arg", "arg-type", "union-attr", "attr-defined", "return-value"]
