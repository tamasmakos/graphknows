# docker-compose.yaml — GraphKnows stack (ArcadeDB + MCP server)
#
#   docker compose up -d                 # arcadedb + mcp
#   docker compose --profile dev up -d   # + workspace dev container
#   docker compose --profile observability up -d   # + Langfuse
#
# Configure via a .env file (see .env.example). All app config is GRAPHKNOWS_*.

x-graphknows-env: &graphknows-env
  GRAPHKNOWS_ARCADEDB_URL: "${GRAPHKNOWS_ARCADEDB_URL:-http://arcadedb:2480}"
  GRAPHKNOWS_ARCADEDB_USER: "${GRAPHKNOWS_ARCADEDB_USER:-root}"
  GRAPHKNOWS_ARCADEDB_PASSWORD: "${GRAPHKNOWS_ARCADEDB_PASSWORD:-changeme}"
  # Preset over the capability knobs; each is independently overridable.
  GRAPHKNOWS_MODE: "${GRAPHKNOWS_MODE:-llm_free}"
  GRAPHKNOWS_TOPICS: "${GRAPHKNOWS_TOPICS:-}"
  GRAPHKNOWS_DSPY_RELATIONS: "${GRAPHKNOWS_DSPY_RELATIONS:-}"
  GRAPHKNOWS_ONTOLOGY: "${GRAPHKNOWS_ONTOLOGY:-}"
  GRAPHKNOWS_LLM_MODEL: "${GRAPHKNOWS_LLM_MODEL:-openrouter/deepseek/deepseek-v4-flash}"
  GRAPHKNOWS_LLM_API_KEY: "${GRAPHKNOWS_LLM_API_KEY:-}"
  GRAPHKNOWS_EMBED_MODEL: "${GRAPHKNOWS_EMBED_MODEL:-BAAI/bge-small-en-v1.5}"

services:
  arcadedb:
    # Pinned to >=26.3.2: that release adds the Graph Analytical View / OLAP
    # engine. Without it, CALL algo.* (e.g. node2vec) runs through the OLTP
    # path and can take minutes on our entity graph, blowing past the HTTP
    # client's read timeout and looking hung. See ltm_store._entity_graph()
    # and the analytical view created in ltm_store for the OLAP-backed path.
    image: arcadedata/arcadedb:26.5.1
    ports:
      - "${GRAPHKNOWS_ARCADEDB_PORT:-2480}:2480"
    environment:
      # Give the JVM real heap: vector indexes (esp. 1536-dim remote embeddings)
      # and graph algorithms are memory-hungry; the 2G default OOMs ("Java heap
      # space") and wedges the whole server (every request then hangs).
      #
      # CRITICAL: the heap MUST be set via ARCADEDB_OPTS_MEMORY, not JAVA_OPTS.
      # server.sh launches java as `$JAVA_OPTS $ARCADEDB_OPTS_MEMORY ...`, and the
      # image ships ARCADEDB_OPTS_MEMORY="-Xms2G -Xmx2G". Since the last -Xmx on
      # the JVM line wins, an -Xmx set in JAVA_OPTS is silently overridden back to
      # 2G. (That's why the earlier 8G/16G "heap raise" commits had no effect.)
      # Tune GRAPHKNOWS_ARCADEDB_XMX to host RAM.
      ARCADEDB_OPTS_MEMORY: "-Xms4G -Xmx${GRAPHKNOWS_ARCADEDB_XMX:-16G}"
      # Keep the image's tuned collector (generational ZGC) — setting JAVA_OPTS
      # replaces the image default, so we must restate it here alongside the root
      # password.
      JAVA_OPTS: "-XX:+UseZGC -XX:+ZGenerational -Darcadedb.server.rootPassword=${GRAPHKNOWS_ARCADEDB_PASSWORD:-changeme}"
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    restart: unless-stopped
    healthcheck:
      # The arcadedb image ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcp:
    container_name: graphknows-mcp
    build:
      context: .
      dockerfile: Dockerfile
      # Pin the shipped stage explicitly: the Dockerfile's LAST stage is `dev`
      # (developer tooling), and an untargeted build would silently pick it up.
      target: runtime
    command: graphknows-mcp
    # Bind-mount the repo so code edits take effect on `restart` without a
    # rebuild. PYTHONPATH=/app makes the live source shadow the copy installed
    # into the image venv: the `graphknows-mcp` console script imports
    # `graphknows`, which then resolves to /app/graphknows first. Dependencies
    # still come from the image — a pyproject/uv.lock change still needs
    # `docker compose build`.
    volumes:
      - .:/app
    environment:
      <<: *graphknows-env
      PYTHONPATH: /app
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: "no"

  # Dev container (mounts the repo, interactive shell). `--profile dev`.
  workspace:
    container_name: graphknows-workspace
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      # Developer tooling (SonarQube CLI) lives in the `dev` stage only, so the
      # shipped mcp/web images stay free of it.
      target: dev
      args:
        # CUDA torch for the workspace ONLY. The Dockerfile defaults TORCH_INDEX
        # to the CPU wheel because that is right for the shipped mcp/web images,
        # but this container is the eval workstation and the compose `deploy`
        # block below reserves the host GPU for it. With the CPU wheel,
        # torch.cuda.is_available() is False and the 467M-parameter relex
        # extractor runs on CPU — conv-30 (49 chunks, the shortest LoCoMo
        # dialogue) took 18.6 minutes to ingest.
        # cu128 matches the host driver (CUDA 12.8); lower it if the driver is older.
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    working_dir: /app
    volumes:
      - .:/app
    environment:
      <<: *graphknows-env
      PYTHONPATH: /app
      # SonarQube CLI headless auth — dev-only, browser `sonar auth login`
      # cannot run in a container. Must be a USER token.
      SONARQUBE_CLI_TOKEN: "${SONARQUBE_CLI_TOKEN:-}"
      SONARQUBE_CLI_ORG: "${SONARQUBE_CLI_ORG:-}"
    tty: true
    stdin_open: true
    command: /bin/bash
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: unless-stopped
    # GPU for GLiNER2 NER (torch). Requires the NVIDIA Container Toolkit on the
    # host; degrades gracefully to CPU if no GPU is present (the loader checks
    # torch.cuda.is_available()). Remove this block on GPU-less hosts.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional tracing. `--profile observability`.
  langfuse:
    image: langfuse/langfuse:2.95.0
    profiles: ["observability"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Intentionally no inline default: a connection string with embedded
      # credentials must not be committed. Set LANGFUSE_DATABASE_URL in .env
      # (see .env.example) when using the observability profile.
      DATABASE_URL: "${LANGFUSE_DATABASE_URL:-}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}"
      SALT: "${LANGFUSE_SALT:-change-me-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16.6-alpine
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${LANGFUSE_DB_USER:-langfuse}"
      POSTGRES_PASSWORD: "${LANGFUSE_DB_PASSWORD:-langfuse}"
      POSTGRES_DB: "${LANGFUSE_DB_NAME:-langfuse}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - langfuse_data:/var/lib/postgresql/data

volumes:
  arcadedb_data:
  langfuse_data:
