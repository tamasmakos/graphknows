# tach.toml — module boundary enforcement for graphknows
# Target architecture (2026-05-31): config is the composition root,
# ingestion owns domain/ontology plugins, and memory owns reads + writes.

source_roots = ["."]

[[modules]]
path = "graphknows.ports"
depends_on = []

# Stdlib-only out-of-process client SDK — depends on nothing but the root
# exception hierarchy, so it installs and imports with the core package alone.
[[modules]]
path = "graphknows.client"
depends_on = []

# Framework adapters — hooks are duck-typed (take a memory instance), the
# langgraph store touches only the root exception hierarchy.
[[modules]]
path = "graphknows.adapters"
depends_on = []

[[modules]]
path = "graphknows.ingestion.domain"
depends_on = []

[[modules]]
path = "graphknows.config"
depends_on = []

[[modules]]
path = "graphknows.config.adapters"
depends_on = [ "graphknows.extraction", "graphknows.memory.stores", "graphknows.ports"]

[[modules]]
path = "graphknows.ingestion"
depends_on = []

[[modules]]
path = "graphknows.extraction"
depends_on = [
  "graphknows.config",
  "graphknows.ingestion.domain",
  "graphknows.ports",
  "graphknows.memory.stores",  # legacy (accepted 2026-07): frames.py reuses embedder — TODO invert
]

[[modules]]
path = "graphknows.memory.models"
depends_on = ["graphknows.memory"]

[[modules]]
path = "graphknows.memory.stores"
depends_on = [
  "graphknows.ingestion.domain",
  "graphknows.memory.ltm",
  "graphknows.memory.models",  # legacy (accepted 2026-07): ltm_store imports gds.CommunityResult
  "graphknows.config",         # legacy (accepted 2026-07): embedder reads GraphKnowsSettings
]

[[modules]]
path = "graphknows.memory.temporal"
depends_on = []

[[modules]]
path = "graphknows.memory.query"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.memory.models",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
  "graphknows.memory.temporal",
  "graphknows.ports",
  "graphknows.memory",  # legacy (accepted 2026-07): retriever imports channels.base/collectors
]

[[modules]]
path = "graphknows.memory.stm"
depends_on = [
  "graphknows.extraction",
  "graphknows.ingestion",
  "graphknows.ingestion.domain",  # legacy (accepted 2026-07): ingest.py reads default taxonomy
  "graphknows.memory.models",
  "graphknows.memory.stores", "graphknows.memory.query", "graphknows.memory",
  "graphknows.memory.temporal",
]

[[modules]]
path = "graphknows.memory.ltm"
depends_on = [
  "graphknows.config",
  "graphknows.memory.models",
]

[[modules]]
path = "graphknows.memory.workflows"
depends_on = [
  "graphknows.extraction",
  "graphknows.ingestion.domain",
  "graphknows.memory",
  "graphknows.memory.models",
  "graphknows.memory.stm", "graphknows.config.builders",
]

[[modules]]
path = "graphknows.memory"
depends_on = [
  "graphknows.config.adapters",
  "graphknows.ingestion",
  "graphknows.ingestion.domain",
  "graphknows.memory.ltm",
  "graphknows.memory.models",
  "graphknows.memory.query",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
  "graphknows.ports",
  "graphknows.extraction",  # legacy (accepted 2026-07): channels + extractor reuse extraction
  "graphknows.config",      # legacy (accepted 2026-07): extractor reads GraphKnowsSettings
]

[[modules]]
path = "graphknows.config.builders"
depends_on = [
  "graphknows.config",
  "graphknows.config.adapters",
  "graphknows.extraction",
  "graphknows.memory",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
  "graphknows.memory.workflows",
  "graphknows.ports",
]

[[modules]]
path = "graphknows.runtime"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.memory",
  "graphknows.memory.models",
  "graphknows.memory.query",
  "graphknows.memory.stm",
  "graphknows.memory.workflows",
]

[[modules]]
path = "graphknows.mcp"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.memory.query",
  "graphknows.memory.stores",
  "graphknows.memory.stm",
  "graphknows.mcp.tools",
  "graphknows.runtime",
]

[[modules]]
path = "graphknows.mcp.tools"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.ingestion.domain",
  "graphknows.mcp",
  "graphknows.web",
  "graphknows.memory",
  "graphknows.memory.models",
  "graphknows.memory.query",
  "graphknows.memory.stm",
  "graphknows.memory.stores",
  "graphknows.memory.workflows",
]

[[modules]]
path = "graphknows.web"
depends_on = [
  "graphknows.config",
  "graphknows.config.builders",
  "graphknows.memory.models",
  "graphknows.runtime",
]
