[project]
name = "graphknows-search"
version = "2.0.0"
description = "Unified EU parliamentary data search — FastAPI REST + MCP stdio server"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    # HTTP client (httpx only — requests removed)
    "httpx",
    # Data validation
    "pydantic>=2",
    # YAML manifest loading
    "pyyaml",
    # MCP server protocol
    "mcp[cli]",
    # HTML → Markdown conversion
    "markdownify",
    # PDF text extraction
    "pymupdf",
    # Language detection
    "langdetect",
    # Semantic search / NLP
    "numpy",
    # Graph cache
    "neo4j",
    # Persistent job queue
    "aiosqlite",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
