# docker-compose.prod.yaml — deployment stack. This is what a customer runs.
#
#   cp .env.example .env      # then set GRAPHKNOWS_ARCADEDB_PASSWORD
#   docker compose -f docker-compose.prod.yaml up -d
#
# Differences from docker-compose.yaml (the DEVELOPMENT stack) — each one is a
# defect that file has when treated as a deployment target:
#
#   1. No `.:/app` bind mount and no PYTHONPATH=/app. The dev stack mounts the
#      repo over the image and puts it first on the path, so containers run
#      LIVE SOURCE against IMAGE DEPENDENCIES. That is convenient while editing
#      and wrong everywhere else: it decouples code from its dependencies, so
#      the image silently goes stale and the drift only ever surfaces as a
#      ModuleNotFoundError at runtime. Here the image is the artifact.
#   2. The ArcadeDB password is REQUIRED, not defaulted to "changeme".
#   3. Every service restarts unless stopped (the dev stack has restart:"no" on
#      mcp, so a crash leaves the stack silently half-up).
#   4. No dev workspace, no jupyter, no bind-mounted source.

x-graphknows-env: &graphknows-env
  GRAPHKNOWS_ARCADEDB_URL: "http://arcadedb:2480"
  GRAPHKNOWS_ARCADEDB_USER: "${GRAPHKNOWS_ARCADEDB_USER:-root}"
  # No default: `:?` makes compose refuse to start rather than deploy a stack
  # whose graph database has a publicly-known password.
  GRAPHKNOWS_ARCADEDB_PASSWORD: "${GRAPHKNOWS_ARCADEDB_PASSWORD:?set GRAPHKNOWS_ARCADEDB_PASSWORD in .env}"
  GRAPHKNOWS_MODE: "${GRAPHKNOWS_MODE:-llm_free}"
  GRAPHKNOWS_TOPICS: "${GRAPHKNOWS_TOPICS:-}"
  GRAPHKNOWS_DSPY_RELATIONS: "${GRAPHKNOWS_DSPY_RELATIONS:-}"
  GRAPHKNOWS_RETRIEVAL: "${GRAPHKNOWS_RETRIEVAL:-}"
  GRAPHKNOWS_ONTOLOGY: "${GRAPHKNOWS_ONTOLOGY:-}"
  GRAPHKNOWS_LLM_MODEL: "${GRAPHKNOWS_LLM_MODEL:-openrouter/deepseek/deepseek-v4-flash}"
  GRAPHKNOWS_LLM_API_KEY: "${GRAPHKNOWS_LLM_API_KEY:-}"
  # Must match the model baked into the image (scripts/bake_models.py reads it
  # from settings). Pointing this elsewhere makes the container download at
  # runtime AND changes the embedding dimension, which is incompatible with an
  # already-populated ArcadeDB vector index.
  GRAPHKNOWS_EMBED_MODEL: "${GRAPHKNOWS_EMBED_MODEL:-BAAI/bge-small-en-v1.5}"

services:
  arcadedb:
    image: arcadedata/arcadedb:26.5.1
    ports:
      - "${GRAPHKNOWS_ARCADEDB_PORT:-2480}:2480"
    environment:
      # The heap MUST be set via ARCADEDB_OPTS_MEMORY, not JAVA_OPTS: server.sh
      # launches java as `$JAVA_OPTS $ARCADEDB_OPTS_MEMORY ...` and the image
      # ships ARCADEDB_OPTS_MEMORY="-Xms2G -Xmx2G". The last -Xmx wins, so an
      # -Xmx in JAVA_OPTS is silently overridden back to 2G. Tune to host RAM;
      # the 2G default OOMs on vector indexes and wedges the whole server.
      ARCADEDB_OPTS_MEMORY: "-Xms2G -Xmx${GRAPHKNOWS_ARCADEDB_XMX:-8G}"
      # Setting JAVA_OPTS replaces the image default, so restate the tuned
      # collector alongside the root password.
      JAVA_OPTS: "-XX:+UseZGC -XX:+ZGenerational -Darcadedb.server.rootPassword=${GRAPHKNOWS_ARCADEDB_PASSWORD:?set GRAPHKNOWS_ARCADEDB_PASSWORD in .env}"
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    restart: unless-stopped
    healthcheck:
      # The arcadedb image ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mcp:
    image: "${GRAPHKNOWS_IMAGE:-graphknows}:${GRAPHKNOWS_TAG:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: graphknows-mcp
    # stdio transport: attach with `docker compose -f docker-compose.prod.yaml
    # run --rm mcp`, or point an MCP client at `docker exec -i`.
    stdin_open: true
    environment:
      <<: *graphknows-env
    depends_on:
      arcadedb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arcadedb_data:
