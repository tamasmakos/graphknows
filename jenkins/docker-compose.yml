# Local Jenkins stack — mirrors the jenkins.io Docker guide for Windows/Linux.
#
# Usage:
#   cd jenkins/
#   docker compose up -d --build
#
# Jenkins UI:   http://localhost:8080
# Initial password:
#   docker exec jenkins-blueocean cat /var/jenkins_home/secrets/initialAdminPassword

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins-docker-certs:
  jenkins-data:

services:
  # Docker-in-Docker daemon — lets Jenkins build/run containers
  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    restart: unless-stopped
    privileged: true
    networks:
      jenkins:
        aliases:
          - docker
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    ports:
      - "2376:2376"

  # Jenkins controller
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphknows-jenkins:local
    container_name: jenkins-blueocean
    restart: on-failure
    depends_on:
      - jenkins-docker
    networks:
      - jenkins
    # Load SONAR_TOKEN (and all other vars) from the repo-root .env file.
    # Docker Compose resolves env_file relative to the compose file's directory,
    # so ../.env points at the repo root.
    env_file:
      - path: ../.env
        required: false   # don't fail if .env doesn't exist yet
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      # Shared Python install dir pre-seeded in the Dockerfile
      UV_PYTHON_INSTALL_DIR: /opt/uv-pythons
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      # Mount the repo root so the built-in SCM polling works out-of-the-box
      # when you point the pipeline at a local path (optional for remote SCM).
      - ..:/workspace:ro
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # Inbound agent port (not needed for local-only setup)
