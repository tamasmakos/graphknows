<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Graphknows — Political Intelligence</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #161b22;
    --bg3: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --blue: #388bfd;
    --blue-dark: #1f4e8c;
    --purple: #7c3aed;
    --accent: #58a6ff;
    --card: #1c2333;
    --radius: 10px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ── Left Panel ── */
  #left {
    width: 40%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--bg2);
    overflow: hidden;
  }

  #header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #58a6ff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  #session-row {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #session-id {
    font-family: monospace;
    font-size: 10px;
    color: var(--accent);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Chat area */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-track { background: transparent; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-user {
    align-self: flex-end;
    background: var(--blue-dark);
    border: 1px solid var(--blue);
    color: #cfe2ff;
    padding: 10px 14px;
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    max-width: 85%;
    line-height: 1.5;
  }

  .msg-agent {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px var(--radius) var(--radius) var(--radius);
    max-width: 92%;
    overflow: hidden;
  }
  .msg-agent .answer-body {
    padding: 12px 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-agent .answer-footer {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chip {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 11px;
    cursor: pointer;
    color: var(--accent);
    transition: border-color 0.2s;
  }
  .chip:hover { border-color: var(--accent); }
  .btn-export-msg {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-export-msg:hover { border-color: var(--accent); color: var(--accent); }

  /* Spinner */
  .spinner {
    align-self: flex-start;
    display: flex;
    gap: 5px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px var(--radius) var(--radius) var(--radius);
  }
  .spinner span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .spinner span:nth-child(2) { animation-delay: 0.2s; }
  .spinner span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Input */
  #input-row {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: var(--bg2);
  }
  #msg-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    min-height: 44px;
    max-height: 120px;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text-muted); }
  #ask-btn {
    background: var(--blue);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 0 18px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  #ask-btn:hover { background: #58a6ff; }
  #ask-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* Reasoning trace */
  #trace-panel {
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
    max-height: 40%;
    display: flex;
    flex-direction: column;
  }
  #trace-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  #trace-header:hover { color: var(--text); }
  #trace-chevron { transition: transform 0.2s; font-size: 10px; }
  #trace-chevron.open { transform: rotate(180deg); }
  #trace-body {
    display: none;
    overflow-y: auto;
    padding: 10px 16px 14px;
    flex: 1;
  }
  #trace-body::-webkit-scrollbar { width: 4px; }
  #trace-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #trace-body.open { display: block; }
  .trace-step {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .trace-num {
    min-width: 20px;
    color: var(--accent);
    font-weight: 600;
    font-family: monospace;
  }

  /* ── Right Panel ── */
  #right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  #graph-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #graph-title {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 4px;
    letter-spacing: 0.5px;
  }
  .toolbar-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  #filter-select {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
  }
  #filter-select:focus { border-color: var(--accent); }

  #graph-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #graph-canvas svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Empty state */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    pointer-events: none;
  }
  #empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  #empty-state p { font-size: 13px; opacity: 0.6; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 1000;
    max-width: 220px;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
  #tooltip .tt-label { color: var(--text-muted); font-size: 11px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #161b22;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 13px;
    z-index: 9999;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    pointer-events: none;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 500px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
    padding: 24px;
  }
  #modal h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
  #modal p { font-size: 13px; line-height: 1.6; color: var(--text-muted); white-space: pre-wrap; }
  #modal-close {
    float: right;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    margin-top: -4px;
  }
  #modal-close:hover { color: var(--text); }

  /* Legend */
  #legend {
    position: absolute;
    bottom: 16px;
    right: 16px;
    background: rgba(22,27,34,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    pointer-events: none;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Responsive */
  @media (max-width: 700px) {
    html, body { overflow: auto; }
    #app { flex-direction: column; height: auto; }
    #left { width: 100%; min-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    #right { height: 50vh; }
    #chat-area { overflow-y: auto; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- ── Left Panel ── -->
  <div id="left">
    <div id="header">
      <h1>Graphknows</h1>
      <div class="subtitle">Political Intelligence</div>
      <div id="session-row">
        <span>Session:</span>
        <span id="session-id">—</span>
      </div>
    </div>

    <div id="chat-area"></div>

    <div id="input-row">
      <textarea id="msg-input" placeholder="Ask about politicians, organizations, laws…" rows="1"></textarea>
      <button id="ask-btn">Ask</button>
    </div>

    <div id="trace-panel">
      <div id="trace-header">
        <span>🔍 Reasoning Trace</span>
        <span id="trace-chevron">▲</span>
      </div>
      <div id="trace-body">
        <div class="trace-step" style="color:var(--text-muted);font-style:italic;font-size:12px;">No reasoning steps yet.</div>
      </div>
    </div>
  </div>

  <!-- ── Right Panel ── -->
  <div id="right">
    <div id="graph-toolbar">
      <span id="graph-title">KNOWLEDGE GRAPH</span>
      <button class="toolbar-btn" id="btn-share">🔗 Share Link</button>
      <button class="toolbar-btn" id="btn-export-png">📤 Export PNG</button>
      <button class="toolbar-btn" id="btn-reset">🔄 Reset</button>
      <select id="filter-select">
        <option value="">🔍 All Labels</option>
        <option value="PERSON">PERSON</option>
        <option value="ORG">ORG</option>
        <option value="GEO">GEO</option>
        <option value="LAW">LAW</option>
        <option value="TOPIC">TOPIC</option>
        <option value="CONCEPT">CONCEPT</option>
      </select>
    </div>

    <div id="graph-canvas">
      <div id="empty-state">
        <div class="icon">🕸️</div>
        <p>Ask a question to build the knowledge graph</p>
      </div>
      <!-- svg inserted by D3 -->
      <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:steelblue"></div> PERSON</div>
        <div class="legend-item"><div class="legend-dot" style="background:mediumpurple"></div> ORG</div>
        <div class="legend-item"><div class="legend-dot" style="background:seagreen"></div> GEO</div>
        <div class="legend-item"><div class="legend-dot" style="background:darkorange"></div> LAW</div>
        <div class="legend-item"><div class="legend-dot" style="background:crimson"></div> TOPIC</div>
        <div class="legend-item"><div class="legend-dot" style="background:goldenrod"></div> CONCEPT</div>
      </div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-label" id="tt-label"></div>
</div>

<!-- Toast -->
<div id="toast">Link copied!</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <h3 id="modal-title">Source</h3>
    <p id="modal-content"></p>
  </div>
</div>

<script>
// ── Utilities ──────────────────────────────────────────────────────────────
function uuid() {
  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

function showToast(msg = 'Link copied!') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function openModal(title, content) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').textContent = content;
  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
});

// ── State ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
let sessionId = params.get('session') || null;

if (!sessionId) {
  sessionId = uuid();
}
function displaySessionId(id) {
  const el = document.getElementById('session-id');
  el.textContent = id.substring(0,8) + '…';
  el.title = id;
}
displaySessionId(sessionId);

// ── Trace panel toggle ─────────────────────────────────────────────────────
const traceHeader = document.getElementById('trace-header');
const traceBody = document.getElementById('trace-body');
const traceChevron = document.getElementById('trace-chevron');
traceHeader.addEventListener('click', () => {
  const open = traceBody.classList.toggle('open');
  traceChevron.classList.toggle('open', open);
});

function setTraceSteps(steps) {
  if (!steps || steps.length === 0) return;
  traceBody.innerHTML = '';
  steps.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'trace-step';
    div.innerHTML = `<span class="trace-num">${i+1}.</span><span>${escHtml(String(s))}</span>`;
    traceBody.appendChild(div);
  });
}

// ── Chat ───────────────────────────────────────────────────────────────────
const chatArea = document.getElementById('chat-area');
const msgInput = document.getElementById('msg-input');
const askBtn = document.getElementById('ask-btn');

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function appendUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function appendSpinner() {
  const div = document.createElement('div');
  div.className = 'spinner';
  div.innerHTML = '<span></span><span></span><span></span><em class="spinner-time">0s…</em>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  const start = Date.now();
  div._timerInterval = setInterval(() => {
    const el = div.querySelector('.spinner-time');
    if (el) el.textContent = Math.floor((Date.now() - start) / 1000) + 's…';
  }, 1000);
  const origRemove = div.remove.bind(div);
  div.remove = () => { clearInterval(div._timerInterval); origRemove(); };
  return div;
}

function appendAgentMsg(answer, sources) {
  const card = document.createElement('div');
  card.className = 'msg-agent';

  const body = document.createElement('div');
  body.className = 'answer-body';
  body.textContent = answer;
  card.appendChild(body);

  const footer = document.createElement('div');
  footer.className = 'answer-footer';

  if (sources && sources.length > 0) {
    sources.forEach((src, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = `[${i+1}]`;
      chip.title = 'Click to view source';
      chip.addEventListener('click', () => openModal(`Source ${i+1}`, src.text || src));
      footer.appendChild(chip);
    });
  }

  const expBtn = document.createElement('button');
  expBtn.className = 'btn-export-msg';
  expBtn.textContent = '⬇ Export';
  expBtn.addEventListener('click', () => {
    const blob = new Blob([answer], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'graphknows-answer.txt';
    a.click();
  });
  footer.appendChild(expBtn);
  card.appendChild(footer);

  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
  return card;
}

function appendOfflineMsg() {
  const card = document.createElement('div');
  card.className = 'msg-agent';
  const body = document.createElement('div');
  body.className = 'answer-body';
  body.innerHTML = `⚠️ <strong>Agent offline</strong> — start <code>services/agent/</code> to continue.`;
  card.appendChild(body);
  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendErrorMsg(msg) {
  const card = document.createElement('div');
  card.className = 'msg-agent';
  card.style.borderColor = '#f85149';
  const body = document.createElement('div');
  body.className = 'answer-body';
  body.style.color = '#f85149';
  body.innerHTML = `🔴 <strong>Error</strong> — ${escHtml(msg)}`;
  card.appendChild(body);
  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function sendMessage(text) {
  appendUserMsg(text);
  const spinner = appendSpinner();
  askBtn.disabled = true;
  msgInput.disabled = true;

  // Try WebSocket first, fall back to HTTP
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsProto}//${location.host}/ws/chat/${sessionId}`;

  try {
    await sendMessageViaWebSocket(wsUrl, text, spinner);
  } catch(e) {
    console.warn('WS failed, falling back to HTTP', e);
    try { spinner.remove(); } catch(_) {}
    const spinner2 = appendSpinner();
    await sendMessageViaHTTP(text, spinner2);
  } finally {
    askBtn.disabled = false;
    msgInput.disabled = false;
    msgInput.focus();
  }
}

async function sendMessageViaWebSocket(wsUrl, text, spinner) {
  return new Promise((resolve, reject) => {
    let ws;
    try {
      ws = new WebSocket(wsUrl);
    } catch(e) {
      return reject(e);
    }

    ws.onopen = () => {
      ws.send(JSON.stringify({ message: text, session_id: sessionId }));
    };

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch(_) { return; }

      if (data.type === 'status') {
        // thinking — spinner already shown
      } else if (data.type === 'step') {
        // Live reasoning step — append to trace
        const stepText = [
          data.thought && `Thought: ${data.thought}`,
          data.action  && `Action: ${data.action}`,
          data.observation && `Obs: ${data.observation}`,
        ].filter(Boolean).join(' | ');
        const div = document.createElement('div');
        div.className = 'trace-step';
        div.innerHTML = `<span class="trace-num">${data.step_num}.</span><span>${escHtml(stepText)}</span>`;
        traceBody.appendChild(div);
        traceBody.scrollTop = traceBody.scrollHeight;
      } else if (data.type === 'answer') {
        spinner.remove();
        if (data.session_id) {
          sessionId = data.session_id;
          displaySessionId(sessionId);
        }
        appendAgentMsg(data.answer || '(no answer)', data.sources || []);
        if (data.graph) {
          mergeGraph(data.graph.nodes || [], data.graph.edges || []);
        }
        ws.close();
        resolve();
      } else if (data.type === 'error') {
        spinner.remove();
        ws.close();
        reject(new Error(data.error));
      }
    };

    ws.onerror = (e) => {
      reject(new Error('WebSocket error'));
    };

    ws.onclose = () => {
      // resolve in case answer was already handled
    };
  });
}

async function sendMessageViaHTTP(text, spinner) {
  try {
    const payload = { message: text, session_id: sessionId };
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });

    spinner.remove();

    if (!res.ok) {
      if (res.status === 503) {
        appendOfflineMsg();
      } else {
        const err = await res.text();
        appendErrorMsg(`Error ${res.status}: ${err}`);
      }
      return;
    }

    const data = await res.json();

    if (data.error === 'agent_offline') {
      appendOfflineMsg();
      return;
    }

    if (data.session_id) {
      sessionId = data.session_id;
      displaySessionId(sessionId);
    }

    appendAgentMsg(data.answer || '(no answer)', data.sources || []);

    if (data.reasoning_steps || data.steps) {
      setTraceSteps(data.reasoning_steps || data.steps);
    }

    if (data.graph) {
      mergeGraph(data.graph.nodes || [], data.graph.edges || []);
    }

  } catch(e) {
    try { spinner.remove(); } catch(_) {}
    appendOfflineMsg();
  }
}

askBtn.addEventListener('click', () => {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendMessage(text);
});

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    askBtn.click();
  }
});

// Auto-resize textarea
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

// ── D3 Graph ───────────────────────────────────────────────────────────────
const COLORS = {
  // Original labels
  PERSON: 'steelblue',
  ORG: 'mediumpurple',
  GEO: 'seagreen',
  LAW: 'darkorange',
  TOPIC: 'crimson',
  CONCEPT: 'goldenrod',
  // Extended labels from actual API
  SOCIETY: 'mediumpurple',
  SITE: 'seagreen',
  REASON: 'darkorange',
  EVENT: 'crimson',
  ORGANIZATION: 'mediumpurple',
  ENTITY: '#888',
  Chunk: '#3a3a5c',
};

const graphCanvas = document.getElementById('graph-canvas');
const WIDTH = () => graphCanvas.clientWidth;
const HEIGHT = () => graphCanvas.clientHeight;

const svg = d3.select('#graph-canvas').append('svg')
  .attr('width', '100%')
  .attr('height', '100%');

// Zoom
const zoomG = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.1, 5]).on('zoom', e => {
  zoomG.attr('transform', e.transform);
}));

// Defs arrow
svg.append('defs').append('marker')
  .attr('id','arrowhead')
  .attr('viewBox','-0 -5 10 10')
  .attr('refX',28).attr('refY',0)
  .attr('orient','auto').attr('markerWidth',6).attr('markerHeight',6)
  .append('path').attr('d','M 0,-5 L 10,0 L 0,5').attr('fill','#555');

const linkG = zoomG.append('g').attr('class','links');
const nodeG = zoomG.append('g').attr('class','nodes');

let allNodes = [];
let allEdges = [];
let activeFilter = '';

const simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(120))
  .force('charge', d3.forceManyBody().strength(-350))
  .force('center', d3.forceCenter())
  .force('collision', d3.forceCollide(35));

function updateCenter() {
  simulation.force('center', d3.forceCenter(WIDTH()/2, HEIGHT()/2));
}

window.addEventListener('resize', () => { updateCenter(); simulation.alpha(0.3).restart(); });
updateCenter();

const tooltip = document.getElementById('tooltip');
const ttName = document.getElementById('tt-name');
const ttLabel = document.getElementById('tt-label');

function getVisibleNodes() {
  if (!activeFilter) return allNodes;
  return allNodes.filter(n => {
    const lbl = ((n.properties && n.properties.label) || n.label || '').toUpperCase();
    return lbl === activeFilter.toUpperCase();
  });
}

function getVisibleEdges(visNodes) {
  const ids = new Set(visNodes.map(n => n.id));
  return allEdges.filter(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    return ids.has(sid) && ids.has(tid);
  });
}

let selectedNode = null;

function renderGraph() {
  const visNodes = getVisibleNodes();
  const visEdges = getVisibleEdges(visNodes);

  // Links
  const link = linkG.selectAll('.link-g')
    .data(visEdges, d => `${typeof d.source==='object'?d.source.id:d.source}-${typeof d.target==='object'?d.target.id:d.target}-${d.type}`)
    .join(
      enter => {
        const g = enter.append('g').attr('class','link-g');
        g.append('line')
          .attr('class','edge-line')
          .attr('stroke','#444')
          .attr('stroke-width',1.5)
          .attr('marker-end','url(#arrowhead)');
        // Background rect for edge label readability
        g.append('rect')
          .attr('class','edge-label-bg')
          .attr('fill','rgba(15,17,23,0.8)')
          .attr('rx',3).attr('ry',3);
        g.append('text')
          .attr('class','edge-label')
          .attr('fill','#999')
          .attr('font-size','11px')
          .attr('text-anchor','middle')
          .attr('dominant-baseline','middle')
          .text(d => d.type || '');
        return g;
      }
    );

  // Nodes
  const node = nodeG.selectAll('.node-g')
    .data(visNodes, d => d.id)
    .join(
      enter => {
        const g = enter.append('g').attr('class','node-g').style('cursor','pointer');

        g.append('circle')
          .attr('r', 20)
          .attr('fill', d => COLORS[(d.properties && d.properties.label) || d.label] || COLORS[d.type] || '#666')
          .attr('stroke','#1c2333')
          .attr('stroke-width', 2)
          .style('opacity', 0)
          .transition().duration(400)
          .style('opacity', 1);

        g.append('text')
          .attr('y', 34)
          .attr('text-anchor','middle')
          .attr('font-size','10px')
          .attr('fill','#aaa')
          .style('opacity', 0)
          .text(d => ((d.properties && d.properties.name) || d.name || d.id || '').substring(0,20))
          .transition().duration(400)
          .style('opacity', 1);

        g.call(d3.drag()
          .on('start', (event, d) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
          })
          .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
          .on('end', (event, d) => {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
          })
        );

        g.on('mouseover', (event, d) => {
          const name = (d.properties && d.properties.name) || d.name || d.id;
          const label = (d.properties && d.properties.label) || d.label || 'Unknown';
          ttName.textContent = name;
          ttLabel.textContent = label;
          tooltip.classList.add('visible');
        });
        g.on('mousemove', event => {
          tooltip.style.left = (event.clientX + 14) + 'px';
          tooltip.style.top = (event.clientY - 28) + 'px';
        });
        g.on('mouseout', () => tooltip.classList.remove('visible'));

        g.on('click', (event, d) => {
          event.stopPropagation();
          selectedNode = selectedNode === d.id ? null : d.id;
          highlightConnected();
        });

        return g;
      }
    );

  svg.on('click', () => { selectedNode = null; highlightConnected(); });

  simulation
    .nodes(visNodes)
    .on('tick', () => {
      linkG.selectAll('.link-g').each(function(d) {
        const g = d3.select(this);
        const sx = d.source.x || 0, sy = d.source.y || 0;
        const tx = d.target.x || 0, ty = d.target.y || 0;
        const mx = (sx+tx)/2, my = (sy+ty)/2;
        g.select('.edge-line').attr('x1',sx).attr('y1',sy).attr('x2',tx).attr('y2',ty);
        const lbl = g.select('.edge-label').attr('x', mx).attr('y', my);
        const bbox = lbl.node() ? lbl.node().getBBox() : {x:mx, y:my, width:0, height:0};
        g.select('.edge-label-bg')
          .attr('x', bbox.x - 3).attr('y', bbox.y - 2)
          .attr('width', bbox.width + 6).attr('height', bbox.height + 4);
      });
      nodeG.selectAll('.node-g').attr('transform', d => `translate(${d.x||0},${d.y||0})`);
    });

  simulation.force('link').links(visEdges);
  simulation.alpha(0.5).restart();

  // Toggle empty state
  document.getElementById('empty-state').style.display = allNodes.length === 0 ? 'flex' : 'none';
}

function highlightConnected() {
  if (!selectedNode) {
    linkG.selectAll('.edge-line').attr('stroke','#444').attr('stroke-width',1.5).attr('opacity',1);
    nodeG.selectAll('circle').attr('opacity',1);
    return;
  }
  const connected = new Set([selectedNode]);
  allEdges.forEach(e => {
    const sid = typeof e.source==='object'?e.source.id:e.source;
    const tid = typeof e.target==='object'?e.target.id:e.target;
    if (sid === selectedNode) connected.add(tid);
    if (tid === selectedNode) connected.add(sid);
  });

  linkG.selectAll('.edge-line').each(function(d) {
    const sid = typeof d.source==='object'?d.source.id:d.source;
    const tid = typeof d.target==='object'?d.target.id:d.target;
    const active = sid === selectedNode || tid === selectedNode;
    d3.select(this)
      .attr('stroke', active ? '#58a6ff' : '#2a2a2a')
      .attr('stroke-width', active ? 2.5 : 1)
      .attr('opacity', active ? 1 : 0.2);
  });

  nodeG.selectAll('circle').attr('opacity', d => connected.has(d.id) ? 1 : 0.25);
}

function mergeGraph(newNodes, newEdges) {
  const existingIds = new Set(allNodes.map(n => n.id));
  newNodes.forEach(n => {
    if (!existingIds.has(n.id)) {
      allNodes.push(n);
      existingIds.add(n.id);
    }
  });

  const edgeKey = e => {
    const s = typeof e.source==='object'?e.source.id:e.source;
    const t = typeof e.target==='object'?e.target.id:e.target;
    return `${s}-${t}-${e.type}`;
  };
  const existingEdgeKeys = new Set(allEdges.map(edgeKey));
  newEdges.forEach(e => {
    if (!existingEdgeKeys.has(edgeKey(e))) {
      allEdges.push({...e});
      existingEdgeKeys.add(edgeKey(e));
    }
  });

  renderGraph();
}

function resetGraph() {
  allNodes = [];
  allEdges = [];
  selectedNode = null;
  nodeG.selectAll('*').remove();
  linkG.selectAll('*').remove();
  document.getElementById('empty-state').style.display = 'flex';
}

// Filter
document.getElementById('filter-select').addEventListener('change', e => {
  activeFilter = e.target.value;
  renderGraph();
});

// Toolbar buttons
document.getElementById('btn-reset').addEventListener('click', resetGraph);

document.getElementById('btn-share').addEventListener('click', () => {
  const url = window.location.origin + window.location.pathname + '?session=' + sessionId;
  navigator.clipboard.writeText(url).then(() => showToast('Link copied!')).catch(() => {
    prompt('Copy this link:', url);
  });
});

document.getElementById('btn-export-png').addEventListener('click', async () => {
  try {
    const canvas = await html2canvas(graphCanvas, {
      backgroundColor: '#0f1117',
      useCORS: true,
    });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'graphknows-graph.png';
    a.click();
    showToast('PNG exported!');
  } catch(e) {
    showToast('Export failed');
  }
});

// ── Session restore ────────────────────────────────────────────────────────
async function restoreSession(id) {
  try {
    const res = await fetch(`/api/session/${id}/graph`);
    if (res.ok) {
      const data = await res.json();
      if (data.nodes && data.edges) {
        mergeGraph(data.nodes, data.edges);
      }
    }
  } catch(e) { /* ignore */ }
}

if (params.get('session')) {
  restoreSession(sessionId);
}

// Initial focus
msgInput.focus();
</script>
