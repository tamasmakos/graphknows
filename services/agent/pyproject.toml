[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphknows-agent"
version = "1.0.0"
description = "Graphknows Agent Service — session-aware FastAPI entry point"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "neo4j>=5.19.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-anyio>=0.0.0",
    "anyio[trio]>=4.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["services.agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
